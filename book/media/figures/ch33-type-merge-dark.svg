<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img"><title>How JSON inference merges the types of a field</title><text x="20" y="24.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#e6edf3" xml:space="preserve">Two values of one field, and the type that inference gives (from infer.py)</text><text x="250" y="57.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="end" fill="#e6edf3" xml:space="preserve">1 + 2</text><polyline points="260,53 300,53" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="300,53 291.0,48.5 291.0,57.5" fill="#7d8590"/><rect x="306" y="42" width="150" height="22" rx="8" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><text x="381.0" y="56.6" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#9be6ae" xml:space="preserve">bigint</text><text x="470" y="57.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#9da7b3" xml:space="preserve">integers are bigint, never int</text><text x="250" y="85.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="end" fill="#e6edf3" xml:space="preserve">1 + 2.5</text><polyline points="260,81 300,81" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="300,81 291.0,76.5 291.0,85.5" fill="#7d8590"/><rect x="306" y="70" width="150" height="22" rx="8" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><text x="381.0" y="84.6" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#9be6ae" xml:space="preserve">double</text><text x="470" y="85.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#9da7b3" xml:space="preserve">two numbers: the wider type</text><text x="250" y="113.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="end" fill="#e6edf3" xml:space="preserve">1 + 99999999999999999999</text><polyline points="260,109 300,109" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="300,109 291.0,104.5 291.0,113.5" fill="#7d8590"/><rect x="306" y="98" width="150" height="22" rx="8" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><text x="381.0" y="112.6" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#9be6ae" xml:space="preserve">decimal(20,0)</text><text x="470" y="113.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#9da7b3" xml:space="preserve">too large for bigint</text><text x="250" y="141.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="end" fill="#e6edf3" xml:space="preserve">1 + &quot;2&quot;</text><polyline points="260,137 300,137" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="300,137 291.0,132.5 291.0,141.5" fill="#7d8590"/><rect x="306" y="126" width="150" height="22" rx="8" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1.5"/><text x="381.0" y="140.6" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#ffb3b3" xml:space="preserve">string</text><text x="470" y="141.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#9da7b3" xml:space="preserve">different kinds: the text stays, the type goes</text><text x="250" y="169.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="end" fill="#e6edf3" xml:space="preserve">1 + true</text><polyline points="260,165 300,165" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="300,165 291.0,160.5 291.0,169.5" fill="#7d8590"/><rect x="306" y="154" width="150" height="22" rx="8" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1.5"/><text x="381.0" y="168.6" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#ffb3b3" xml:space="preserve">string</text><text x="470" y="169.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#9da7b3" xml:space="preserve"></text><text x="250" y="197.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="end" fill="#e6edf3" xml:space="preserve">1 + {&quot;x&quot;: 1}</text><polyline points="260,193 300,193" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="300,193 291.0,188.5 291.0,197.5" fill="#7d8590"/><rect x="306" y="182" width="150" height="22" rx="8" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1.5"/><text x="381.0" y="196.6" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#ffb3b3" xml:space="preserve">string</text><text x="470" y="197.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#9da7b3" xml:space="preserve"></text><text x="250" y="225.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="end" fill="#e6edf3" xml:space="preserve">{&quot;x&quot;: 1} + {&quot;y&quot;: &quot;a&quot;}</text><polyline points="260,221 300,221" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="300,221 291.0,216.5 291.0,225.5" fill="#7d8590"/><rect x="306" y="210" width="150" height="22" rx="8" fill="#16263d" stroke="#5b9cf5" stroke-width="1.5"/><text x="381.0" y="224.6" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#a8caff" xml:space="preserve">struct&lt;x,y&gt;</text><text x="470" y="225.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#9da7b3" xml:space="preserve">two objects merge field by field</text><text x="250" y="253.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="end" fill="#e6edf3" xml:space="preserve">null + null</text><polyline points="260,249 300,249" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="300,249 291.0,244.5 291.0,253.5" fill="#7d8590"/><rect x="306" y="238" width="150" height="22" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="381.0" y="252.6" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">string</text><text x="470" y="253.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#9da7b3" xml:space="preserve">null has no type</text><text x="250" y="281.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="end" fill="#e6edf3" xml:space="preserve">&quot;2026-10-01&quot;</text><polyline points="260,277 300,277" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="300,277 291.0,272.5 291.0,281.5" fill="#7d8590"/><rect x="306" y="266" width="150" height="22" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="381.0" y="280.6" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">string</text><text x="470" y="281.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#9da7b3" xml:space="preserve">no date inference by default</text></svg>
