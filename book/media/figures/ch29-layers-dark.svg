<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img"><title>The layers of a Spark Connect client</title><text x="20" y="26.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#e6edf3" xml:space="preserve">miniconnect.py: 212 lines of Python on three libraries (no pyspark)</text><rect x="20" y="44" width="860" height="56" rx="8" fill="#16263d" stroke="#5b9cf5" stroke-width="1.5"/><text x="36" y="78.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#a8caff" xml:space="preserve">DataFrame API</text><text x="220" y="68.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" text-anchor="start" fill="#a8caff" xml:space="preserve">90 lines: Column, DataFrame, GroupedData, col, lit, fn</text><text x="220" y="87.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" fill="#9da7b3" xml:space="preserve">Relation and Expression trees</text><rect x="20" y="108" width="860" height="56" rx="8" fill="#271c3d" stroke="#a78bfa" stroke-width="1.5"/><text x="36" y="142.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#d4c4ff" xml:space="preserve">Session and RPCs</text><text x="220" y="132.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" text-anchor="start" fill="#d4c4ff" xml:space="preserve">104 lines: ExecutePlan, AnalyzePlan, ReattachExecute, ReleaseExecute, errors</text><text x="220" y="151.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" fill="#9da7b3" xml:space="preserve">session ID, operation ID, error details</text><rect x="20" y="172" width="860" height="56" rx="8" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><text x="36" y="206.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#9be6ae" xml:space="preserve">Arrow</text><text x="220" y="196.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" text-anchor="start" fill="#9be6ae" xml:space="preserve">pyarrow.ipc.open_stream on each ArrowBatch.data</text><text x="220" y="215.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" fill="#9da7b3" xml:space="preserve">pyarrow 26.0.1</text><rect x="20" y="236" width="860" height="56" rx="8" fill="#3a2416" stroke="#ff8a4c" stroke-width="1.5"/><text x="36" y="270.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#ffbe99" xml:space="preserve">protobuf</text><text x="220" y="260.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" text-anchor="start" fill="#ffbe99" xml:space="preserve">generated by protoc from 11 .proto files at v4.3.0: 376 message types</text><text x="220" y="279.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" fill="#9da7b3" xml:space="preserve">protobuf 7.36.2, grpcio-tools</text><rect x="20" y="300" width="860" height="56" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="36" y="334.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#e6edf3" xml:space="preserve">gRPC</text><text x="220" y="324.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" text-anchor="start" fill="#e6edf3" xml:space="preserve">one channel, HTTP/2, the SparkConnectService stub</text><text x="220" y="343.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" fill="#9da7b3" xml:space="preserve">grpcio 1.85.3</text><text x="20" y="376.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#9da7b3" font-style="italic" xml:space="preserve">The top two layers are the code of this chapter. The bottom three are libraries that exist in most languages.</text></svg>
