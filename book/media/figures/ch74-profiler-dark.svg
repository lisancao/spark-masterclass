<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Wall time of three UDFs with the perf profiler off and on"><title>Wall time of three UDFs with the perf profiler off and on</title><style>svg{--ink:#e5e7eb;--mute:#a3abb8;--line:#6b7280;--soft:#2a2e38;--br:#c99560;--si:#7aa2dc;--go:#f0924a;--ok:#72c08f;--bad:#ef7666;--gr:#aab2bf;--pu:#a98be0}</style><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mute)"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)"/></marker><marker id="ah-br" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--br)"/></marker><marker id="ah-si" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--si)"/></marker><marker id="ah-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--go)"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gr)"/></marker><marker id="ah-pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pu)"/></marker></defs><text x="20" y="26" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="start">200,000 rows: median wall time of 5 runs, profiler off against spark.sql.pyspark.udf.profiler=perf</text><text x="20" y="76" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">cheap</text><rect x="120" y="54" width="28.000000000000004" height="20" rx="2" fill="var(--si)" fill-opacity="0.5" stroke="var(--si)" stroke-width="0"/><text x="154.0" y="69" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="var(--ink)" text-anchor="start">0.28s off</text><rect x="120" y="78" width="594.0" height="20" rx="2" fill="var(--go)" fill-opacity="0.6" stroke="var(--go)" stroke-width="0"/><text x="720.0" y="93" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="var(--bad)" text-anchor="start">5.94s perf, ratio 21.4</text><text x="20" y="134" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">slow</text><rect x="120" y="112" width="149.0" height="20" rx="2" fill="var(--si)" fill-opacity="0.5" stroke="var(--si)" stroke-width="0"/><text x="275.0" y="127" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="var(--ink)" text-anchor="start">1.49s off</text><rect x="120" y="136" width="620.0" height="20" rx="2" fill="var(--go)" fill-opacity="0.6" stroke="var(--go)" stroke-width="0"/><text x="746.0" y="151" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="var(--bad)" text-anchor="start">6.20s perf, ratio 4.2</text><text x="20" y="192" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">pandas</text><rect x="120" y="170" width="16.0" height="20" rx="2" fill="var(--si)" fill-opacity="0.5" stroke="var(--si)" stroke-width="0"/><text x="142.0" y="185" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="var(--ink)" text-anchor="start">0.16s off</text><rect x="120" y="194" width="13.0" height="20" rx="2" fill="var(--go)" fill-opacity="0.6" stroke="var(--go)" stroke-width="0"/><text x="139.0" y="209" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="start">0.13s perf, ratio 0.8</text><text x="20" y="230" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="start">The row profiler wraps each call. One pandas call covers a full Arrow batch.</text></svg>
