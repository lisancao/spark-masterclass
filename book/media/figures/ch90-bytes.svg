<text x="12" y="340.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8a919e" text-anchor="start" font-weight="400" font-style="italic">Field k: its name is the metadata entry of id k, and its data starts at offset k.</text>
<text x="12" y="356.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8a919e" text-anchor="start" font-weight="400" font-style="italic">The ids and offsets follow the sort of the names (amount, event, ts, user_id). The data keeps the JSON order.</text>
<text x="12" y="384.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8a919e" text-anchor="start" font-weight="400">Header bytes: low 2 bits = basic type, high 6 bits = type info. 0x11 = SHORT_STR, length 4.</text>
<text x="12" y="400.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8a919e" text-anchor="start" font-weight="400">0x0c = PRIMITIVE INT1. 0x20 = PRIMITIVE DECIMAL4 (scale 2, unscaled 613). 0x4d = SHORT_STR, length 19.</text></svg>
