<text x="336.0" y="87.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a919e" text-anchor="start" font-weight="700">0.4 s</text>
<text x="300" y="108.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8a919e" text-anchor="start" font-weight="400" font-style="italic">local_reuse.py, reuse, process 2</text>
<text x="288" y="134.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a919e" text-anchor="end" font-weight="600">new sandbox server for an agent</text>
<rect x="300" y="120" width="343.0" height="20" rx="3" fill="#c0661a" fill-opacity="1"/>
<text x="651.0" y="135.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a919e" text-anchor="start" font-weight="700">4.9 s</text>
<text x="300" y="156.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8a919e" text-anchor="start" font-weight="400" font-style="italic">sandbox.py, about 480 MB JVM each</text>
<text x="288" y="182.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a919e" text-anchor="end" font-weight="600">new session on a running shared server</text>
