<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230" role="img"><title>Seconds to the first answer, by how the client gets a server</title><defs></defs><text x="288" y="38.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a919e" text-anchor="end" font-weight="600">new local server in each process</text>
<rect x="300" y="24" width="308.0" height="20" rx="3" fill="#4b5563" fill-opacity="1"/>
<text x="616.0" y="39.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a919e" text-anchor="start" font-weight="700">4.4 s</text>
<text x="300" y="60.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8a919e" text-anchor="start" font-weight="400" font-style="italic">local_reuse.py, fresh, process 2</text>
<text x="288" y="86.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a919e" text-anchor="end" font-weight="600">reused local server (4.3)</text>
