<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" role="img"><title>What one script with a loop runs</title><text x="20" y="26.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1f2328" xml:space="preserve">One spark.sql() call with a 5-pass WHILE loop</text><text x="20" y="52.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#57606a" xml:space="preserve">20 SQL executions</text><rect x="20" y="62" width="24" height="24" rx="4" fill="#fff0e6" stroke="#e8590c" stroke-width="1.5"/><rect x="50" y="62" width="24" height="24" rx="4" fill="#fff0e6" stroke="#e8590c" stroke-width="1.5"/><rect x="80" y="62" width="24" height="24" rx="4" fill="#fff0e6" stroke="#e8590c" stroke-width="1.5"/><rect x="110" y="62" width="24" height="24" rx="4" fill="#fff0e6" stroke="#e8590c" stroke-width="1.5"/><rect x="140" y="62" width="24" height="24" rx="4" fill="#fff0e6" stroke="#e8590c" stroke-width="1.5"/><rect x="170" y="62" width="24" height="24" rx="4" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><rect x="200" y="62" width="24" height="24" rx="4" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><rect x="230" y="62" width="24" height="24" rx="4" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><rect x="260" y="62" width="24" height="24" rx="4" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><rect x="290" y="62" width="24" height="24" rx="4" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><rect x="320" y="62" width="24" height="24" rx="4" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><rect x="350" y="62" width="24" height="24" rx="4" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><rect x="380" y="62" width="24" height="24" rx="4" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><rect x="410" y="62" width="24" height="24" rx="4" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><rect x="440" y="62" width="24" height="24" rx="4" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><rect x="470" y="62" width="24" height="24" rx="4" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><rect x="500" y="62" width="24" height="24" rx="4" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><rect x="530" y="62" width="24" height="24" rx="4" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><rect x="560" y="62" width="24" height="24" rx="4" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><rect x="590" y="62" width="24" height="24" rx="4" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><text x="20" y="108.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#9a3412" xml:space="preserve">5 scan the trips</text><text x="170" y="108.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#57606a" xml:space="preserve">15 with no scan: conditions, SET, DECLARE, the final SELECT</text><text x="640" y="52.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#9a3412" xml:space="preserve">27 jobs</text><text x="20" y="160.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1f2328" xml:space="preserve">The same total as one query (BETWEEN 132 AND 136)</text><text x="20" y="186.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#57606a" xml:space="preserve">1 SQL execution</text><rect x="20" y="196" width="24" height="24" rx="4" fill="#e7f5ec" stroke="#2f9e44" stroke-width="1.5"/><text x="640" y="186.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#1e6b30" xml:space="preserve">2 jobs</text><text x="60" y="214.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#57606a" xml:space="preserve">total = 149702 in both</text><text x="812" y="242.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end" fill="#57606a" font-style="italic" xml:space="preserve">each square is one SQL execution; the order of the colours is schematic</text></svg>
