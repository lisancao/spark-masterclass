<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img"><title>A stream-static join on a folder that changes</title><defs><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3A9B3"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A606B"/></marker><marker id="ah-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E4E0D8"/></marker><marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F07A3C"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7BC496"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7FB0E6"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E6B455"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F08070"/></marker></defs><text x="20" y="22.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A3A9B3" text-anchor="start" dominant-baseline="middle">Labels found in each batch (s12_stream_static.txt)</text><text x="330" y="56.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">batch 0: v1 has two airport zones</text><text x="510" y="56.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">batch 1: new file v2 added</text><text x="690" y="56.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">batch 2: v1 rewritten</text><text x="230" y="108.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#E4E0D8" text-anchor="end" dominant-baseline="middle">a) static DataFrame in the query</text><rect x="250" y="80" width="165" height="56" rx="6" fill="#1E3A2B" stroke="#7BC496" stroke-width="1.5" opacity="1"/><text x="332.5" y="107.94" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">airport</text><rect x="430" y="80" width="165" height="56" rx="6" fill="#3D3018" stroke="#E6B455" stroke-width="1.5" opacity="1"/><text x="512.5" y="107.94" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">airport only</text><rect x="610" y="80" width="165" height="56" rx="6" fill="#46221E" stroke="#F08070" stroke-width="1.5" opacity="1"/><text x="692.5" y="107.94" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">FILE_NOT_EXIST</text><text x="230" y="198.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#E4E0D8" text-anchor="end" dominant-baseline="middle">b) read again in foreachBatch</text><rect x="250" y="170" width="165" height="56" rx="6" fill="#1E3A2B" stroke="#7BC496" stroke-width="1.5" opacity="1"/><text x="332.5" y="197.94" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">airport</text><rect x="430" y="170" width="165" height="56" rx="6" fill="#1E3A2B" stroke="#7BC496" stroke-width="1.5" opacity="1"/><text x="512.5" y="197.94" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">airport, midtown, uptown</text><rect x="610" y="170" width="165" height="56" rx="6" fill="#1E3A2B" stroke="#7BC496" stroke-width="1.5" opacity="1"/><text x="692.5" y="197.94" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">+ times-sq</text><text x="20" y="268.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#E4E0D8" text-anchor="start" dominant-baseline="middle">a) keeps the file list of the moment it was made. b) lists the folder again at the start of each batch.</text></svg>
