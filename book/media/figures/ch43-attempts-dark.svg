<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Task attempts under local[4,2], and the values that row 120 got in each attempt"><title>Task attempts under local[4,2], and the values that row 120 got in each attempt</title><style>svg{--ink:#e5e7eb;--mute:#a3abb8;--line:#6b7280;--soft:#2a2e38;--br:#c99560;--si:#7aa2dc;--go:#f0924a;--ok:#72c08f;--bad:#ef7666;--gr:#aab2bf;--pu:#a98be0}</style><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mute)"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)"/></marker><marker id="ah-br" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--br)"/></marker><marker id="ah-si" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--si)"/></marker><marker id="ah-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--go)"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gr)"/></marker><marker id="ah-pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pu)"/></marker></defs><text x="20" y="26" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="start">local[4,2]: the attempt files of the four partitions</text><text x="20" y="64" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">partition 0</text><rect x="120" y="48" width="240" height="28" rx="4" fill="var(--ok)" fill-opacity="0.25" stroke="var(--ok)" stroke-width="1.6"/><text x="130" y="67" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">p0_a0</text><text x="20" y="104" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">partition 1</text><rect x="120" y="88" width="240" height="28" rx="4" fill="var(--bad)" fill-opacity="0.25" stroke="var(--bad)" stroke-width="1.6"/><text x="130" y="107" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">p1_a0: fails at row 150</text><rect x="380" y="88" width="240" height="28" rx="4" fill="var(--ok)" fill-opacity="0.25" stroke="var(--ok)" stroke-width="1.6"/><text x="390" y="107" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">p1_a1: runs all rows again</text><line x1="360" y1="102" x2="378" y2="102" stroke="var(--bad)" stroke-width="1.6" marker-end="url(#ah-bad)"/><text x="20" y="144" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">partition 2</text><rect x="120" y="128" width="240" height="28" rx="4" fill="var(--ok)" fill-opacity="0.25" stroke="var(--ok)" stroke-width="1.6"/><text x="130" y="147" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">p2_a0</text><text x="20" y="184" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">partition 3</text><rect x="120" y="168" width="240" height="28" rx="4" fill="var(--ok)" fill-opacity="0.25" stroke="var(--ok)" stroke-width="1.6"/><text x="130" y="187" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">p3_a0</text><text x="20" y="222" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">Row 120 is in partition 1, so it ran in both attempts:</text><text x="28" y="244.96" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="var(--mute)" text-anchor="start"></text><text x="352" y="244.96" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="var(--mute)" text-anchor="end">random.random()</text><text x="552" y="244.96" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="var(--mute)" text-anchor="end">rand(7)</text><line x1="20" y1="252" x2="560" y2="252" stroke="var(--line)" stroke-width="1.2"/><text x="28" y="266.96" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">attempt 0</text><text x="352" y="266.96" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="end">0.487818</text><text x="552" y="266.96" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="end">0.611899</text><text x="28" y="288.96" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">attempt 1</text><text x="352" y="288.96" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="end">0.563658</text><text x="552" y="288.96" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="end">0.611899</text><text x="580" y="262" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ok)" text-anchor="start">rand(7): the same value (seed + partition index)</text><text x="580" y="282" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--bad)" text-anchor="start">random.random(): a new value on the retry</text><text x="620" y="60" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="start">Under local[4], one failure stops the job.</text><text x="620" y="78" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="start">local[N,F] gives F attempts to a task.</text></svg>
