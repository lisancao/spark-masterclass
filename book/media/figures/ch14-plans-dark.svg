<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img"><title>Typed and untyped plans for the same logic</title><text x="20" y="28.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="start" fill="#e6edf3" xml:space="preserve">trips.filter(t =&gt; t.fare_amount &gt; 0).map(...)  against  where(...).select(...)</text><text x="30" y="62.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#ffbe99" xml:space="preserve">typed (Dataset[Trip])</text><rect x="30" y="74" width="340" height="38" rx="8" fill="#3a2416" stroke="#ff8a4c" stroke-width="1.5"/><text x="200.0" y="90.2" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#ffbe99" xml:space="preserve">SerializeFromObject</text><text x="200.0" y="106.1" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#ffbe99" xml:space="preserve">Tuple2 -&gt; row</text><rect x="30" y="120" width="340" height="38" rx="8" fill="#3a2416" stroke="#ff8a4c" stroke-width="1.5"/><text x="200.0" y="136.2" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#ffbe99" xml:space="preserve">MapElements</text><text x="200.0" y="152.1" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#ffbe99" xml:space="preserve">lambda on a Trip object</text><line x1="200" y1="112" x2="200" y2="120" stroke="#7d8590" stroke-width="1.5"/><rect x="30" y="166" width="340" height="38" rx="8" fill="#3a2416" stroke="#ff8a4c" stroke-width="1.5"/><text x="200.0" y="182.2" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#ffbe99" xml:space="preserve">Filter</text><text x="200.0" y="198.1" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#ffbe99" xml:space="preserve">invoke(lambda.apply(obj))</text><line x1="200" y1="158" x2="200" y2="166" stroke="#7d8590" stroke-width="1.5"/><rect x="30" y="212" width="340" height="38" rx="8" fill="#3a2416" stroke="#ff8a4c" stroke-width="1.5"/><text x="200.0" y="228.2" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#ffbe99" xml:space="preserve">DeserializeToObject</text><text x="200.0" y="244.1" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#ffbe99" xml:space="preserve">row -&gt; new Trip(...)</text><line x1="200" y1="204" x2="200" y2="212" stroke="#7d8590" stroke-width="1.5"/><rect x="30" y="258" width="340" height="38" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="200.0" y="280.8" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">ColumnarToRow</text><line x1="200" y1="250" x2="200" y2="258" stroke="#7d8590" stroke-width="1.5"/><rect x="30" y="304" width="340" height="38" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="200.0" y="320.2" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">FileScan parquet</text><text x="200.0" y="336.1" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">6 columns, DataFilters: []</text><line x1="200" y1="296" x2="200" y2="304" stroke="#7d8590" stroke-width="1.5"/><text x="430" y="62.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#a8caff" xml:space="preserve">untyped (DataFrame)</text><rect x="430" y="74" width="340" height="38" rx="8" fill="#16263d" stroke="#5b9cf5" stroke-width="1.5"/><text x="600.0" y="90.2" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#a8caff" xml:space="preserve">Project</text><text x="600.0" y="106.1" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#a8caff" xml:space="preserve">PULocationID, tip_amount / fare_amount</text><rect x="430" y="120" width="340" height="38" rx="8" fill="#16263d" stroke="#5b9cf5" stroke-width="1.5"/><text x="600.0" y="136.2" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#a8caff" xml:space="preserve">Filter</text><text x="600.0" y="152.1" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#a8caff" xml:space="preserve">isnotnull(fare_amount) AND fare_amount &gt; 0.0</text><line x1="600" y1="112" x2="600" y2="120" stroke="#7d8590" stroke-width="1.5"/><rect x="430" y="166" width="340" height="38" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="600.0" y="188.8" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">ColumnarToRow</text><line x1="600" y1="158" x2="600" y2="166" stroke="#7d8590" stroke-width="1.5"/><rect x="430" y="212" width="340" height="38" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="600.0" y="228.2" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">FileScan parquet</text><text x="600.0" y="244.1" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">3 columns</text><line x1="600" y1="204" x2="600" y2="212" stroke="#7d8590" stroke-width="1.5"/><text x="430" y="290.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#9da7b3" xml:space="preserve">the lambda is a black box: no pushdown,</text><text x="430" y="308.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#9da7b3" xml:space="preserve">and each row becomes a JVM object and back</text><text x="780" y="350.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end" fill="#9da7b3" font-style="italic" xml:space="preserve">physical plans from datasets.txt, Spark 4.3.0 Classic</text></svg>
