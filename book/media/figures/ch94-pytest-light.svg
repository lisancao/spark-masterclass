<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Ten tests with three kinds of session: where the time goes"><title>Ten tests with three kinds of session: where the time goes</title><style>svg{--ink:#1f2937;--mute:#5b6472;--line:#9aa3af;--soft:#eef0f3;--br:#8a5a2b;--si:#3a5f96;--go:#c0661a;--ok:#3f7d58;--bad:#b03a2e;--gr:#4b5563;--pu:#6b4fa0}</style><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mute)"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)"/></marker><marker id="ah-br" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--br)"/></marker><marker id="ah-si" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--si)"/></marker><marker id="ah-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--go)"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gr)"/></marker><marker id="ah-pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pu)"/></marker></defs><text x="20" y="28" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="start">The same 10 tests, three kinds of session (one run each, seconds)</text><rect x="420" y="42" width="14" height="14" rx="2" fill="var(--go)" fill-opacity="0.7" stroke="var(--go)" stroke-width="0"/><text x="440" y="54" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">session start (setup)</text><rect x="580" y="42" width="14" height="14" rx="2" fill="var(--pu)" fill-opacity="0.7" stroke="var(--pu)" stroke-width="0"/><text x="600" y="54" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">first UDF call</text><rect x="740" y="42" width="14" height="14" rx="2" fill="var(--si)" fill-opacity="0.7" stroke="var(--si)" stroke-width="0"/><text x="760" y="54" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">the rest</text><text x="290" y="102" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="end">MODE=classic (local[2])</text><rect x="300" y="85" width="281.82" height="24" rx="2" fill="var(--go)" fill-opacity="0.7" stroke="var(--go)" stroke-width="0"/><rect x="581.8199999999999" y="85" width="149.52" height="24" rx="2" fill="var(--pu)" fill-opacity="0.7" stroke="var(--pu)" stroke-width="0"/><rect x="731.3399999999999" y="85" width="106.26000000000003" height="24" rx="2" fill="var(--si)" fill-opacity="0.7" stroke="var(--si)" stroke-width="0"/><text x="845.5999999999999" y="102" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="start">12.80 s</text><text x="290" y="154" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="end">MODE=connect, .remote(&quot;local[2]&quot;)</text><rect x="300" y="137" width="219.23999999999998" height="24" rx="2" fill="var(--go)" fill-opacity="0.7" stroke="var(--go)" stroke-width="0"/><rect x="519.24" y="137" width="152.46" height="24" rx="2" fill="var(--pu)" fill-opacity="0.7" stroke="var(--pu)" stroke-width="0"/><rect x="671.7" y="137" width="107.10000000000002" height="24" rx="2" fill="var(--si)" fill-opacity="0.7" stroke="var(--si)" stroke-width="0"/><text x="786.8000000000001" y="154" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="start">11.40 s</text><text x="290" y="206" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="end">MODE=connect, sc://localhost:15118</text><rect x="300.0" y="189" width="58.379999999999995" height="24" rx="2" fill="var(--pu)" fill-opacity="0.7" stroke="var(--pu)" stroke-width="0"/><rect x="358.38" y="189" width="32.34000000000001" height="24" rx="2" fill="var(--si)" fill-opacity="0.7" stroke="var(--si)" stroke-width="0"/><text x="398.72" y="206" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="start">2.16 s</text><text x="20" y="238" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="start">From pytest --durations: setup is the session fixture, the first UDF call starts the Python workers.</text></svg>
