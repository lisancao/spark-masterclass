<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img"><title>The regions of the default 1 GiB heap</title><defs><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3A9B3"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A606B"/></marker><marker id="ah-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E4E0D8"/></marker><marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F07A3C"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7BC496"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7FB0E6"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E6B455"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F08070"/></marker></defs><text x="20" y="22.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E4E0D8" text-anchor="start" dominant-baseline="middle">Default driver heap in local mode: 1024 MiB (memory.txt)</text><rect x="20" y="50" width="240.234375" height="64" rx="4" fill="#353944" stroke="#A3A9B3" stroke-width="1.5" opacity="1"/><text x="140.1171875" y="75.055" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">reserved</text><text x="140.1171875" y="90.695" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">300 MiB</text><rect x="260.234375" y="50" width="231.90625000000003" height="64" rx="4" fill="#1D3049" stroke="#7FB0E6" stroke-width="1.5" opacity="1"/><text x="376.1875" y="75.055" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">user memory</text><text x="376.1875" y="90.695" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">289.6 MiB</text><rect x="492.140625" y="50" width="173.9296875" height="64" rx="4" fill="#4A2A1C" stroke="#F07A3C" stroke-width="1.5" opacity="1"/><text x="579.10546875" y="75.055" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">execution</text><text x="579.10546875" y="90.695" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">217.2 MiB</text><rect x="666.0703125" y="50" width="173.9296875" height="64" rx="4" fill="#1E3A2B" stroke="#7BC496" stroke-width="1.5" opacity="1"/><text x="753.03515625" y="75.055" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">storage</text><text x="753.03515625" y="90.695" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">217.2 MiB</text><path d="M492.140625,124 L492.140625,134 L840,134 L840,124" stroke="#F07A3C" stroke-width="1.6" fill="none"/><text x="666.0703125" y="152.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#F07A3C" text-anchor="middle" dominant-baseline="middle">unified pool = (1024 - 300) x 0.6 = 434.4 MiB</text><line x1="666.0703125" y1="44" x2="666.0703125" y2="120" stroke="#E4E0D8" stroke-width="1.5" stroke-dasharray="4 3"/><text x="666.0703125" y="38.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">storageFraction 0.5 (soft line)</text><text x="20" y="190.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#E4E0D8" text-anchor="start" dominant-baseline="middle">16 tasks run at the same time and share the execution memory:</text><text x="20" y="214.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#E4E0D8" text-anchor="start" dominant-baseline="middle">each task gets between 1/(2N) and 1/N of it: 13.6 MiB to 27.1 MiB</text><rect x="20" y="236" width="45" height="26" rx="3" fill="#4A2A1C" stroke="#F07A3C" stroke-width="1.5" opacity="1"/><text x="42.5" y="249.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">t1</text><rect x="71" y="236" width="45" height="26" rx="3" fill="#4A2A1C" stroke="#F07A3C" stroke-width="1.5" opacity="1"/><text x="93.5" y="249.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">t2</text><rect x="122" y="236" width="45" height="26" rx="3" fill="#4A2A1C" stroke="#F07A3C" stroke-width="1.5" opacity="1"/><text x="144.5" y="249.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">t3</text><rect x="173" y="236" width="45" height="26" rx="3" fill="#4A2A1C" stroke="#F07A3C" stroke-width="1.5" opacity="1"/><text x="195.5" y="249.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">t4</text><rect x="224" y="236" width="45" height="26" rx="3" fill="#4A2A1C" stroke="#F07A3C" stroke-width="1.5" opacity="1"/><text x="246.5" y="249.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">t5</text><rect x="275" y="236" width="45" height="26" rx="3" fill="#4A2A1C" stroke="#F07A3C" stroke-width="1.5" opacity="1"/><text x="297.5" y="249.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">t6</text><rect x="326" y="236" width="45" height="26" rx="3" fill="#4A2A1C" stroke="#F07A3C" stroke-width="1.5" opacity="1"/><text x="348.5" y="249.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">t7</text><rect x="377" y="236" width="45" height="26" rx="3" fill="#4A2A1C" stroke="#F07A3C" stroke-width="1.5" opacity="1"/><text x="399.5" y="249.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">t8</text><rect x="428" y="236" width="45" height="26" rx="3" fill="#4A2A1C" stroke="#F07A3C" stroke-width="1.5" opacity="1"/><text x="450.5" y="249.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-s