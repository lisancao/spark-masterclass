><rect x="785" y="236" width="45" height="26" rx="3" fill="#4A2A1C" stroke="#F07A3C" stroke-width="1.5" opacity="1"/><text x="807.5" y="249.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">t16</text><text x="20" y="284.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A3A9B3" text-anchor="start" dominant-baseline="middle">A task that needs more than its share spills (Step 7).</text></svg>
