<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img"><title>Forty 1 MB blobs inline in one Parquet file</title><text x="20" y="24.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#e6edf3" xml:space="preserve">file 41.9 MB: one row group, 40 rows</text><rect x="20" y="40" width="520" height="150" rx="8" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><text x="30" y="58.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#9da7b3" xml:space="preserve">row group 0</text><rect x="30" y="70" width="60" height="110" rx="8" fill="#16263d" stroke="#5b9cf5" stroke-width="1.5"/><text x="60.0" y="122.3" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#a8caff" xml:space="preserve">name</text><text x="60.0" y="137.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="middle" fill="#a8caff" xml:space="preserve">0.000 MB</text><rect x="96" y="70" width="380" height="110" rx="8" fill="#3a2416" stroke="#ff8a4c" stroke-width="1.5"/><text x="286.0" y="122.3" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#ffbe99" xml:space="preserve">content</text><text x="286.0" y="139.3" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#ffbe99" xml:space="preserve">41.945 MB, no min/max</text><rect x="482" y="70" width="50" height="110" rx="8" fill="#16263d" stroke="#5b9cf5" stroke-width="1.5"/><text x="507.0" y="122.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#a8caff" xml:space="preserve">shelf</text><text x="507.0" y="136.9" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="middle" fill="#a8caff" xml:space="preserve">0.000</text><text x="580" y="58.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#e6edf3" xml:space="preserve">11 scan tasks</text><rect x="580" y="68.0" width="190" height="8" rx="2" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><rect x="580" y="79.5" width="30" height="8" rx="2" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="580" y="91.0" width="30" height="8" rx="2" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="580" y="102.5" width="30" height="8" rx="2" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="580" y="114.0" width="30" height="8" rx="2" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="580" y="125.5" width="30" height="8" rx="2" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="580" y="137.0" width="30" height="8" rx="2" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="580" y="148.5" width="30" height="8" rx="2" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="580" y="160.0" width="30" height="8" rx="2" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="580" y="171.5" width="30" height="8" rx="2" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="580" y="183.0" width="30" height="8" rx="2" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><text x="778" y="77.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#9be6ae" xml:space="preserve">40 rows</text><text x="580" y="200.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#9da7b3" xml:space="preserve">one task gets all 40 rows, ten tasks get none</text><text x="20" y="220.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#a8caff" xml:space="preserve">A query on name and shelf reads struct&lt;name:string,shelf:int&gt;: column pruning skips content.</text><text x="20" y="244.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#9da7b3" xml:space="preserve">Random bytes do not compress: compressed 41.945 MB, raw 41.943 MB.</text><text x="20" y="268.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#9da7b3" xml:space="preserve">A row group cannot split, so a table of large blobs reads with little parallelism.</text></svg>
