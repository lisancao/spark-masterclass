<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="The five steps of StartRun, and what each step causes"><title>The five steps of StartRun, and what each step causes</title><style>svg{--ink:#1f2937;--mute:#5b6472;--line:#9aa3af;--soft:#eef0f3;--br:#8a5a2b;--si:#3a5f96;--go:#c0661a;--ok:#3f7d58;--bad:#b03a2e;--gr:#4b5563;--pu:#6b4fa0}</style><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mute)"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)"/></marker><marker id="ah-br" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--br)"/></marker><marker id="ah-si" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--si)"/></marker><marker id="ah-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--go)"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gr)"/></marker><marker id="ah-pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pu)"/></marker></defs><rect x="20" y="40" width="164" height="62" rx="8" fill="var(--si)" fill-opacity="0.16" stroke="var(--si)" stroke-width="1.6"/><text x="102.0" y="67.15" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">1. resolve</text><text x="102.0" y="83.95" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12.04" font-weight="400" fill="var(--mute)" text-anchor="middle">DataflowGraph.resolve</text><line x1="184" y1="71" x2="197" y2="71" stroke="var(--line)" stroke-width="1.6" marker-end="url(#ah-line)"/><text x="24" y="130" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">a name or a column</text><text x="24" y="146" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">that does not exist</text><rect x="199" y="40" width="164" height="62" rx="8" fill="var(--si)" fill-opacity="0.16" stroke="var(--si)" stroke-width="1.6"/><text x="281.0" y="67.15" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">2. validate</text><text x="281.0" y="83.95" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12.04" font-weight="400" fill="var(--mute)" text-anchor="middle">GraphValidations</text><line x1="363" y1="71" x2="376" y2="71" stroke="var(--line)" stroke-width="1.6" marker-end="url(#ah-line)"/><text x="203" y="130" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">a cycle (reported first),</text><text x="203" y="146" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">a dataset without a flow</text><rect x="378" y="40" width="164" height="62" rx="8" fill="var(--go)" fill-opacity="0.16" stroke="var(--go)" stroke-width="1.6"/><text x="460.0" y="67.15" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">3. reset</text><text x="460.0" y="83.95" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12.04" font-weight="400" fill="var(--mute)" text-anchor="middle">State.reset</text><line x1="542" y1="71" x2="555" y2="71" stroke="var(--line)" stroke-width="1.6" marker-end="url(#ah-line)"/><text x="382" y="130" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">a new checkpoint version</text><text x="382" y="146" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">for a full refresh</text><rect x="557" y="40" width="164" height="62" rx="8" fill="var(--go)" fill-opacity="0.16" stroke="var(--go)" stroke-width="1.6"/><text x="639.0" y="67.15" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">4. materialize</text><text x="639.0" y="83.95" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12.04" font-weight="400" fill="var(--mute)" text-anchor="middle">DatasetManager</text><line x1="721" y1="71" x2="734" y2="71" stroke="var(--line)" stroke-width="1.6" marker-end="url(#ah-line)"/><text x="561" y="130" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">TRUNCATE of materialized</text><text x="561" y="146" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">views, the MERGE check</text><rect x="736" y="40" width="164" height="62" rx="8" fill="var(--go)" fill-opacity="0.16" stroke="var(--go)" stroke-width="1.6"/><text x="818.0" y="67.15" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">5. execute</text><text x="818.0" y="83.95" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12.04" font-weight="400" fill="var(--mute)" text-anchor="middle">TriggeredGraphExecution</text><text x="740" y="130" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">retries, SKIPPED,</text><text x="740" y="146" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">AvailableNow queries</text><line x1="370.5" y1="28" x2="370.5" y2="176" stroke="var(--bad)" stroke-width="2" stroke-dasharray="6 4"/><text x="364.5" y="24" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--bad)" text-anchor="end">a dry run stops here</text><text x="376.5" y="24" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--go)" text-anchor="start">writes to the catalog and the storage</text><text x="20" y="206" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">Steps 1 and 2 only analyze the plans. Steps 3 to 5 change checkpoints and tables.</text><text x="20" y="226" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="start">Thus, a dry run cannot find an error of steps 4 or 5 (for example the empty table after a failed gate).</text></svg>
