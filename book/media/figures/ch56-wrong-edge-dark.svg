<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="One wrong edge joins two people into a cluster of six"><title>One wrong edge joins two people into a cluster of six</title><style>svg{--ink:#e5e7eb;--mute:#a3abb8;--line:#6b7280;--soft:#2a2e38;--br:#c99560;--si:#7aa2dc;--go:#f0924a;--ok:#72c08f;--bad:#ef7666;--gr:#aab2bf;--pu:#a98be0}</style><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mute)"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)"/></marker><marker id="ah-br" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--br)"/></marker><marker id="ah-si" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--si)"/></marker><marker id="ah-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--go)"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gr)"/></marker><marker id="ah-pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pu)"/></marker></defs><text x="20" y="26" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="start">Largest cluster: 6 records, two people per the answer key (E057 and E058)</text><line x1="120" y1="90" x2="60" y2="190" stroke="var(--si)" stroke-width="2"/><line x1="120" y1="90" x2="180" y2="190" stroke="var(--si)" stroke-width="2"/><line x1="60" y1="190" x2="180" y2="190" stroke="var(--si)" stroke-width="2"/><circle cx="120" cy="90" r="16" fill="var(--si)" fill-opacity="0.3" stroke="var(--si)" stroke-width="2"/><circle cx="60" cy="190" r="16" fill="var(--si)" fill-opacity="0.3" stroke="var(--si)" stroke-width="2"/><circle cx="180" cy="190" r="16" fill="var(--si)" fill-opacity="0.3" stroke="var(--si)" stroke-width="2"/><text x="120" y="248" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--si)" text-anchor="middle">E057: 3 records</text><line x1="420" y1="90" x2="360" y2="190" stroke="var(--go)" stroke-width="2"/><line x1="420" y1="90" x2="480" y2="190" stroke="var(--go)" stroke-width="2"/><line x1="360" y1="190" x2="480" y2="190" stroke="var(--go)" stroke-width="2"/><circle cx="420" cy="90" r="16" fill="var(--go)" fill-opacity="0.3" stroke="var(--go)" stroke-width="2"/><circle cx="360" cy="190" r="16" fill="var(--go)" fill-opacity="0.3" stroke="var(--go)" stroke-width="2"/><circle cx="480" cy="190" r="16" fill="var(--go)" fill-opacity="0.3" stroke="var(--go)" stroke-width="2"/><text x="420" y="248" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--go)" text-anchor="middle">E058: 3 records</text><line x1="180" y1="190" x2="360" y2="190" stroke="var(--bad)" stroke-width="3" stroke-dasharray="6 4"/><text x="270" y="180" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--bad)" text-anchor="middle">one wrong match</text><text x="560" y="80" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">6 records imply 15 pairs:</text><text x="560" y="104" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">3 + 3 = 6 correct pairs inside the two people</text><text x="560" y="126" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--bad)" text-anchor="start">3 x 3 = 9 wrong pairs across the two people</text><text x="560" y="164" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">precision of the matcher:      0.991</text><text x="560" y="186" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">precision after clustering:    0.921</text><text x="560" y="226" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start" font-style="italic">Record positions: schematic.</text></svg>
