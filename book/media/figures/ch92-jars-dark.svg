<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img"><title>Jars: official tarball and this build</title><text x="20" y="28.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#e6edf3" xml:space="preserve">The jars/ folder: the official -bin-hadoop3 tarball and this build (inspect.txt)</text><text x="190" y="82.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#e6edf3" xml:space="preserve">official, 280 jars</text><rect x="200" y="60" width="562.5" height="34" rx="2" fill="#16263d" stroke="#5b9cf5" stroke-width="1.5"/><text x="481.25" y="82.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#a8caff" xml:space="preserve">in both (225)</text><rect x="762.5" y="60" width="97.5" height="34" rx="2" fill="#271c3d" stroke="#a78bfa" stroke-width="1.5"/><text x="811.25" y="82.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#d4c4ff" xml:space="preserve">Hive + deps (39)</text><rect x="860.0" y="60" width="32.5" height="34" rx="2" fill="#3a2416" stroke="#ff8a4c" stroke-width="1.5"/><text x="876.25" y="82.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffbe99" xml:space="preserve">13</text><rect x="892.5" y="60" width="7.5" height="34" rx="2" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1.5"/><text x="190" y="152.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#e6edf3" xml:space="preserve">this build, 225 jars</text><rect x="200" y="130" width="562.5" height="34" rx="2" fill="#16263d" stroke="#5b9cf5" stroke-width="1.5"/><text x="481.25" y="152.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#a8caff" xml:space="preserve">in both (225)</text><text x="200" y="200.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#9da7b3" xml:space="preserve">Missing from this build: 39 Hive jars and their libraries and 3 Spark modules (no -Phive, -Phive-thriftserver, -Pyarn),</text><text x="200" y="218.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#9da7b3" xml:space="preserve">and 13 other jars: the Hadoop client, ZooKeeper, Curator, Guava, slf4j-api and more (-Phadoop-provided).</text><text x="200" y="250.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#e6edf3" xml:space="preserve">SPARK_DIST_CLASSPATH puts them back at run time. Without it, the build fails with NoClassDefFoundError.</text></svg>
