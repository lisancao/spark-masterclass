<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 345" width="940" height="345" role="img"><title>Master failover with FILESYSTEM recovery</title><text x="20" y="28.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#e6edf3" xml:space="preserve">The master dies and comes back. The application does not notice (ha.txt)</text><text x="20" y="92.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#e6edf3" xml:space="preserve">master</text><text x="20" y="152.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#e6edf3" xml:space="preserve">application</text><text x="20" y="212.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#e6edf3" xml:space="preserve">executors</text><rect x="150.0" y="70" width="238.3928571428571" height="34" rx="4" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><text x="269.19642857142856" y="92.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9be6ae" xml:space="preserve">ALIVE</text><rect x="388.3928571428571" y="70" width="144.6428571428571" height="34" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="460.71428571428567" y="92.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffb3b3" xml:space="preserve">no master</text><rect x="533.0357142857142" y="70" width="34.82142857142867" height="34" rx="4" fill="#3a2416" stroke="#ff8a4c" stroke-width="1.5"/><rect x="567.8571428571429" y="70" width="306.69642857142856" height="34" rx="4" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><text x="721.2053571428571" y="92.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9be6ae" xml:space="preserve">ALIVE (recovery 392 ms)</text><rect x="327.05357142857144" y="130" width="547.5" height="34" rx="4" fill="#16263d" stroke="#5b9cf5" stroke-width="1.5"/><text x="631.4732142857142" y="152.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#a8caff" xml:space="preserve">RUNNING: the hold loop runs a job each second</text><rect x="327.05357142857144" y="190" width="547.5" height="34" rx="4" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="631.4732142857142" y="212.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">2 executors the whole time (they talk to the driver)</text><line x1="388.3928571428571" y1="60" x2="388.3928571428571" y2="240" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><text x="388.3928571428571" y="258.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9da7b3" xml:space="preserve">17.8 s</text><text x="388.3928571428571" y="274.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">SIGKILL</text><line x1="533.0357142857142" y1="60" x2="533.0357142857142" y2="240" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><text x="533.0357142857142" y="258.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9da7b3" xml:space="preserve">28.6 s</text><text x="533.0357142857142" y="274.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">start-master.sh</text><line x1="874.5535714285714" y1="60" x2="874.5535714285714" y2="240" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><text x="874.5535714285714" y="258.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9da7b3" xml:space="preserve">54.1 s</text><text x="874.5535714285714" y="274.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">app exits, code 0</text><text x="20" y="300.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#9da7b3" xml:space="preserve">The driver logs &quot;Disconnected from Spark cluster! Waiting for reconnection...&quot;, then &quot;Master has changed&quot;.</text><text x="20" y="315.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#9da7b3" xml:space="preserve">The new master reads the application and the workers from spark.deploy.recoveryDirectory.</text></svg>
