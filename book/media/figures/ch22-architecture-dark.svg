<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img"><title>The taxi app: local work in the process, heavy work on Spark</title><rect x="20" y="90" width="250" height="260" rx="12" fill="#3a2416" stroke="#ff8a4c" stroke-width="1.5"/><text x="145" y="124.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#ffbe99" xml:space="preserve">Spark Connect server</text><text x="145" y="166.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#ffbe99" xml:space="preserve">Spark 4.3.0, 16 cores</text><text x="145" y="196.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#ffbe99" xml:space="preserve">reads 6 months of Parquet</text><text x="145" y="226.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffbe99" xml:space="preserve">22,836,515 trips</text><text x="145" y="256.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#ffbe99" xml:space="preserve">aggregates by zone and hour</text><text x="145" y="286.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffbe99" xml:space="preserve">6,145 rows back</text><rect x="410" y="40" width="570" height="380" rx="12" fill="#16263d" stroke="#5b9cf5" stroke-width="1.5"/><text x="426" y="64.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#a8caff" xml:space="preserve">taxi-app: one Rust binary, no JVM</text><rect x="430" y="84" width="250" height="70" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="555.0" y="116.3" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">spark_connect</text><text x="555.0" y="133.3" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">DataFrame API: builds the plan</text><rect x="430" y="182" width="250" height="70" rx="8" fill="#3a2416" stroke="#ff8a4c" stroke-width="1.5"/><text x="555.0" y="214.3" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" fill="#ffbe99" xml:space="preserve">to_arrow()</text><text x="555.0" y="231.3" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#ffbe99" xml:space="preserve">Arrow IPC bytes, 145.4 KiB</text><rect x="430" y="280" width="250" height="70" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="555.0" y="312.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">FileReader (arrow-rs 60)</text><text x="555.0" y="328.2" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">IPC bytes to RecordBatch</text><rect x="710" y="84" width="250" height="70" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="835.0" y="116.3" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">zone lookup CSV</text><text x="835.0" y="133.3" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">265 rows, read by Polars</text><rect x="710" y="182" width="250" height="70" rx="8" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><text x="835.0" y="214.3" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#9be6ae" xml:space="preserve">Polars DataFrame</text><text x="835.0" y="231.3" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#9be6ae" xml:space="preserve">IpcReader: joins, shares</text><rect x="710" y="280" width="250" height="70" rx="8" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><text x="835.0" y="312.3" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#9be6ae" xml:space="preserve">DuckDB view</text><text x="835.0" y="329.3" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#9be6ae" xml:space="preserve">SQL with QUALIFY</text><polyline points="555.0,252 555.0,280" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="555.0,280 559.5,271.0 550.5,271.0" fill="#7d8590"/><polyline points="680,217 710,217" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="710,217 701.0,212.5 701.0,221.5" fill="#7d8590"/><polyline points="680,315 710,315" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="710,315 701.0,310.5 701.0,319.5" fill="#7d8590"/><polyline points="835.0,154 835.0,182" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="835.0,182 839.5,173.0 830.5,173.0" fill="#7d8590"/><text x="857.0" y="172.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#9da7b3" xml:space="preserve">join</text><text x="695" y="390.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9be6ae" xml:space="preserve">interactive questions: milliseconds, no round trip</text><polyline points="430,119 270,150" fill="none" stroke="#ff8a4c" stroke-width="1.6" stroke-linejoin="round"/><polygon points="270,150 279.7,152.7 278.0,143.9" fill="#ff8a4c"/><text x="340" y="112.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#ffbe99" xml:space="preserve">plan</text><text x="340" y="127.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#ffbe99" xml:space="preserve">(protobuf)</text><polyline points="270,290 430,217" fill="none" stroke="#4cc26a" stroke-width="1.6" stroke-linejoin="round"/><polygon points="430,217 419.9,216.6 423.7,224.8" fill="#4cc26a"/><text x="340" y="286.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#9be6ae" xml:space="preserve">ArrowBatch</text><text x="340" y="301.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#9be6ae" xml:space="preserve">messages</text><text x="20" y="434.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#9da7b3" font-style="italic" xml:space="preserve">The sizes come from app.txt. The positions are schematic.</text></svg>
