Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">pdb over TCP</text><text x="558" y="259.04" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">breakpoint() + remote-pdb, local[1]</text><text x="28" y="287.04" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">the UDF is slow</text><text x="258" y="287.04" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">per-UDF profile</text><text x="558" y="287.04" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">pyspark.udf.profiler (Chapter 61)</text><text x="20" y="310" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">Highlighted rows: settings added in 4.1 or 4.3. Some keys start with spark.sql.pyspark. (see the text).</text></svg>
