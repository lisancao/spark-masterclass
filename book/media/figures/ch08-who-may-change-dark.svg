" width="200" height="52" rx="8" fill="none" stroke="#7d8590" stroke-width="1.5"/><text x="565.0" y="206.2" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#9da7b3" xml:space="preserve">ignored</text><rect x="675" y="176" width="200" height="52" rx="8" fill="none" stroke="#7d8590" stroke-width="1.5"/><text x="775.0" y="206.2" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#9da7b3" xml:space="preserve">ignored</text><text x="20" y="260.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#e6edf3" xml:space="preserve">spark.conf.set or SET</text><text x="20" y="275.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#e6edf3" xml:space="preserve">(Classic)</text><rect x="255" y="238" width="200" height="52" rx="8" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><text x="355.0" y="268.2" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#9be6ae" xml:space="preserve">set</text><rect x="465" y="238" width="200" height="52" rx="8" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1.5"/><text x="565.0" y="267.8" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#ffb3b3" xml:space="preserve">CANNOT_MODIFY_</text><text x="565.0" y="283.4" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" fill="#ffb3b3" xml:space="preserve">STATIC_CONFIG</text><rect x="675" y="238" width="200" height="52" rx="8" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1.5"/><text x="775.0" y="267.8" font-family="'JetBrains Mono', 'Monaspace Neon