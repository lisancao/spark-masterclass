<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" width="860" height="270" role="img"><title>The first 24 bytes of a PNG file</title><text x="20" y="24.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1f2328" xml:space="preserve">The first 24 bytes of a PNG file, as substring(content, start, n) sees them</text><rect x="20" y="44" width="268" height="44" rx="8" fill="#fff0e6" stroke="#e8590c" stroke-width="1.5"/><text x="154.0" y="69.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9a3412" xml:space="preserve">signature</text><text x="154.0" y="106.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#9a3412" xml:space="preserve">89 50 4E 47 0D 0A 1A 0A</text><text x="22" y="124.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a" xml:space="preserve">bytes 1-8</text><rect x="292" y="44" width="132" height="44" rx="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><text x="358.0" y="69.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328" xml:space="preserve">chunk length</text><text x="358.0" y="106.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328" xml:space="preserve">00 00 00 0D</text><text x="294" y="124.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a" xml:space="preserve">bytes 9-12</text><rect x="428" y="44" width="132" height="44" rx="8" fill="#e8f1fd" stroke="#3b82f6" stroke-width="1.5"/><text x="494.0" y="69.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1e4f9c" xml:space="preserve">chunk name</text><text x="494.0" y="106.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1e4f9c" xml:space="preserve">49 48 44 52 = IHDR</text><text x="430" y="124.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a" xml:space="preserve">bytes 13-16</text><rect x="564" y="44" width="132" height="44" rx="8" fill="#e7f5ec" stroke="#2f9e44" stroke-width="1.5"/><text x="630.0" y="69.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1e6b30" xml:space="preserve">width</text><text x="630.0" y="106.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1e6b30" xml:space="preserve">00 00 00 20 = 32</text><text x="566" y="124.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a" xml:space="preserve">bytes 17-20</text><rect x="700" y="44" width="132" height="44" rx="8" fill="#e7f5ec" stroke="#2f9e44" stroke-width="1.5"/><text x="766.0" y="69.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1e6b30" xml:space="preserve">height</text><text x="766.0" y="106.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1e6b30" xml:space="preserve">00 00 00 20 = 32</text><text x="702" y="124.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a" xml:space="preserve">bytes 21-24</text><text x="20" y="160.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#1e6b30" xml:space="preserve">gradient_32x32.png: IHDR at bytes 13-16, so png_ok = true, width 32, height 32</text><text x="20" y="190.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#9b1c1c" xml:space="preserve">corrupt.png: the right signature, then the text &quot;not really a png&quot;</text><rect x="20" y="202" width="268" height="30" rx="8" fill="#fff0e6" stroke="#e8590c" stroke-width="1.5"/><text x="154.0" y="220.3" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#9a3412" xml:space="preserve">89504E470D0A1A0A</text><rect x="292" y="202" width="540" height="30" rx="8" fill="#fdeceb" stroke="#d63c3c" stroke-width="1.5"/><text x="562.0" y="220.6" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#9b1c1c" xml:space="preserve">not really a png</text><text x="292" y="252.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" text-anchor="start" fill="#9b1c1c" xml:space="preserve">bytes 13-16 = 7265616C (&quot;real&quot;), not IHDR: png_ok = false. Without the check: width 1819877473.</text></svg>
