<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" width="820" height="230" role="img"><title>The image source keeps pixels as B, G, R</title><text x="20" y="24.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="start" fill="#1f2328" xml:space="preserve">red_16x8.png, first pixel: 00 00 ff</text><rect x="20" y="40" width="52" height="40" rx="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><text x="46.0" y="64.5" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2328" xml:space="preserve">00</text><text x="46" y="98.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#57606a" xml:space="preserve">B</text><rect x="80" y="40" width="52" height="40" rx="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><text x="106.0" y="64.5" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2328" xml:space="preserve">00</text><text x="106" y="98.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#57606a" xml:space="preserve">G</text><rect x="140" y="40" width="52" height="40" rx="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><text x="166.0" y="64.5" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2328" xml:space="preserve">ff</text><text x="166" y="98.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#57606a" xml:space="preserve">R</text><polyline points="205,60 250,60" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round"/><polygon points="250,60 241.0,55.5 241.0,64.5" fill="#8c959f"/><rect x="262" y="40" width="70" height="56" rx="6" fill="#ff0000" stroke="#8c959f"/><text x="344" y="62.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#1f2328" xml:space="preserve">read as B, G, R: red</text><text x="344" y="82.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#57606a" xml:space="preserve">the true colour</text><polyline points="205,150 250,150" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round"/><polygon points="250,150 241.0,145.5 241.0,154.5" fill="#8c959f"/><rect x="262" y="130" width="70" height="56" rx="6" fill="#0000ff" stroke="#8c959f"/><text x="344" y="152.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#9b1c1c" xml:space="preserve">read as R, G, B (Pillow, most models): blue</text><text x="344" y="172.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#57606a" xml:space="preserve">reverse the channels before you give the pixels to the library</text><text x="20" y="154.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#57606a" xml:space="preserve">the same 3 bytes</text><text x="20" y="214.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#57606a" xml:space="preserve">logo_rgba_12x12.png, first pixel: ff 00 00 ff (B, G, R, A). Alpha comes last.</text></svg>
