<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" role="img"><title>Synchronous and asynchronous progress tracking</title><defs><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3A9B3"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A606B"/></marker><marker id="ah-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E4E0D8"/></marker><marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F07A3C"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7BC496"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7FB0E6"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E6B455"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F08070"/></marker></defs><text x="20" y="22.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A3A9B3" text-anchor="start" dominant-baseline="middle">Kafka to Kafka, 64 batches of 100 records, medians of 3 runs (s15_async.txt)</text><text x="140" y="50.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#E4E0D8" text-anchor="start" dominant-baseline="middle">median batch (ms): walCommit + commitOffsets + the rest</text><text x="128" y="84.0" font-family="'DM Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#E4E0D8" text-anchor="end" dominant-baseline="middle">sync</text><rect x="140" y="66" width="160.0" height="32" rx="3" fill="#3D3018" stroke="#E6B455" stroke-width="1.5" opacity="1"/><text x="220.0" y="81.945" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">walCommit 32</text><rect x="300.0" y="66" width="160.0" height="32" rx="3" fill="#46221E" stroke="#F08070" stroke-width="1.5" opacity="1"/><text x="380.0" y="81.945" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">commit 32</text><rect x="460.0" y="66" width="160.0" height="32" rx="3" fill="#1D3049" stroke="#7FB0E6" stroke-width="1.5" opacity="1"/><text x="628.0" y="84.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#E4E0D8" text-anchor="start" dominant-baseline="middle">96 ms</text><text x="720" y="84.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A3A9B3" text-anchor="start" dominant-baseline="middle">64 offset files, 8.6 s</text><text x="128" y="134.0" font-family="'DM Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#E4E0D8" text-anchor="end" dominant-baseline="middle">async</text><rect x="140" y="116" width="160.0" height="32" rx="3" fill="#1D3049" stroke="#7FB0E6" stroke-width="1.5" opacity="1"/><text x="308.0" y="134.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#E4E0D8" text-anchor="start" dominant-baseline="middle">32 ms</text><text x="720" y="134.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A3A9B3" text-anchor="start" dominant-baseline="middle">4 offset files, 4.2 s</text><text x="20" y="200.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#E4E0D8" text-anchor="start" dominant-baseline="middle">The two checkpoint writes leave the batch. The background thread writes one entry per second.</text><text x="20" y="222.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A9B3" text-anchor="start" dominant-baseline="middle">Times from one laptop that other jobs also used; the ratio is the result.</text></svg>
