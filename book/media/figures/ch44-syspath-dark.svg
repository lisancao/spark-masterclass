<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="The first entries of sys.path in a Python worker, in local mode and on a cluster"><title>The first entries of sys.path in a Python worker, in local mode and on a cluster</title><style>svg{--ink:#e5e7eb;--mute:#a3abb8;--line:#6b7280;--soft:#2a2e38;--br:#c99560;--si:#7aa2dc;--go:#f0924a;--ok:#72c08f;--bad:#ef7666;--gr:#aab2bf;--pu:#a98be0}</style><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mute)"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)"/></marker><marker id="ah-br" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--br)"/></marker><marker id="ah-si" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--si)"/></marker><marker id="ah-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--go)"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gr)"/></marker><marker id="ah-pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pu)"/></marker></defs><text x="20" y="26" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="start">sys.path of a Python worker, from the top</text><text x="330" y="52" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--go)" text-anchor="start">local mode (where.py output)</text><text x="640" y="52" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--si)" text-anchor="start">on a cluster</text><rect x="20" y="64" width="860" height="38" rx="5" fill="var(--bad)" fill-opacity="0.12" stroke="var(--bad)" stroke-width="1"/><text x="32" y="88" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">1. current folder</text><text x="330" y="88" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">the folder where the driver started</text><text x="640" y="88" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">a work folder of the executor</text><rect x="20" y="108" width="860" height="38" rx="5" fill="var(--gr)" fill-opacity="0.06" stroke="var(--gr)" stroke-width="0.8"/><text x="32" y="132" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">2. files root</text><text x="330" y="132" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">&lt;driver tmp&gt;/userFiles-&lt;uuid&gt;</text><text x="640" y="132" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">the current folder of the executor</text><rect x="20" y="152" width="860" height="38" rx="5" fill="var(--gr)" fill-opacity="0.06" stroke="var(--gr)" stroke-width="0.8"/><text x="32" y="176" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">3. pyspark.zip</text><text x="330" y="176" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">from the Spark install</text><text x="640" y="176" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">from the Spark install</text><rect x="20" y="196" width="860" height="38" rx="5" fill="var(--gr)" fill-opacity="0.06" stroke="var(--gr)" stroke-width="0.8"/><text x="32" y="220" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">4. py4j zip</text><text x="330" y="220" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">py4j-0.10.9.9-src.zip</text><text x="640" y="220" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">py4j-0.10.9.9-src.zip</text><rect x="20" y="240" width="860" height="38" rx="5" fill="var(--gr)" fill-opacity="0.06" stroke="var(--gr)" stroke-width="0.8"/><text x="32" y="264" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">then site-packages</text><text x="330" y="264" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">of pythonExec (PYSPARK_PYTHON)</text><text x="640" y="264" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">of pythonExec (PYSPARK_PYTHON)</text><text x="20" y="300" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--bad)" text-anchor="start">Entry 1 is why a package in the driver folder imports in local mode and fails on a cluster.</text><text x="20" y="318" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="start">setup_spark_files adds the files root and each shipped include for each task.</text></svg>
