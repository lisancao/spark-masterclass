e-width="1.5" stroke-dasharray="5 4"/><text x="870" y="306.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="end" fill="#9a3412" xml:space="preserve">dashed line: a split, where a date or { starts the next line</text><text x="20" y="306.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2328" xml:space="preserve">134 lines become 80 events</text></svg>
