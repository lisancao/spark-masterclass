<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img"><title>Split a log where a new event starts</title><text x="20" y="24.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1f2328" xml:space="preserve">split(value, &quot;\n(?=\d{4}-\d{2}-\d{2} |\{)&quot;): the first 8 lines of app.log</text><rect x="90" y="46" width="770" height="26" rx="6" fill="#e8f1fd" stroke="#3b82f6" stroke-width="1.5"/><text x="80" y="65.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#1e4f9c" xml:space="preserve">event 1</text><text x="100" y="65.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" fill="#1e4f9c" xml:space="preserve">2026-10-01 10:00:00,123 WARN [worker-0] order.Service - processed order=0 ms=340</text><rect x="90" y="76" width="770" height="26" rx="6" fill="#e8f1fd" stroke="#3b82f6" stroke-width="1.5"/><text x="80" y="95.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#1e4f9c" xml:space="preserve">event 2</text><text x="100" y="95.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" fill="#1e4f9c" xml:space="preserve">2026-10-01 10:01:00,123 INFO [worker-1] order.Service - processed order=1 ms=12</text><rect x="90" y="106" width="770" height="116" rx="6" fill="#fdeceb" stroke="#d63c3c" stroke-width="1.5"/><text x="80" y="170.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#9b1c1c" xml:space="preserve">event 3</text><text x="100" y="125.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11.5" font-weight="40