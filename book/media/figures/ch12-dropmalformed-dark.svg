<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" role="img"><title>DROPMALFORMED counts depend on the query</title><text x="20" y="24.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#e6edf3" xml:space="preserve">mode=DROPMALFORMED on the same 5 rows (4 of them malformed)</text><text x="250" y="62.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="end" fill="#e6edf3" xml:space="preserve">len(collect())</text><rect x="262" y="48" width="28" height="22" rx="4" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><rect x="296" y="48" width="28" height="22" rx="4" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="330" y="48" width="28" height="22" rx="4" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="364" y="48" width="28" height="22" rx="4" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="398" y="48" width="28" height="22" rx="4" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><text x="442" y="64.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#9be6ae" xml:space="preserve">1 row</text><text x="520" y="64.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#9da7b3" xml:space="preserve">all columns parsed</text><text x="250" y="100.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="end" fill="#e6edf3" xml:space="preserve">count()</text><rect x="262" y="86" width="28" height="22" rx="4" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><rect x="296" y="86" width="28" height="22" rx="4" fill="#17301f" stroke="#4cc26a" stroke-wid