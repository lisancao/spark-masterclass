or="start" fill="#9be6ae" xml:space="preserve">1 row</text><text x="520" y="216.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#9da7b3" xml:space="preserve">all columns parsed</text><text x="20" y="240.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#9da7b3" font-style="italic" xml:space="preserve">Green: a row that the query keeps. Use PERMISSIVE with _corrupt_record to count bad rows.</text></svg>
