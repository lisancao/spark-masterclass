<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" role="img"><title>Copy-on-write and merge-on-read in Iceberg</title><defs><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6670"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4ADA3"/></marker><marker id="ah-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B1F23"/></marker><marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9531A"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F7D5B"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A86A12"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="20.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6670" text-anchor="start" dominant-baseline="middle">A DELETE of one row in each mode (iceberg_log.txt)</text><text x="210" y="52.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1B1F23" text-anchor="middle" dominant-baseline="middle">copy-on-write: DELETE Charlie</text><rect x="20" y="70" width="160" height="56" rx="8" fill="#E6E3DE" stroke="#5F6670" stroke-width="1.5" opacity="1"/><text x="100.0" y="91.06" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1B1F23" text-anchor="middle" dominant-baseline="middle">data file</text><text x="100.0" y="106.07" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6670" text-anchor="middle" dominant-baseline="middle">5 rows</text><line x1="184" y1="98" x2="250" y2="98" stroke="#5F6670" stroke-width="1.6" marker-end="url(#ah-mute)"/><text x="217.0" y="89.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6670" text-anchor="middle" dominant-baseline="middle">rewrite</text><rect x="254" y="70" width="160" height="56" rx="8" fill="#DCEFE4" stroke="#2F7D5B" stroke-width="1.5" opacity="1"/><text x="334.0" y="91.06" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1B1F23" text-anchor="middle" dominant-baseline="middle">new data file</text><text x="334.0" y="106.07" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6670" text-anchor="middle" dominant-baseline="middle">4 rows</text><text x="210" y="150.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6670" text-anchor="middle" dominant-baseline="middle">overwrite snapshot: 1 file added, 1 deleted</text><text x="650" y="52.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1B1F23" text-anchor="middle" dominant-baseline="middle">merge-on-read: DELETE Eve</text><rect x="470" y="70" width="190" height="56" rx="8" fill="#F3EEE6" stroke="#B4ADA3" stroke-width="1.5" opacity="1"/><text x="565.0" y="91.06" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1B1F23" text-anchor="middle" dominant-baseline="middle">data file (same file)</text><text x="565.0" y="106.07" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6670" text-anchor="middle" dominant-baseline="middle">4 rows, content 0</text><text x="675" y="98.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1B1F23" text-anchor="middle" dominant-baseline="middle">+</text><rect x="690" y="70" width="150" height="56" rx="8" fill="#FAEBC8" stroke="#A86A12" stroke-width="1.5" opacity="1"/><text x="765.0" y="91.6875" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1B1F23" text-anchor="middle" dominant-baseline="middle">position delete file</text><text x="765.0" y="105.7625" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5F6670" text-anchor="middle" dominant-baseline="middle">1 row, content 1</text><text x="655" y="150.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6670" text-anchor="middle" dominant-baseline="middle">a reader skips the positions in the delete file</text><text x="20" y="200.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B1F23" text-anchor="start" dominant-baseline="middle">Copy-on-write rewrites a whole file for a small change. Merge-on-read writes a small delete file,</text><text x="20" y="220.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B1F23" text-anchor="start" dominant-baseline="middle">and readers do a little more work until compaction writes the deletes into new data files.</text></svg>
