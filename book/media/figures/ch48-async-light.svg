<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" role="img"><title>Synchronous and asynchronous progress tracking</title><defs><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6670"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4ADA3"/></marker><marker id="ah-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B1F23"/></marker><marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9531A"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F7D5B"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A86A12"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="22.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F6670" text-anchor="start" dominant-baseline="middle">Kafka to Kafka, 64 batches of 100 records, medians of 3 runs (s15_async.txt)</text><text x="140" y="50.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1B1F23" text-anchor="start" dominant-baseline="middle">median batch (ms): walCommit + commitOffsets + the rest</text><text x="128" y="84.0" font-family="'DM Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1B1F23" text-anchor="end" dominant-baseline="middle">sync</text><rect x="140" y="66" width="160.0" height="32" rx="3" fill="#FAEBC8" stroke="#A86A12" stroke-width="1.5" opacity="1"/><text x="220.0" y="81.945" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#1B1F23" text-anchor="middle" dominant-baseline="middle">walCommit 32</text><rect x="300.0" y="66" width="160.0" height="32" rx="3" fill="#F8DAD5" stroke="#C0392B" stroke-width="1.5" opacity="1"/><text x="380.0" y="81.945" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#1B1F23" text-anchor="middle" dominant-baseline="middle">commit 32</text><rect x="460.0" y="66" width="160.0" height="32" rx="3" fill="#DCE8F5" stroke="#2B6CB0" stroke-width="1.5" opacity="1"/><text x="628.0" y="84.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1B1F23" text-anchor="start" dominant-baseline="middle">96 ms</text><text x="720" y="84.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F6670" text-anchor="start" dominant-baseline="middle">64 offset files, 8.6 s</text><text x="128" y="134.0" font-family="'DM Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1B1F23" text-anchor="end" dominant-baseline="middle">async</text><rect x="140" y="116" width="160.0" height="32" rx="3" fill="#DCE8F5" stroke="#2B6CB0" stroke-width="1.5" opacity="1"/><text x="308.0" y="134.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1B1F23" text-anchor="start" dominant-baseline="middle">32 ms</text><text x="720" y="134.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F6670" text-anchor="start" dominant-baseline="middle">4 offset files, 4.2 s</text><text x="20" y="200.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B1F23" text-anchor="start" dominant-baseline="middle">The two checkpoint writes leave the batch. The background thread writes one entry per second.</text><text x="20" y="222.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6670" text-anchor="start" dominant-baseline="middle">Times from one laptop that other jobs also used; the ratio is the result.</text></svg>
