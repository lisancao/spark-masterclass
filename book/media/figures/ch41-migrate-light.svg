mily="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5F6670" text-anchor="middle" dominant-baseline="middle">fails: the operator name does not match</text><line x1="222" y1="190" x2="288" y2="120" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah-red)"/><text x="430.0" y="318.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="#5F6670" text-anchor="middle" dominant-baseline="middle">Same closed and open sessions as one transformWithState query over all four drops (Step 5)</text></svg>
