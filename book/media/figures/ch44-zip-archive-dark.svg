<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="The same site folder shipped as a zip and as an archive"><title>The same site folder shipped as a zip and as an archive</title><style>svg{--ink:#e5e7eb;--mute:#a3abb8;--line:#6b7280;--soft:#2a2e38;--br:#c99560;--si:#7aa2dc;--go:#f0924a;--ok:#72c08f;--bad:#ef7666;--gr:#aab2bf;--pu:#a98be0}</style><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mute)"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)"/></marker><marker id="ah-br" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--br)"/></marker><marker id="ah-si" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--si)"/></marker><marker id="ah-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--go)"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gr)"/></marker><marker id="ah-pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pu)"/></marker></defs><text x="20" y="26" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="start">One site folder (tabulate: pure Python, ujson: native .so), shipped two ways</text><rect x="20" y="44" width="420" height="200" rx="8" fill="var(--gr)" fill-opacity="0.05" stroke="var(--gr)" stroke-width="1.6"/><text x="34" y="70" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="start">deps.zip with addPyFile</text><text x="34" y="90" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="start">zipimport: the zip is a folder on sys.path</text><rect x="34" y="112" width="392" height="48" rx="5" fill="var(--ok)" fill-opacity="0.15" stroke="var(--ok)" stroke-width="1.6"/><text x="46" y="132" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">import tabulate</text><text x="46" y="150" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="var(--ok)" text-anchor="start">deps.zip/tabulate/__init__.py</text><rect x="34" y="172" width="392" height="48" rx="5" fill="var(--bad)" fill-opacity="0.15" stroke="var(--bad)" stroke-width="1.6"/><text x="46" y="192" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">import ujson</text><text x="46" y="210" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="var(--bad)" text-anchor="start">ModuleNotFoundError</text><rect x="460" y="44" width="420" height="200" rx="8" fill="var(--gr)" fill-opacity="0.05" stroke="var(--gr)" stroke-width="1.6"/><text x="474" y="70" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="start">deps.tar.gz with addArchive</text><text x="474" y="90" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="start">unpacked into a real folder deps/</text><rect x="474" y="112" width="392" height="48" rx="5" fill="var(--ok)" fill-opacity="0.15" stroke="var(--ok)" stroke-width="1.6"/><text x="486" y="132" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">import tabulate</text><text x="486" y="150" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="var(--ok)" text-anchor="start">deps/site-packages/tabulate/__init__.py</text><rect x="474" y="172" width="392" height="48" rx="5" fill="var(--ok)" fill-opacity="0.15" stroke="var(--ok)" stroke-width="1.6"/><text x="486" y="192" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">import ujson</text><text x="486" y="210" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="var(--ok)" text-anchor="start">deps/site-packages/ujson.cpython-312-x86_64-linux-gnu.so</text><text x="20" y="268" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">A zip can load .py files only. Native code needs a real folder. Build it for the executors:</text><text x="20" y="286" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="start">ujson-6.1.0 is cp312, manylinux2014_x86_64: CPython 3.12 on x86-64 Linux only.</text></svg>
