="end" dominant-baseline="middle">user a</text><line x1="80" y1="80" x2="840" y2="80" stroke="#5A606B" stroke-width="0.8"/><text x="66" y="150.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#E4E0D8" text-anchor="end" dominant-baseline="middle">user b</text><line x1="80" y1="150" x2="840" y2="150" stroke="#5A606B" stroke-width="0.8"/><rect x="136.0" y="54" width="117.99999999999994" height="12" rx="3" fill="#1E3A2B" stroke="#7BC496" stroke-width="1" opacity="1"/><rect x="255.99999999999994" y="54" width="318.00000000000006" height="12" rx="3" fill="#1E3A2B" stroke="#7BC496" stroke-width="1" opacity="1"/><rect x="295.99999999999994" y="124" width="318.00000000000006" height="12" rx="3" fill="#1E3A2B" stroke="#7BC496" stroke-width="1" opacity="1"/><text x="416.0" y="44.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#7BC496" text-anchor="middle" dominant-baseline="middle">TTL of /cart: 8 s from the last update</text><circle cx="136.0" cy="80" r="7" fill="#7FB0E6" stroke="none" stroke-width="1.5"/><text x="136.0" y="100.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#7FB0E6" text-anchor="middle" dominant-baseline="middle">13.4 s click /p/desk</text><circle cx="255.99999999999994" cy="80" r="7" fill="#7FB0E6" stroke="none" stroke-width="1.5"/><text x="255.99999999999994" y="100.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#7FB0E6" text-anchor="middle" dominant-baseline="middle">16.4 s click /cart</text><circle cx="295.99999999999994" cy="150" r="7" fill="#7FB0E6" stroke="none" stroke-width="1.5"/><text x="295.99999999999994" y="170.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#7FB0E6" text-anchor="middle" dominant-baseline="middle">17.4 s click /</text><circle cx="735.9999999999999" cy="80" r="7" fill="#7FB0E6" stroke="none" stroke-width="1.5"/><text x="735.9999999999999" y="100.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#7FB0E6" text-anchor="middle" dominant-baseline="middle">28.4 s click /p/lamp</text><path d="M544.0000000000001,72 L552.0000000000001,80 L544.0000000000001,88 L536.0000000000001,80 Z" stroke="#F07A3C" stroke-width="1" fill="#F07A3C"/><text x="544.0000000000001" y="100.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#F07A3C" text-anchor="middle" dominant-baseline="middle">23.6 s timer, saw /cart</text><path d="M584.0,142 L592.0,150 L584.0,158 L576.0,150 Z" stroke="#F07A3C" stroke-width="1" fill="#F07A3C"/><text x="584.0" y="170.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#F07A3C" text-anchor="middle" dominant-baseline="middle">24.6 s timer, saw /</text><text x="735.9999999999999" y="116.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">state before: None (TTL expired)</text><text x="120.0" y="205.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">13 s</text><text x="200.0" y="205.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">15 s</text><text x="280.0" y="205.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">17 s</text><text x="360.0" y="205.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">19 s</text><text x="440.0" y="205.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">21 s</text><text x="520.0" y="205.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">23 s</text><text x="600.0" y="205.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">25 s</text><text x="680.0" y="205.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">27 s</text><text x="760.0" y="205.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">29 s</text><line x1="80" y1="194" x2="840" y2="194" stroke="#A3A9B3" stroke-width="0.8"/><text x="20" y="234.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#E4E0D8" text-anchor="start" dominant-baseline="middle">A timer fires in the first batch after its time, about 5 s after the last click. The TTL counts from the last update.</text></svg>
