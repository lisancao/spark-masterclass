<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img"><title>Arrow or not: decided when udtf() runs</title><defs><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3A9B3"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A606B"/></marker><marker id="ah-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E4E0D8"/></marker><marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F07A3C"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7BC496"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7FB0E6"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E6B455"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F08070"/></marker></defs><text x="20" y="20.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#A3A9B3" text-anchor="start" dominant-baseline="middle">udtf_core.py, from the top of the file down. The setting pythonUDTF.arrow.enabled is true.</text><rect x="20" y="44" width="360" height="62" rx="8" fill="#3D3018" stroke="#E6B455" stroke-width="1.5" opacity="1"/><text x="200.0" y="66.81" font-family="'DM Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">@udtf(returnType=&quot;n int&quot;)</text><text x="200.0" y="83.06" font-family="'DM Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">class BeforeSession: ...</text><text x="24" y="118.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="italic" fill="#A3A9B3" text-anchor="start" dominant-baseline="middle">no active session: no setting to read</text><line x1="392" y1="75.0" x2="470" y2="75.0" stroke="#A3A9B3" stroke-width="1.6" marker-end="url(#ah-mute)"/><rect x="478" y="58.0" width="362" height="34" rx="8" fill="#46221E" stroke="#F08070" stroke-width="1.5" opacity="1"/><text x="659.0" y="74.935" font-family="'DM Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">BatchEvalPythonUDTF</text><rect x="20" y="142" width="360" height="44" rx="8" fill="#2A2D36" stroke="#5A606B" stroke-width="1.5" opacity="1"/><text x="200.0" y="163.935" font-family="'DM Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">spark = session(&quot;ch21-udtf&quot;, ...)</text><text x="24" y="198.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="italic" fill="#A3A9B3" text-anchor="start" dominant-baseline="middle">the session starts here</text><rect x="20" y="222" width="360" height="62" rx="8" fill="#1E3A2B" stroke="#7BC496" stroke-width="1.5" opacity="1"/><text x="200.0" y="244.81" font-family="'DM Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">@udtf(returnType=&quot;n int&quot;)</text><text x="200.0" y="261.06" font-family="'DM Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">class AfterSession: ...</text><text x="24" y="296.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" font-style="italic" fill="#A3A9B3" text-anchor="start" dominant-baseline="middle">reads the setting from the session</text><line x1="392" y1="253.0" x2="470" y2="253.0" stroke="#A3A9B3" stroke-width="1.6" marker-end="url(#ah-mute)"/><rect x="478" y="236.0" width="362" height="34" rx="8" fill="#1E3A2B" stroke="#7BC496" stroke-width="1.5" opacity="1"/><text x="659.0" y="252.935" font-family="'DM Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">ArrowEvalPythonUDTF, eval type 301</text><text x="20" y="328.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#E4E0D8" text-anchor="start" dominant-baseline="middle">A UDTF that a module defines before the session starts gets the form without Arrow, with no warning.</text></svg>
