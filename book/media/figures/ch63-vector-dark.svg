<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="How a row becomes a feature vector"><title>How a row becomes a feature vector</title><style>svg{--ink:#e5e7eb;--mute:#a3abb8;--line:#6b7280;--soft:#2a2e38;--br:#c99560;--si:#7aa2dc;--go:#f0924a;--ok:#72c08f;--bad:#ef7666;--gr:#aab2bf;--pu:#a98be0}</style><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mute)"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)"/></marker><marker id="ah-br" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--br)"/></marker><marker id="ah-si" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--si)"/></marker><marker id="ah-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--go)"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gr)"/></marker><marker id="ah-pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pu)"/></marker></defs><text x="20" y="26" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="start">One row: trip_distance = 2.5 (example value), rate_code = &#x27;2&#x27;</text><rect x="20" y="50" width="170" height="50" rx="8" fill="var(--br)" fill-opacity="0.16" stroke="var(--br)" stroke-width="1.6"/><text x="105.0" y="71.42500000000001" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">rate_code &#x27;2&#x27;</text><text x="105.0" y="87.025" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11.18" font-weight="400" fill="var(--mute)" text-anchor="middle">a string category</text><line x1="190" y1="75" x2="228" y2="75" stroke="var(--line)" stroke-width="1.6" marker-end="url(#ah-line)"/><rect x="232" y="50" width="190" height="50" rx="8" fill="var(--go)" fill-opacity="0.16" stroke="var(--go)" stroke-width="1.6"/><text x="327.0" y="71.42500000000001" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">StringIndexer</text><text x="327.0" y="87.025" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11.18" font-weight="400" fill="var(--mute)" text-anchor="middle">&#x27;2&#x27; has index 1</text><line x1="422" y1="75" x2="460" y2="75" stroke="var(--line)" stroke-width="1.6" marker-end="url(#ah-line)"/><rect x="464" y="50" width="200" height="50" rx="8" fill="var(--go)" fill-opacity="0.16" stroke="var(--go)" stroke-width="1.6"/><text x="564.0" y="71.42500000000001" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">OneHotEncoder</text><text x="564.0" y="87.025" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11.18" font-weight="400" fill="var(--mute)" text-anchor="middle">(6,[1],[1.0])</text><line x1="664" y1="75" x2="702" y2="75" stroke="var(--line)" stroke-width="1.6" marker-end="url(#ah-line)"/><rect x="706" y="50" width="175" height="50" rx="8" fill="var(--si)" fill-opacity="0.16" stroke="var(--si)" stroke-width="1.6"/><text x="793.5" y="71.42500000000001" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">VectorAssembler</text><text x="793.5" y="87.025" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11.18" font-weight="400" fill="var(--mute)" text-anchor="middle">7 slots</text><rect x="20" y="140" width="115" height="36" rx="3" fill="var(--si)" fill-opacity="0.2" stroke="var(--si)" stroke-width="1.6"/><text x="77" y="164" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="var(--ink)" text-anchor="middle">2.5</text><text x="77" y="194" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="middle">trip_distance</text><text x="77" y="132" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="var(--mute)" text-anchor="middle">slot 0</text><rect x="143" y="140" width="115" height="36" rx="3" fill="var(--gr)" fill-opacity="0.06" stroke="var(--gr)" stroke-width="1.6"/><text x="200" y="164" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="var(--ink)" text-anchor="middle">0</text><text x="200" y="194" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="middle">rate_vec_1</text><text x="200" y="132" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="var(--mute)" text-anchor="middle">slot 1</text><rect x="266" y="140" width="115" height="36" rx="3" fill="var(--go)" fill-opacity="0.2" stroke="var(--go)" stroke-width="1.6"/><text x="323" y="164" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="var(--ink)" text-anchor="middle">1</text><text x="323" y="194" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="middle">rate_vec_2</text><text x="323" y="132" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="var(--mute)" text-anchor="middle">slot 2</text><rect x="389" y="140" width="115" height="36" rx="3" fill="var(--gr)" fill-opacity="0.06" stroke="var(--gr)" stroke-width="1.6"/><text x="446" y="164" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="var(--ink)" text-anchor="middle">0</text><text x="446" y="194" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="middle">rate_vec_5</text><text x="446" y="132" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="var(--mute)" text-anchor="middle">slot 3</text><rect x="512" y="140" width="115" height="36" rx="3" fill="var(--gr)" fill-opacity="0.06" stroke="var(--gr)" stroke-width="1.6"/><text x="569" y="164" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="var(--ink)" text-anchor="middle">0</text><text x="569" y="194" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="middle">rate_vec_3</text><text x="569" y="132" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="var(--mute)" text-anchor="middle">slot 4</text><rect x="635" y="140" width="115" height="36" rx="3" fill="var(--gr)" fill-opacity="0.06" stroke="var(--gr)" stroke-width="1.6"/><text x="692" y="164" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="var(--ink)" text-anchor="middle">0</text><text x="692" y="194" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="middle">rate_vec_4</text><text x="692" y="132" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="var(--mute)" text-anchor="middle">slot 5</text><rect x="758" y="140" width="115" height="36" rx="3" fill="var(--gr)" fill-opacity="0.06" stroke="var(--gr)" stroke-width="1.6"/><text x="815" y="164" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="var(--ink)" text-anchor="middle">0</text><text x="815" y="194" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="middle">rate_vec_99</text><text x="815" y="132" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="var(--mute)" text-anchor="middle">slot 6</text><text x="20" y="226" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="start">The slot names come from the metadata of the vector column (ml_attr). Rate code 1 has index 0,</text><text x="20" y="244" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="start">so its one-hot slot is rate_vec_1. With dropLast=True, the seventh category (index 6) has no slot.</text></svg>
