96.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7BC496" text-anchor="start" dominant-baseline="middle">3 live</text><text x="230" y="326.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#E4E0D8" text-anchor="start" dominant-baseline="middle">rewrite_data_files makes the live table small. Only expire_snapshots removes files from the disk,</text><text x="230" y="344.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#E4E0D8" text-anchor="start" dominant-baseline="middle">and a branch or a tag keeps the files of its snapshot.</text></svg>
