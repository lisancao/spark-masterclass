<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="Words that share a HashingTF slot, by numFeatures"><title>Words that share a HashingTF slot, by numFeatures</title><style>svg{--ink:#1f2937;--mute:#5b6472;--line:#9aa3af;--soft:#eef0f3;--br:#8a5a2b;--si:#3a5f96;--go:#c0661a;--ok:#3f7d58;--bad:#b03a2e;--gr:#4b5563;--pu:#6b4fa0}</style><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mute)"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)"/></marker><marker id="ah-br" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--br)"/></marker><marker id="ah-si" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--si)"/></marker><marker id="ah-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--go)"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gr)"/></marker><marker id="ah-pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pu)"/></marker></defs><text x="20" y="26" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="start">127 distinct words in 400 tickets: words that share a slot</text><text x="20" y="65" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">numFeatures 2^6</text><text x="220" y="65" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="end">64</text><rect x="230" y="50" width="374.0" height="24" rx="3" fill="var(--bad)" fill-opacity="0.35" stroke="var(--bad)" stroke-width="0"/><text x="612.0" y="67" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">68 words share a slot (59 slots used)</text><text x="20" y="105" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">numFeatures 2^8</text><text x="220" y="105" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="end">256</text><rect x="230" y="90" width="148.5" height="24" rx="3" fill="var(--bad)" fill-opacity="0.35" stroke="var(--bad)" stroke-width="0"/><text x="386.5" y="107" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">27 words share a slot (100 slots used)</text><text x="20" y="145" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">numFeatures 2^10</text><text x="220" y="145" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="end">1,024</text><rect x="230" y="130" width="44.0" height="24" rx="3" fill="var(--bad)" fill-opacity="0.35" stroke="var(--bad)" stroke-width="0"/><text x="282.0" y="147" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">8 words share a slot (119 slots used)</text><text x="20" y="185" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">numFeatures 2^12</text><text x="220" y="185" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="end">4,096</text><rect x="230" y="170" width="11.0" height="24" rx="3" fill="var(--bad)" fill-opacity="0.35" stroke="var(--bad)" stroke-width="0"/><text x="249.0" y="187" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">2 words share a slot (125 slots used)</text><text x="20" y="225" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">numFeatures 2^18</text><text x="220" y="225" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="end">262,144</text><text x="238.0" y="227" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">0 words share a slot (127 slots used)</text><text x="20" y="258" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="start">A collision adds the counts of two words. 2^18 is the default.</text></svg>
