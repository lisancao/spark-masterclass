<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" role="img"><title>Copy-on-write and merge-on-read in Iceberg</title><defs><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3A9B3"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A606B"/></marker><marker id="ah-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E4E0D8"/></marker><marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F07A3C"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7BC496"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7FB0E6"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E6B455"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F08070"/></marker></defs><text x="20" y="20.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#A3A9B3" text-anchor="start" dominant-baseline="middle">A DELETE of one row in each mode (iceberg_log.txt)</text><text x="210" y="52.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">copy-on-write: DELETE Charlie</text><rect x="20" y="70" width="160" height="56" rx="8" fill="#353944" stroke="#A3A9B3" stroke-width="1.5" opacity="1"/><text x="100.0" y="91.06" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">data file</text><text x="100.0" y="106.07" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">5 rows</text><line x1="184" y1="98" x2="250" y2="98" stroke="#A3A9B3" stroke-width="1.6" marker-end="url(#ah-mute)"/><text x="217.0" y="89.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">rewrite</text><rect x="254" y="70" width="160" height="56" rx="8" fill="#1E3A2B" stroke="#7BC496" stroke-width="1.5" opacity="1"/><text x="334.0" y="91.06" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">new data file</text><text x="334.0" y="106.07" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">4 rows</text><text x="210" y="150.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">overwrite snapshot: 1 file added, 1 deleted</text><text x="650" y="52.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">merge-on-read: DELETE Eve</text><rect x="470" y="70" width="190" height="56" rx="8" fill="#2A2D36" stroke="#5A606B" stroke-width="1.5" opacity="1"/><text x="565.0" y="91.06" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">data file (same file)</text><text x="565.0" y="106.07" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">4 rows, content 0</text><text x="675" y="98.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">+</text><rect x="690" y="70" width="150" height="56" rx="8" fill="#3D3018" stroke="#E6B455" stroke-width="1.5" opacity="1"/><text x="765.0" y="91.6875" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E4E0D8" text-anchor="middle" dominant-baseline="middle">position delete file</text><text x="765.0" y="105.7625" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">1 row, content 1</text><text x="655" y="150.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#A3A9B3" text-anchor="middle" dominant-baseline="middle">a reader skips the positions in the delete file</text><text x="20" y="200.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#E4E0D8" text-anchor="start" dominant-baseline="middle">Copy-on-write rewrites a whole file for a small change. Merge-on-read writes a small delete file,</text><text x="20" y="220.0" font-family="'DM Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#E4E0D8" text-anchor="start" dominant-baseline="middle">and readers do a little more work until compaction writes the deletes into new data files.</text></svg>
