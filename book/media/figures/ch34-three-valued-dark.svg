<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" role="img"><title>exists and forall with NULL elements</title><text x="20" y="24.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#e6edf3" xml:space="preserve">Three-valued logic: NULL means &quot;cannot say&quot;</text><text x="330" y="52.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3" xml:space="preserve">exists(x &gt; 3)</text><text x="510" y="52.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3" xml:space="preserve">forall(x &gt; 0)</text><text x="690" y="52.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3" xml:space="preserve">array_contains(5)</text><text x="230" y="86.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="end" fill="#e6edf3" xml:space="preserve">array(1, 2)</text><rect x="260" y="68" width="140" height="28" rx="8" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1.5"/><text x="330.0" y="85.9" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#ffb3b3" xml:space="preserve">false</text><rect x="440" y="68" width="140" height="28" rx="8" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><text x="510.0" y="85.9" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#9be6ae" xml:space="preserve">true</text><rect x="620" y="68" width="140" height="28" rx="8" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1.5"/><text x="690.0" y="85.9" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#ffb3b3" xml:space="preserve">false</text><text x="230" y="124.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="end" fill="#e6edf3" xml:space="preserve">array(1, NULL)</text><rect x="260" y="106" width="140" height="28" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="330.0" y="123.9" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">NULL</text><rect x="440" y="106" width="140" height="28" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="510.0" y="123.9" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">NULL</text><rect x="620" y="106" width="140" height="28" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="690.0" y="123.9" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">NULL</text><text x="230" y="162.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="end" fill="#e6edf3" xml:space="preserve">array(5, NULL)</text><rect x="260" y="144" width="140" height="28" rx="8" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><text x="330.0" y="161.9" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#9be6ae" xml:space="preserve">true</text><rect x="440" y="144" width="140" height="28" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="510.0" y="161.9" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">NULL</text><rect x="620" y="144" width="140" height="28" rx="8" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><text x="690.0" y="161.9" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#9be6ae" xml:space="preserve">true</text><text x="230" y="200.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="end" fill="#e6edf3" xml:space="preserve">array()</text><rect x="260" y="182" width="140" height="28" rx="8" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1.5"/><text x="330.0" y="199.9" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#ffb3b3" xml:space="preserve">false</text><rect x="440" y="182" width="140" height="28" rx="8" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><text x="510.0" y="199.9" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#9be6ae" xml:space="preserve">true</text><rect x="620" y="182" width="140" height="28" rx="8" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1.5"/><text x="690.0" y="199.9" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#ffb3b3" xml:space="preserve">false</text><text x="20" y="240.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#9da7b3" font-style="italic" xml:space="preserve">One NULL element can be the match, so exists cannot say false. forall on an empty array is true.</text></svg>
