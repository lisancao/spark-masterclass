<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img"><title>One key in more places each time</title><text x="20" y="28.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#e6edf3" xml:space="preserve">Each row is a new session with one more source. What wins?</text><text x="470" y="62.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#9da7b3" xml:space="preserve">spark.sql.shuffle.partitions</text><text x="630" y="62.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#9da7b3" xml:space="preserve">spark.driver.memory</text><text x="630" y="77.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">(the SparkConf says)</text><text x="800" y="62.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#9da7b3" xml:space="preserve">JVM heap</text><text x="800" y="77.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">(what really happened)</text><rect x="20" y="90" width="370" height="36" rx="6" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="32" y="113.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#e6edf3" xml:space="preserve">built-in defaults only</text><rect x="420" y="90" width="100" height="36" rx="8" fill="#3a2416" stroke="#ff8a4c" stroke-width="1.5"/><text x="470.0" y="112.5" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" f