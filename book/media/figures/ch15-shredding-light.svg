<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img"><title>The Parquet columns of a VARIANT, with and without shredding</title><text x="20" y="24.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1f2328" xml:space="preserve">try_variant_get(v, &#x27;$.user.id&#x27;, &#x27;bigint&#x27;): the columns that the scan reads</text><text x="20" y="56.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#1f2328" xml:space="preserve">shredding off: 2 binary columns</text><rect x="20" y="70" width="180" height="40" rx="8" fill="#fff0e6" stroke="#e8590c" stroke-width="1.5"/><text x="110.0" y="87.3" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#9a3412" xml:space="preserve">v.metadata</text><text x="110.0" y="102.5" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="middle" fill="#9a3412" xml:space="preserve">field names</text><rect x="210" y="70" width="180" height="40" rx="8" fill="#fff0e6" stroke="#e8590c" stroke-width="1.5"/><text x="300.0" y="87.3" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#9a3412" xml:space="preserve">v.value</text><text x="300.0" y="102.5" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="middle" fill="#9a3412" xml:space="preserve">all the data</text><text x="20" y="132.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#9a3412" xml:space="preserve">reads the full value blob, then looks up user.id</text><text x="440" y="56.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#1f2328" xml:space="preserve">shredding on: 25 leaf columns, for example</text><rect x="440" y="68" width="400" height="24" rx="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><text x="640.0" y="83.3" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328" xml:space="preserve">v.metadata</text><rect x="440" y="98" width="400" height="24" rx="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><text x="640.0" y="113.3" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328" xml:space="preserve">v.value</text><rect x="440" y="128" width="400" height="24" rx="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><text x="640.0" y="143.3" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328" xml:space="preserve">v.typed_value.amount.value</text><rect x="440" y="158" width="400" height="24" rx="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><text x="640.0" y="173.3" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328" xml:space="preserve">v.typed_value.user.value</text><rect x="440" y="188" width="400" height="24" rx="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><text x="640.0" y="203.3" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328" xml:space="preserve">v.typed_value.user.typed_value.id.value</text><rect x="440" y="218" width="400" height="24" rx="8" fill="#e7f5ec" stroke="#2f9e44" stroke-width="1.5"/><text x="640.0" y="233.3" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1e6b30" xml:space="preserve">v.typed_value.user.typed_value.id.typed_value</text><rect x="440" y="248" width="400" height="24" rx="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><text x="640.0" y="263.3" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328" xml:space="preserve">v.typed_value.user.typed_value.plan.typed_value</text><rect x="440" y="278" width="400" height="24" rx="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><text x="640.0" y="293.3" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328" xml:space="preserve">v.typed_value.user_id.typed_value</text><text x="440" y="322.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#1e6b30" xml:space="preserve">reads one int64 column (green) for user.id</text><text x="20" y="190.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#57606a" xml:space="preserve">amount has only a value column:</text><text x="20" y="208.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#57606a" xml:space="preserve">its values are a number, a string or an object,</text><text x="20" y="226.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#57606a" xml:space="preserve">so no one type fits enough rows.</text></svg>
