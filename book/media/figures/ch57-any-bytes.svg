<text x="20" y="140.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8a919e" text-anchor="start" font-weight="600">Each field is a key, then a value. key = field_number &lt;&lt; 3 | wire_type.</text>
<text x="20" y="160.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8a919e" text-anchor="start" font-weight="400">Wire type 2 (strings, bytes, embedded messages) is a length, then that number of bytes.</text>
<text x="20" y="180.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8a919e" text-anchor="start" font-weight="400">Thus a bytes field and an embedded Relation look the same on the wire.</text>
