" text-anchor="middle" fill="#9da7b3" xml:space="preserve">your pod runs</text><text x="815.0" y="182.7" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">spark-submit</text><rect x="710" y="225" width="210" height="62" rx="8" fill="#17301f" stroke="#4cc26a" stroke-width="1.5"/><text x="815.0" y="252.7" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#9be6ae" xml:space="preserve">driver</text><text x="815.0" y="270.8" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" fill="#9be6ae" xml:space="preserve">pod ch80-client-driver</text><rect x="710" y="320" width="210" height="62" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="815.0" y="339.9" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">executors</text><text x="815.0" y="357.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">2 executor pods</text><text x="815.0" y="372.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">owned by that pod</text><polyline points="815,192 815,225" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="815,225 819.5,216.0 810.5,216.0" fill="#7d8590"/><polyline points="815,287 815,320" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="815,320 819.5,311.0 810.5,311.0" fill="#7d8590"/><text x="822" y="308.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="start" fill="#9da7b3" xml:space="preserve">tasks</text><text x="815" y="405.0" font-family="'JetBrains Mono', 'Monaspace Neon', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">k8s-client-in-cluster.txt</text><text x="20" y="440.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#9da7b3" xml:space="preserve">In client mode the submitting process is the driver. In cluster mode the cluster starts the driver, and the submitting process only reports.</text></svg>
