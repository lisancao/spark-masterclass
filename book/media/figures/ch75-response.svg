<text x="12" y="176.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8a919e" text-anchor="start" font-weight="600">All numbers are big-endian. A positive int is the length of the next frame.</text>
<text x="12" y="196.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8a919e" text-anchor="start" font-weight="400">A negative int is a marker from SpecialLengths. -2 (PYTHON_EXCEPTION_THROWN) replaces the results when the UDF raises.</text>
