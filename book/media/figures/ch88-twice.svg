<text x="390" y="290.0" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8a919e" text-anchor="middle" font-weight="400" font-style="italic">Counts from an accumulator in the UDF. avoidDoubleFilterEval = true does not cover a Python UDF in 4.3.0.</text></svg>
