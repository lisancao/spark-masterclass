<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img"><title>What each setting protects</title><text x="20" y="28.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#e6edf3" xml:space="preserve">The surfaces of a Spark application, and the setting that protects each one</text><rect x="330" y="60" width="280" height="80" rx="8" fill="#3a2416" stroke="#ff8a4c" stroke-width="1.5"/><text x="470.0" y="97.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#ffbe99" xml:space="preserve">driver</text><text x="470.0" y="115.5" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#ffbe99" xml:space="preserve">SparkContext, UI on 4040</text><rect x="40" y="250" width="220" height="70" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="150.0" y="289.5" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">executor</text><rect x="360" y="250" width="220" height="70" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="470.0" y="289.5" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">executor</text><rect x="690" y="250" width="220" height="70" rx="8" fill="#2b3038" stroke="#6e7781" stroke-width="1.5"/><text x="800.0" y="282.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3" xml:space="preserve">master / worker</text><text x="800.0" y="300.4" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">(standalone)</text><rect x="690" y="60" width="220" height="80" rx="8" fill="none" stroke="#7d8590" stroke-width="1.5"/><text x="800.0" y="97.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#9da7b3" xml:space="preserve">browser, curl</text><text x="800.0" y="115.5" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">UI and REST API</text><rect x="40" y="60" width="220" height="80" rx="8" fill="none" stroke="#7d8590" stroke-width="1.5"/><text x="150.0" y="97.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#9da7b3" xml:space="preserve">Connect client</text><text x="150.0" y="115.5" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">gRPC, port 15002</text><rect x="40" y="380" width="320" height="60" rx="8" fill="#271c3d" stroke="#a78bfa" stroke-width="1.5"/><text x="200.0" y="413.9" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#d4c4ff" xml:space="preserve">local disk: shuffle, spill, cache</text><rect x="400" y="380" width="240" height="60" rx="8" fill="#271c3d" stroke="#a78bfa" stroke-width="1.5"/><text x="520.0" y="413.9" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#d4c4ff" xml:space="preserve">event log, UI Environment</text><rect x="680" y="380" width="230" height="60" rx="8" fill="#271c3d" stroke="#a78bfa" stroke-width="1.5"/><text x="795.0" y="407.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#d4c4ff" xml:space="preserve">Kerberos services</text><text x="795.0" y="423.7" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#d4c4ff" xml:space="preserve">HDFS, Hive metastore</text><polyline points="380,140 160,250" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="160,250 170.1,250.0 166.0,242.0" fill="#7d8590"/><polygon points="380,140 369.9,140.0 374.0,148.0" fill="#7d8590"/><polyline points="470,140 470,250" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="470,250 474.5,241.0 465.5,241.0" fill="#7d8590"/><polygon points="470,140 465.5,149.0 474.5,149.0" fill="#7d8590"/><polyline points="600,140 800,250" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="800,250 794.3,241.7 789.9,249.6" fill="#7d8590"/><polygon points="600,140 605.7,148.3 610.1,140.4" fill="#7d8590"/><polyline points="260,285 360,285" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="360,285 351.0,280.5 351.0,289.5" fill="#7d8590"/><polygon points="260,285 269.0,289.5 269.0,280.5" fill="#7d8590"/><text x="482" y="190.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#a8caff" xml:space="preserve">RPC: spark.authenticate</text><text x="482" y="206.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#a8caff" xml:space="preserve">+ spark.network.crypto.enabled</text><text x="482" y="222.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#a8caff" xml:space="preserve">or spark.ssl.rpc.enabled</text><text x="310" y="278.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#9da7b3" xml:space="preserve">shuffle fetch</text><polyline points="690,100 610,100" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="610,100 619.0,104.5 619.0,95.5" fill="#7d8590"/><polygon points="690,100 681.0,95.5 681.0,104.5" fill="#7d8590"/><text x="700" y="162.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#9be6ae" xml:space="preserve">spark.ssl.ui.*, spark.ui.filters,</text><text x="700" y="178.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#9be6ae" xml:space="preserve">spark.acls.enable</text><polyline points="260,100 330,100" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-linejoin="round"/><polygon points="330,100 321.0,95.5 321.0,104.5" fill="#7d8590"/><polygon points="260,100 269.0,104.5 269.0,95.5" fill="#7d8590"/><text x="40" y="162.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#9be6ae" xml:space="preserve">spark.connect.authenticate.token</text><text x="40" y="178.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#9be6ae" xml:space="preserve">+ TLS at a proxy (Chapter 24)</text><text x="200" y="365.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#d4c4ff" xml:space="preserve">spark.io.encryption.enabled</text><text x="520" y="365.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#d4c4ff" xml:space="preserve">spark.redaction.regex</text><text x="795" y="365.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#d4c4ff" xml:space="preserve">spark.kerberos.*, tokens</text><text x="932" y="462.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end" fill="#9da7b3" font-style="italic" xml:space="preserve">schematic; the ports are the defaults</text></svg>
