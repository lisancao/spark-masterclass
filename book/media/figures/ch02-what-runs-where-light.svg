<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img"><title>What each install puts on your machine</title><text x="116.0" y="30.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328" xml:space="preserve">1. pip</text><rect x="18" y="42" width="196" height="300" rx="10" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="116.0" y="60.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#57606a" xml:space="preserve">your machine</text><rect x="26" y="72" width="180" height="54" rx="8" fill="#e8f1fd" stroke="#3b82f6" stroke-width="1.5"/><text x="116.0" y="102.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1e4f9c" xml:space="preserve">your Python 3.11+</text><rect x="26" y="136" width="180" height="54" rx="8" fill="#fff0e6" stroke="#e8590c" stroke-width="1.5"/><text x="116.0" y="159.7" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9a3412" xml:space="preserve">pyspark package</text><text x="116.0" y="176.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#9a3412" xml:space="preserve">280 jars inside</text><rect x="26" y="200" width="180" height="54" rx="8" fill="#fff0e6" stroke="#e8590c" stroke-width="1.5"/><text x="116.0" y="223.7" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9a3412" xml:space="preserve">driver JVM</text><text x="116.0" y="240.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#9a3412" xml:space="preserve">child process, Py4J</text><rect x="26" y="264" width="180" height="54" rx="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><text x="116.0" y="294.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328" xml:space="preserve">your JDK 17, 21 or 25</text><text x="326.0" y="30.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328" xml:space="preserve">2. Tarball</text><rect x="228" y="42" width="196" height="300" rx="10" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="326.0" y="60.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#57606a" xml:space="preserve">your machine</text><rect x="236" y="72" width="180" height="54" rx="8" fill="#e8f1fd" stroke="#3b82f6" stroke-width="1.5"/><text x="326.0" y="102.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1e4f9c" xml:space="preserve">your Python (optional)</text><rect x="236" y="136" width="180" height="54" rx="8" fill="#fff0e6" stroke="#e8590c" stroke-width="1.5"/><text x="326.0" y="159.7" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9a3412" xml:space="preserve">spark-4.3.0-bin-hadoop3/</text><text x="326.0" y="176.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#9a3412" xml:space="preserve">bin  sbin  conf  jars</text><rect x="236" y="200" width="180" height="54" rx="8" fill="#fff0e6" stroke="#e8590c" stroke-width="1.5"/><text x="326.0" y="223.7" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9a3412" xml:space="preserve">driver JVM</text><text x="326.0" y="240.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#9a3412" xml:space="preserve">from spark-submit</text><rect x="236" y="264" width="180" height="54" rx="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5"/><text x="326.0" y="294.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328" xml:space="preserve">your JDK 17, 21 or 25</text><text x="536.0" y="30.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328" xml:space="preserve">3. Docker</text><rect x="438" y="42" width="196" height="300" rx="10" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="536.0" y="60.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#57606a" xml:space="preserve">your machine</text><rect x="446" y="72" width="180" height="258" rx="8" fill="none" stroke="#8b5cf6" stroke-width="1.5"/><text x="536.0" y="90.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#5b2ca0" xml:space="preserve">container</text><rect x="454" y="102" width="164" height="62" rx="8" fill="#f3ecfd" stroke="#8b5cf6" stroke-width="1.5"/><text x="536.0" y="136.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#5b2ca0" xml:space="preserve">Python 3.10.12</text><rect x="454" y="174" width="164" height="62" rx="8" fill="#f3ecfd" stroke="#8b5cf6" stroke-width="1.5"/><text x="536.0" y="208.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#5b2ca0" xml:space="preserve">/opt/spark + driver JVM</text><rect x="454" y="246" width="164" height="62" rx="8" fill="#f3ecfd" stroke="#8b5cf6" stroke-width="1.5"/><text x="536.0" y="280.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#5b2ca0" xml:space="preserve">Java 21 (in the image)</text><text x="746.0" y="30.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328" xml:space="preserve">4. Spark Connect</text><rect x="648" y="42" width="196" height="300" rx="10" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="746.0" y="60.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#57606a" xml:space="preserve">your machine</text><rect x="656" y="72" width="180" height="54" rx="8" fill="#e8f1fd" stroke="#3b82f6" stroke-width="1.5"/><text x="746.0" y="102.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1e4f9c" xml:space="preserve">your Python 3.11+</text><rect x="656" y="136" width="180" height="54" rx="8" fill="#e7f5ec" stroke="#2f9e44" stroke-width="1.5"/><text x="746.0" y="159.7" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1e6b30" xml:space="preserve">pyspark-client</text><text x="746.0" y="176.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#1e6b30" xml:space="preserve">11 MB, no jars</text><rect x="656" y="200" width="180" height="54" rx="8" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="746.0" y="230.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#57606a" xml:space="preserve">no JVM</text><rect x="656" y="264" width="180" height="54" rx="8" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="746.0" y="294.6" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#57606a" xml:space="preserve">no JDK</text><text x="746.0" y="362.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#1e6b30" xml:space="preserve">gRPC, port 15002, to a</text><text x="746.0" y="378.0" font-family="Inter, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#1e6b30" xml:space="preserve">Connect server with the driver JVM</text></svg>
