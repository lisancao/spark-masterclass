<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Why a full refresh does not send the sink rows again"><title>Why a full refresh does not send the sink rows again</title><style>svg{--ink:#e5e7eb;--mute:#a3abb8;--line:#6b7280;--soft:#2a2e38;--br:#c99560;--si:#7aa2dc;--go:#f0924a;--ok:#72c08f;--bad:#ef7666;--gr:#aab2bf;--pu:#a98be0}</style><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mute)"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)"/></marker><marker id="ah-br" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--br)"/></marker><marker id="ah-si" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--si)"/></marker><marker id="ah-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--go)"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gr)"/></marker><marker id="ah-pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pu)"/></marker></defs><text x="20" y="26" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="start">Flow shipped_orders_to_feed writes to the JSON sink exports/shipping_feed</text><text x="20" y="60" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">checkpoint</text><text x="20" y="76" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">(pipeline storage)</text><text x="20" y="160" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">file sink log</text><text x="20" y="176" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">_spark_metadata</text><text x="275" y="46" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="var(--ink)" text-anchor="middle">run 1</text><rect x="170" y="54" width="210" height="50" rx="8" fill="var(--si)" fill-opacity="0.16" stroke="var(--si)" stroke-width="1.6"/><text x="275.0" y="75.69999999999999" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">version 0, batch 0</text><text x="275.0" y="90.1" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="10.32" font-weight="400" fill="var(--mute)" text-anchor="middle">2 rows</text><line x1="275" y1="104" x2="275" y2="142" stroke="var(--ok)" stroke-width="1.6" marker-end="url(#ah-ok)"/><rect x="170" y="146" width="210" height="44" rx="8" fill="var(--ok)" fill-opacity="0.16" stroke="var(--ok)" stroke-width="1.6"/><text x="275.0" y="172.32" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">batch 0 written</text><text x="515" y="46" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="var(--ink)" text-anchor="middle">run 2</text><rect x="410" y="54" width="210" height="50" rx="8" fill="var(--si)" fill-opacity="0.16" stroke="var(--si)" stroke-width="1.6"/><text x="515.0" y="75.69999999999999" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">version 0, batch 1</text><text x="515.0" y="90.1" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="10.32" font-weight="400" fill="var(--mute)" text-anchor="middle">1 new row</text><line x1="515" y1="104" x2="515" y2="142" stroke="var(--ok)" stroke-width="1.6" marker-end="url(#ah-ok)"/><rect x="410" y="146" width="210" height="44" rx="8" fill="var(--ok)" fill-opacity="0.16" stroke="var(--ok)" stroke-width="1.6"/><text x="515.0" y="172.32" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">batch 1 written</text><text x="755" y="46" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="var(--go)" text-anchor="middle">full refresh</text><rect x="650" y="54" width="210" height="50" rx="8" fill="var(--si)" fill-opacity="0.16" stroke="var(--si)" stroke-width="1.6"/><text x="755.0" y="75.69999999999999" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">version 1, batch 0 again</text><text x="755.0" y="90.1" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="10.32" font-weight="400" fill="var(--mute)" text-anchor="middle">all shipped orders</text><line x1="755" y1="104" x2="755" y2="142" stroke="var(--bad)" stroke-width="1.6" marker-end="url(#ah-bad)"/><rect x="650" y="146" width="210" height="44" rx="8" fill="var(--bad)" fill-opacity="0.16" stroke="var(--bad)" stroke-width="1.6"/><text x="755.0" y="172.32" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">batch 0 is in the log: skipped</text><text x="20" y="230" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="start">The feed has 3 rows after run 2 and still 3 rows after the full refresh.</text><text x="20" y="250" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="start">The full refresh gives the flow a new checkpoint version, and the batch IDs start again at 0.</text><text x="20" y="270" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="var(--mute)" text-anchor="start">The sink log already has batches 0 and 1, so FileStreamSink.addBatch skips them.</text></svg>
