<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Rows that go into the model for six actions on the same 240 rows"><title>Rows that go into the model for six actions on the same 240 rows</title><style>svg{--ink:#e5e7eb;--mute:#a3abb8;--line:#6b7280;--soft:#2a2e38;--br:#c99560;--si:#7aa2dc;--go:#f0924a;--ok:#72c08f;--bad:#ef7666;--gr:#aab2bf;--pu:#a98be0}</style><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mute)"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)"/></marker><marker id="ah-br" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--br)"/></marker><marker id="ah-si" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--si)"/></marker><marker id="ah-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--go)"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gr)"/></marker><marker id="ah-pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pu)"/></marker></defs><text x="20" y="26" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="start">Rows into the model, for each action on the same labelled DataFrame (240 rows)</text><text x="270" y="64" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="end">collect()</text><rect x="280" y="50" width="180.0" height="22" rx="3" fill="var(--si)" fill-opacity="0.4" stroke="var(--si)" stroke-width="0"/><text x="468.0" y="66" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="start">240</text><text x="504.0" y="66" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">every row</text><text x="270" y="102" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="end">count()</text><text x="288.0" y="104" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="start">0</text><text x="324.0" y="104" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">column pruning removes the UDF</text><text x="270" y="140" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="end">limit(3).collect()</text><rect x="280" y="126" width="2.25" height="22" rx="3" fill="var(--ok)" fill-opacity="0.4" stroke="var(--ok)" stroke-width="0"/><text x="290.25" y="142" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="start">3</text><text x="326.25" y="142" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">the limit goes below the UDF</text><text x="270" y="178" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="end">filter on the label</text><rect x="280" y="164" width="351.0" height="22" rx="3" fill="var(--bad)" fill-opacity="0.4" stroke="var(--bad)" stroke-width="0"/><text x="639.0" y="180" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="start">468</text><text x="675.0" y="180" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">two ArrowEvalPython: 240 + 228</text><text x="270" y="216" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="end">asNondeterministic() + filter</text><rect x="280" y="202" width="180.0" height="22" rx="3" fill="var(--si)" fill-opacity="0.4" stroke="var(--si)" stroke-width="0"/><text x="468.0" y="218" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="start">240</text><text x="504.0" y="218" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">the optimizer does not copy the UDF</text><text x="270" y="254" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="var(--ink)" text-anchor="end">cache(), count(), then filter</text><rect x="280" y="240" width="180.0" height="22" rx="3" fill="var(--si)" fill-opacity="0.4" stroke="var(--si)" stroke-width="0"/><text x="468.0" y="256" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Fira Code&#x27;, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="start">240</text><text x="504.0" y="256" font-family="Inter, &#x27;DM Sans&#x27;, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="var(--mute)" text-anchor="start">240 to fill the cache, then 0</text></svg>
