# Chapter 63: a SparkApplication for the Apache Spark Kubernetes Operator (spark.apache.org/v1, Chapter 62).
# Airflow renders this file with Jinja before it creates the resource. The two app-id annotations
# use a Jinja string literal, so that Spark (not Jinja) fills in its own APP_ID placeholder.
apiVersion: spark.apache.org/v1
kind: SparkApplication
metadata:
  name: zone-revenue-{{ ts_nodash | lower }}
  namespace: spark-apps
spec:
  pyFiles: local:///opt/ch63/jobs/zone_revenue.py
  driverArgs: ["/data/nyc-taxi", "-", "{{ run_id }}"]
  applicationTolerations:
    resourceRetainPolicy: Always      # keep the driver pod after the end, so that Airflow can read its log
  runtimeVersions:
    sparkVersion: "4.3.0"
  sparkConf:
    spark.kubernetes.container.image: apache/spark:4.3.0-python3
    spark.kubernetes.container.image.pullPolicy: Never
    spark.kubernetes.authenticate.driver.serviceAccountName: spark
    spark.executor.instances: "2"
    spark.executor.cores: "1"
    spark.executor.memory: 1g
    spark.driver.memory: 1g
    spark.kubernetes.scheduler.name: yunikorn
    spark.kubernetes.driver.label.queue: root.etl
    spark.kubernetes.executor.label.queue: root.etl
    spark.kubernetes.driver.annotation.yunikorn.apache.org/app-id: "{{ '{{APP_ID}}' }}"
    spark.kubernetes.executor.annotation.yunikorn.apache.org/app-id: "{{ '{{APP_ID}}' }}"
    spark.kubernetes.driver.volumes.hostPath.taxi.mount.path: /data/nyc-taxi
    spark.kubernetes.driver.volumes.hostPath.taxi.options.path: /data/nyc-taxi
    spark.kubernetes.executor.volumes.hostPath.taxi.mount.path: /data/nyc-taxi
    spark.kubernetes.executor.volumes.hostPath.taxi.options.path: /data/nyc-taxi
    spark.kubernetes.driver.volumes.hostPath.jobs.mount.path: /opt/ch63/jobs
    spark.kubernetes.driver.volumes.hostPath.jobs.options.path: /opt/ch63/jobs
