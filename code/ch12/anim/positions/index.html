<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="13.5" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Chapter 12, Step 18: the CSV reader takes one header and fills columns by position; unionByName matches by name.
      // Headers and the day 2 row (order 6) from code/ch12/output/csv_drift.txt.
      const D = {"files": [["sales_2026-10-01.csv", "id,amount,day"], ["sales_2026-10-02.csv", "day,id,amount"], ["sales_2026-10-03.csv", "id,amount,day,currency"]],
                 "row": {"day": "2026-10-02", "id": "6", "amount": "12.00"}};
      A.mount();
      // beat open (0.0)
      A.title("One header for a folder whose columns move");
      const fy = [0.27, 0.37, 0.47];
      const fl = D.files.map((f, i) => [
        A.text(f[0], { x: 0.05, y: fy[i], size: 26, weight: 600, anchor: "left", mono: true }),
        A.text(f[1], { x: 0.30, y: fy[i], size: 26, weight: 700, anchor: "left", mono: true, color: i === 1 ? "var(--a-acc)" : "var(--a-fg)" })]).flat();
      A.in(fl, 0.2, { stagger: 0.05 });
      const cols = ["id", "amount", "day", "currency"], CX = [0.62, 0.72, 0.82, 0.92], HY = 0.30;
      const heads = cols.map((c, i) => A.box({ x: CX[i], y: HY, w: 170, h: 56, kind: "soft", title: c, size: 26 }));
      function cap(s, t0, t1) { const c = A.text(s, { y: 0.915, size: 38, weight: 600 }); A.in(c, t0); if (t1) A.out(c, t1); return c; }
      // beat header (1.0): the reader takes the names from one file
      cap("Spark takes the column names from one file: day 3", 1.0, 3.6);
      const hl = A.box({ x: 0.30 + A.dx(170), y: fy[2], w: 420, h: 50, kind: "ghost", radius: 8 });
      A.in(hl, 1.2); A.in(heads, 1.6, { stagger: 0.08 });
      // beat position (3.8): the day 2 row goes into the columns by position
      cap("The day 2 values go into the columns by position", 3.8, 7.6);
      const vals = [D.row.day, D.row.id, D.row.amount];
      const vy0 = fy[1] + A.dy(52), RY = 0.44;
      const cells = vals.map((v, i) => {
        const c = A.box({ x: 0.33 + i * 0.075, y: vy0, w: 150, h: 50, kind: i === 0 ? "accent" : "paper", title: v, size: 22, radius: 8 });
        A.tl.set(c, { opacity: 0 }, 0); A.tl.to(c, { opacity: 1, duration: 0.3 }, 4.0 + i * 0.1);
        A.tl.to(c, { x: A.X(CX[i] - (0.33 + i * 0.075)), y: A.Y(RY - vy0), duration: 0.9, ease: "power2.inOut" }, 4.6 + i * 0.15);
        return c;
      });
      const wrong = A.text("a date in id, no error", { x: CX[0], y: RY + A.dy(56), size: 26, weight: 700, color: "var(--a-acc)" });
      A.in(wrong, 6.0);
      // beat byname (7.8): unionByName puts each value under its own name
      cap("unionByName reads each header and matches the columns by name", 7.8, 11.2);
      const RY2 = 0.62;
      const lab2 = A.text("unionByName", { x: 0.50, y: RY2, size: 28, weight: 700, color: "var(--a-ok)", mono: true });
      A.in(lab2, 8.0);
      const target = { 0: 2, 1: 0, 2: 1 };  // day -> day column, id -> id, amount -> amount
      vals.forEach((v, i) => {
        const c = A.box({ x: CX[target[i]], y: RY2, w: 150, h: 50, kind: "ok", title: v, size: 22, radius: 8 });
        A.tl.set(c, { opacity: 0 }, 0); A.tl.to(c, { opacity: 1, duration: 0.4 }, 8.4 + i * 0.25);
      });
      const nul = A.box({ x: CX[3], y: RY2, w: 150, h: 50, kind: "ghost", title: "NULL", size: 22, radius: 8 });
      A.tl.set(nul, { opacity: 0 }, 0); A.tl.to(nul, { opacity: 1, duration: 0.4 }, 9.2);
      cap("Each file keeps its own header. All 13 rows are correct.", 11.4);
      A.in(A.note("enforceSchema=false would stop the read on the first file that does not agree"), 0.5);
      A.finish(13.5);
    </script>
  </body>
</html>
