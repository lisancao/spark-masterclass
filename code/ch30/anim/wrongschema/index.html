<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Chapter 30: Avro bytes have no types, so a wrong reader schema can decode without an error.
      // Bytes and results from code/ch30/output/avro.txt (sections "the bytes of one record" and "decode with the wrong schema").
      const D = {"bytes": ["06","4f","2d","31","0e","00","00","00","00","00","00","29","40","00"],
                 "right": [[0,3,"order_id: string","'O-1'"],[4,4,"user_id: long","7"],[5,12,"total: double","12.5"],[13,13,"coupon: union","null"]],
                 "wrong": [[0,3,"order_id: string","'O-1'"],[4,4,"user_id: long","7"],[5,8,"total: float","0.0"],[9,9,"coupon: union","null"]]};
      A.mount();
      // beat open (0.0)
      A.title("Avro bytes have no types");
      const BW = 112, X0 = 0.5 - (D.bytes.length - 1) * A.dx(BW) / 2;
      const bx = (i) => X0 + i * A.dx(BW);
      const BY = 0.30;
      const cells = D.bytes.map((b, i) => A.box({ x: bx(i), y: BY, w: 96, h: 70, kind: "paper", title: b, size: 32, radius: 8 }));
      const lb = A.text("one record, 14 bytes", { x: 0.5, y: BY - A.dy(70), size: 28, weight: 600, color: "var(--a-mute)" });
      A.in([lb, ...cells], 0.2, { stagger: 0.02 });
      function cap(s, t0, t1) { const c = A.text(s, { y: 0.915, size: 38, weight: 600 }); A.in(c, t0); if (t1) A.out(c, t1); return c; }
      function decode(groups, y, t0, kind, out) {
        const els = [];
        groups.forEach(([a, b, name, val], g) => {
          const cx = (bx(a) + bx(b)) / 2, w = (b - a) * BW + 104;
          const br = A.box({ x: cx, y: BY, w, h: 86, kind: "ghost", radius: 12 });
          br.style.borderColor = kind === "bad" && g === 2 ? "var(--a-acc)" : "var(--a-ok)";
          const nm = A.text(name, { x: cx, y, size: 24, weight: 600, color: "var(--a-mute)" });
          const vv = A.text(val, { x: cx, y: y + A.dy(40), size: 36, weight: 700, color: kind === "bad" && g === 2 ? "var(--a-acc)" : "var(--a-ok)", mono: true });
          const t = t0 + g * 0.8;
          A.in([br, nm, vv], t, { stagger: 0.05 });
          A.out(br, t + 0.75);
          els.push(nm, vv);
        });
        if (out) A.out(els, out);
        return els;
      }
      // beat right (1.0): the writer schema reads each value in order
      cap("The reader schema says what each byte means", 1.0, 5.0);
      decode(D.right, 0.47, 1.4, "ok", 5.1);
      // beat wrong (5.4): total read as float
      cap("Read total as float: 4 of the 8 bytes, and the rest shifts", 5.4, 10.0);
      decode(D.wrong, 0.62, 5.8, "bad");
      // beat leftover (9.0): the last bytes are never read
      const left = [10, 11, 12, 13].map(i => cells[i]);
      A.tl.to(left, { opacity: 0.3, duration: 0.4 }, 9.2);
      const ln = A.text("never read", { x: (bx(10) + bx(13)) / 2, y: BY + A.dy(70), size: 26, weight: 700, color: "var(--a-acc)" });
      A.in(ln, 9.3);
      // beat end (10.2)
      cap("No error. A row of wrong values that looks correct.", 10.2);
      A.in(A.note("bytes and both results from avro.py on Spark 4.3.0"), 0.5);
      A.finish(14);
    </script>
  </body>
</html>
