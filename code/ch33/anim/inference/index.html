<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Chapter 33: a JSON read without a schema is two passes; the first one merges a type for each field.
      // amount types from the three days (chapter table and infer.txt); times from code/ch33/output/infer_cost.txt.
      const D = {"days": [["day 1", "\"amount\": 6.13", "double"], ["day 2", "\"amount\": \"32.83\"", "string"], ["day 3", "\"amount\": {\"value\", ...}", "string"]],
                 "count_noschema": "0.94 s", "count_schema": "0.39 s"};
      A.mount();
      // beat open (0.0)
      A.title("JSON without a schema: two passes");
      const FX = 0.15, FY = [0.27, 0.38, 0.49], JX = 0.50, J1 = 0.33, J2 = 0.52, SX = 0.82, LY = 0.76;
      const files = D.days.map((d, i) => A.box({ x: FX, y: FY[i], w: 400, h: 76, kind: "paper", title: d[0], sub: d[1], size: 26 }));
      const j1 = A.box({ x: JX, y: J1, w: 300, h: 96, kind: "soft", title: "job 1", sub: "inference", size: 30 });
      const j2 = A.box({ x: JX, y: J2, w: 300, h: 96, kind: "soft", title: "job 2", sub: "make the rows", size: 30 });
      const sp = A.box({ x: SX, y: J1, w: 330, h: 96, kind: "ghost", title: "", size: 30 });
      const st = A.text("amount: ?", { x: SX, y: J1, size: 32, weight: 700, mono: true });
      for (const b of [j1, j2]) b.style.zIndex = 5;
      A.in([...files, j1, j2, sp, st], 0.2, { stagger: 0.04 });
      function cap(s, t0, t1) { const c = A.text(s, { y: 0.915, size: 38, weight: 600 }); A.in(c, t0); if (t1) A.out(c, t1); return c; }
      function stream(fromX, fromY, toX, toY, t, n, color) {
        for (let k = 0; k < n; k++) {
          const d = A.dot({ x: fromX + A.dx(200), y: fromY, r: 11, color });
          A.tl.set(d, { opacity: 1 }, t + k * 0.12);
          A.tl.to(d, { x: A.X(toX - fromX - A.dx(200) - A.dx(150)), y: A.Y(toY - fromY), duration: 0.7, ease: "power1.inOut" }, t + k * 0.12);
          A.tl.set(d, { opacity: 0 }, t + k * 0.12 + 0.7);
        }
      }
      // beat infer (0.9): every record goes to job 1; the type of amount widens
      cap("Job 1 parses every record and merges a type for each field", 0.9, 5.0);
      D.days.forEach((d, i) => {
        const t = 1.2 + i * 1.1;
        stream(FX, FY[i], JX, J1, t, 4, "var(--a-acc)");
        const v = A.text("amount: " + d[2], { x: SX, y: J1, size: 32, weight: 700, mono: true, color: i ? "var(--a-acc)" : "var(--a-fg)" });
        A.tl.set(v, { opacity: 0 }, 0); A.tl.set(v, { opacity: 1 }, t + 1.0);
        A.tl.set(st, { opacity: 0 }, 2.2);
        if (i < 2) A.tl.set(v, { opacity: 0 }, t + 2.1);
      });
      const add = A.text("+ event_type, user.geo, _corrupt_record", { x: SX, y: J1 + A.dy(78), size: 24, weight: 600, color: "var(--a-mute)" });
      A.in(add, 4.5);
      // beat second (5.2): the action reads everything again
      cap("Then the action parses all the records a second time", 5.2, 8.6);
      D.days.forEach((d, i) => stream(FX, FY[i], JX, J2, 5.5 + i * 0.4, 4, "var(--a-mute)"));
      // beat schema (8.8): one pass with a schema
      const sf = A.box({ x: FX, y: LY, w: 400, h: 76, kind: "paper", title: "all 3 days", sub: "read.schema(ddl).json(...)", size: 26 });
      const sj = A.box({ x: JX, y: LY, w: 300, h: 96, kind: "ok", title: "one job", sub: "make the rows", size: 30 });
      sj.style.zIndex = 5;
      A.in([sf, sj], 8.8);
      cap("With a schema that you write, there is no inference job", 8.8, 11.6);
      stream(FX, LY, JX, LY, 9.3, 8, "var(--a-ok)");
      // beat cost (11.8)
      const c1 = A.text("count(): " + D.count_noschema, { x: SX, y: J2, size: 40, weight: 700, color: "var(--a-acc)" });
      const c2 = A.text("count(): " + D.count_schema, { x: SX, y: LY, size: 40, weight: 700, color: "var(--a-ok)" });
      A.in([c1, c2], 11.8);
      cap("On a million trips as JSON Lines", 11.8);
      A.in(A.note("dots are schematic; times: median of 5 runs, 16 cores"), 0.5);
      A.finish(14);
    </script>
  </body>
</html>
