<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>

      A.mount();
      // caption at the bottom: one beat, held long enough to read twice
      const cap = (s, t0, t1) => { const c = A.text(s, { y: 0.885, size: 38, weight: 500 }); A.in(c, t0); if (t1) A.out(c, t1); return c; };
      // Numbers from data.json (tables.txt). Timing is schematic.
      A.title("One Iceberg commit, file by file", "INSERT the June trips into lake.nyc.trips (Hadoop catalog)");
      // the catalog pointer and the reader
      const hint1 = A.box({ x: 0.13, y: 0.30, w: 300, h: 90, kind: "accent", title: "version-hint.text", sub: "1", size: 28 });
      const hint2 = A.box({ x: 0.13, y: 0.30, w: 300, h: 90, kind: "accent", title: "version-hint.text", sub: "2", size: 28 });
      gsap.set(hint2, { opacity: 0 });
      const v1 = A.box({ x: 0.40, y: 0.30, w: 360, h: 90, kind: "soft", title: "v1.metadata.json", sub: "1,474 B, no snapshot", size: 28 });
      const ptr = A.line({ x1: 0.13 + 0.08, y1: 0.30, x2: 0.40 - 0.095, y2: 0.30, color: "var(--a-acc)", width: 5 });
      const reader = A.text("a reader sees: 0 rows", { x: 0.02, anchor: "left", y: 0.42, size: 28, mono: true, color: "var(--a-mute)" });
      cap("Before the INSERT, the pointer names v1: an empty table", 0.2, 4.7);
      // beat files (4.8): data files, manifest, manifest list
      const files = [];
      for (let i = 0; i < 30; i++) files.push(A.box({ x: 0.36 + (i % 15) * 0.034, y: 0.69 + Math.floor(i / 15) * A.dy(50), w: 54, h: 40, kind: "ok", radius: 4 }));
      A.in(files, 4.9, { stagger: 0.04, dur: 0.25 });
      A.in(A.text("30 data files, one in each day folder", { x: 0.60, y: 0.62, size: 24, color: "var(--a-mute)" }), 5.0);
      const man = A.box({ x: 0.60, y: 0.53, w: 380, h: 70, kind: "soft", title: "...-m0.avro (manifest)", sub: "12,528 B: 30 files, statistics", size: 24 });
      gsap.set(man, { opacity: 0 }); A.in(man, 6.6);
      const ml = A.box({ x: 0.60, y: 0.43, w: 380, h: 70, kind: "soft", title: "snap-....avro (manifest list)", sub: "4,499 B", size: 24 });
      gsap.set(ml, { opacity: 0 }); A.in(ml, 7.6);
      cap("The writer adds data files, a manifest and a manifest list", 4.8, 9.5);
      // beat meta (9.6): the next metadata file
      const v2 = A.box({ x: 0.84, y: 0.30, w: 360, h: 90, kind: "soft", title: "v2.metadata.json", sub: "2,696 B, snapshot 7473...", size: 28 });
      gsap.set(v2, { opacity: 0 }); A.in(v2, 9.8);
      const still = A.text("nothing points to v2 yet", { x: 0.84, y: 0.38, size: 24, color: "var(--a-mute)" }); A.in(still, 10.6); A.out(still, 14.6);
      cap("Then it writes v2.metadata.json with the new snapshot", 9.6, 14.3);
      // beat swap (14.4): the pointer changes in one atomic step
      A.tl.to(hint1, { opacity: 0, duration: 0.2 }, 14.6); A.tl.to(hint2, { opacity: 1, duration: 0.2 }, 14.6);
      A.tl.to(ptr, { scaleX: (0.84 - 0.095 - 0.21) / (0.40 - 0.095 - 0.21), duration: 0.6, ease: "power2.inOut" }, 14.8);
      A.tl.to(v1, { opacity: 0.3, duration: 0.4 }, 14.8);
      A.out(reader, 15.2);
      const r2 = A.text("a reader sees: 3,837,231 rows", { x: 0.02, anchor: "left", y: 0.42, size: 28, mono: true, color: "var(--a-acc)", weight: 700 });
      A.in(r2, 15.5);
      cap("The commit is one change of the pointer: all files at once", 14.4);
      A.in(A.note("files, sizes and rows from tables.txt; timing schematic"), 0.4);

      A.finish(20);
    </script>
  </body>
</html>
