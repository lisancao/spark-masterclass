<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Chapter 29: the Parquet writer shreds a VARIANT column into typed columns for fields with one type.
      // Records from code/data/messy/events (days 2 and 3); column names from code/ch29/output/shred.txt;
      // times from speed.txt (median of 5).
      const D = {"recs": [{"id": "0", "plan": "\"pro\"", "amount": "\"32.83\""}, {"id": "1", "plan": "\"free\"", "amount": "49.33"}, {"id": "0", "plan": "\"pro\"", "amount": "{value, currency}"}],
                 "t_json": "5.40 s", "t_plain": "1.40 s", "t_shred": "0.31 s"};
      A.mount();
      // beat open (0.0)
      A.title("Shredding: typed columns inside a VARIANT");
      const RX = 0.17, RY = [0.30, 0.45, 0.60];
      const recs = D.recs.map((r, i) => {
        const card = A.box({ x: RX, y: RY[i], w: 470, h: 110, kind: "paper", title: "", size: 24 });
        const fid = A.text("user.id: " + r.id, { x: RX - A.dx(200), y: RY[i] - A.dy(28), size: 24, weight: 600, mono: true, anchor: "left" });
        const fpl = A.text("user.plan: " + r.plan, { x: RX - A.dx(200), y: RY[i], size: 24, weight: 600, mono: true, anchor: "left" });
        const fam = A.text("amount: " + r.amount, { x: RX - A.dx(200), y: RY[i] + A.dy(28), size: 24, weight: 600, mono: true, anchor: "left" });
        return { card, fid, fpl, fam };
      });
      A.in(recs.flatMap(r => [r.card, r.fid, r.fpl, r.fam]), 0.2, { stagger: 0.03 });
      const CX = [0.55, 0.72, 0.89], CY = 0.30;
      const heads = [["user.id.typed_value", "int64", "ok"], ["user.plan.typed_value", "string", "ok"], ["amount.value", "binary", "accent"]]
        .map((h, i) => A.box({ x: CX[i], y: CY, w: 300, h: 84, kind: h[2], title: h[0], sub: h[1], size: 22 }));
      A.in(heads, 0.6, { stagger: 0.1 });
      function cap(s, t0, t1) { const c = A.text(s, { y: 0.915, size: 38, weight: 600 }); A.in(c, t0); if (t1) A.out(c, t1); return c; }
      // beat write (1.2): each field goes to its column
      cap("The writer gives each field with one type its own typed column", 1.2, 5.6);
      recs.forEach((r, i) => {
        const vals = [r.fid, r.fpl, r.fam];
        const short = [D.recs[i].id, D.recs[i].plan, D.recs[i].amount];
        vals.forEach((el, j) => {
          const chip = A.box({ x: RX, y: RY[i] + (j - 1) * A.dy(28), w: 270, h: 48, kind: j === 2 ? "accent" : "ok", title: short[j], size: 24, radius: 8 });
          A.tl.set(chip, { opacity: 0 }, 0);
          const t = 1.5 + i * 1.1 + j * 0.15;
          A.tl.set(chip, { opacity: 1 }, t);
          const ty = CY + A.dy(90) + i * A.dy(60);
          A.tl.to(chip, { x: A.X(CX[j] - RX), y: A.Y(ty - (RY[i] + (j - 1) * A.dy(28))), duration: 0.8, ease: "power2.inOut" }, t);
        });
      });
      // beat mixed (5.8): amount has three kinds, so it stays binary
      cap("amount has three kinds of value, so it stays in a binary column", 5.8, 8.6);
      A.tl.to(heads[2], { scale: 1.08, duration: 0.25, yoyo: true, repeat: 3 }, 6.0);
      // beat read (8.8): a typed extraction reads one column
      cap("try_variant_get(v, '$.user.id', 'bigint') reads one int64 column", 8.8, 11.6);
      const hlb = A.box({ x: CX[0], y: CY + A.dy(100), w: 330, h: 340, kind: "ghost", radius: 16 });
      A.in(hlb, 9.0);
      A.tl.to([heads[1], heads[2]], { opacity: 0.35, duration: 0.4 }, 9.0);
      // beat cost (11.8): times on the trips query
      const t1 = [["JSON text (get_json_object)", D.t_json, 0.55, "var(--a-acc)"], ["VARIANT", D.t_plain, 0.72, "var(--a-fg)"], ["shredded VARIANT", D.t_shred, 0.89, "var(--a-ok)"]]
        .flatMap(([l, v, x, c]) => [A.text(l, { x, y: 0.72, size: 28, weight: 600, color: "var(--a-mute)" }), A.text(v, { x, y: 0.78, size: 44, weight: 700, color: c })]);
      A.in(t1, 11.8);
      cap("avg(fare) on a million trips, with try_variant_get", 11.8);
      A.in(A.note("three records drawn; times: median of 5 runs, one machine"), 0.5);
      A.finish(14);
    </script>
  </body>
</html>
