<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="15.5" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Chapter 8: configuration sources stack, the top one that is set wins.
      // Values from code/ch08/output/layers.txt: 200, 11, 12, 13, 14, 15, RESET -> 13, unset -> 200.
      A.mount();
      // beat open (0.0)
      A.title("spark.sql.shuffle.partitions", "one key, set in more places each time");
      const SX = 0.33, BW = 560, BH = 74, Y0 = 0.80, G = A.dy(92);
      const layer = (i, label, kind) => A.box({ x: SX, y: Y0 - i * G, w: BW, h: BH, kind, title: label, size: 30, radius: 10 });
      const base = layer(0, "built-in default", "ghost");
      const L = [["spark-defaults.conf", 1.2], ["--conf", 3.4], ["builder.config", 5.6],
                 ["spark.conf.set", 7.8], ["SET", 9.0]].map(([s, t], i) => {
        const b = layer(i + 1, s, "soft"); A.tl.set(b, { opacity: 0 }, 0); return [b, t]; });
      const vlab = A.text("effective value", { x: 0.75, y: 0.36, size: 32, weight: 600, color: "var(--a-mute)" });
      const vals = {};
      function val(v, t0, t1) {
        const e = A.text(v, { x: 0.75, y: 0.52, size: 150, weight: 700, color: "var(--a-acc)", mono: true });
        A.tl.set(e, { opacity: 0 }, 0); A.tl.set(e, { opacity: 1 }, t0); if (t1) A.tl.set(e, { opacity: 0 }, t1); return e;
      }
      function cap(s, t0, t1) { const c = A.text(s, { y: 0.90, size: 38, weight: 600 }); A.in(c, t0); if (t1) A.out(c, t1); return c; }
      A.tl.set(base, { opacity: 1 }, 0);
      val("200", 0, 1.5);
      cap("Where does a config value come from?", 0.0, 1.1);
      // beat file (1.2)
      cap("A config file overrides the built-in default", 1.2, 3.3);
      A.in(L[0][0], 1.2); val("11", 1.5, 3.7);
      // beat conf (3.4)
      cap("A --conf flag overrides the file", 3.4, 5.5);
      A.in(L[1][0], 3.4); val("12", 3.7, 5.9);
      // beat builder (5.6)
      cap("The builder overrides the flags", 5.6, 7.7);
      A.in(L[2][0], 5.6); val("13", 5.9, 8.1);
      // beat set (7.8)
      cap("At runtime, the last change wins", 7.8, 10.5);
      A.in(L[3][0], 7.8); val("14", 8.1, 9.3);
      A.in(L[4][0], 9.0); val("15", 9.3, 10.9);
      for (const [b, t] of L) A.tl.fromTo(b, { scale: 1 }, { scale: 1.05, duration: 0.25, yoyo: true, repeat: 1 }, t + 0.1);
      // beat reset (10.6)
      cap("RESET goes back to the value at session start", 10.6, 12.7);
      A.out([L[3][0], L[4][0]], 10.6);
      val("13", 10.9, 13.1);
      // beat unset (12.8)
      cap("spark.conf.unset goes back to the built-in default", 12.8);
      A.tl.to(L[2][0], { opacity: 0.35, duration: 0.3 }, 12.8);
      A.tl.to([L[0][0], L[1][0]], { opacity: 0.35, duration: 0.3 }, 12.8);
      val("200", 13.1);
      A.in(vlab, 0.0);
      A.in(A.note("values from one run of layers.py on Spark 4.3.0"), 0.4);
      A.finish(15.5);
    </script>
  </body>
</html>
