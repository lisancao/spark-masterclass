<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <!-- `anim render` rewrites data-width/data-height per format; leave them as they are. -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <div id="stage"></div>
    </div>
    <script>
      // Storyboard: storyboard.md. Messages and distances: data.json (near_duplicates.txt). Buckets: schematic.
      const D = {"source": "code/ch54/output/near_duplicates.txt: messages, pairs and distances at thresholds 0.1 and 0.3. The bucket of each message is schematic (one hash table shown of five).", "messages": [["chat_0", 0], ["chat_1", 0], ["chat_2", 1], ["ticket_0", 2], ["ticket_1", 2], ["ticket_2", 2], ["ticket_3", 2]], "pairs_01": [["chat_0", "chat_1", "0.0"]], "pairs_03_count": 7, "template_distance": "0.2222"};
      A.mount();
      // beat open (0.0)
      A.title("MinHashLSH: compare only what shares a bucket");
      const cap = (s, t0, t1) => { const c = A.text(s, { y: 0.875, size: 36 }); A.in(c, t0); if (t1) A.out(c, t1); };
      const BX = [0.18, 0.5, 0.82], BY = 0.6;
      BX.forEach((x, i) => { A.box({ x, y: BY, w: 500, h: 400, kind: "ghost", title: "", radius: 18 });
        A.text("bucket " + String.fromCharCode(65 + i), { x, y: BY - A.dy(225), size: 26, color: "var(--a-mute)" }); });
      const cnt = [0, 0, 0], el = {};
      D.messages.forEach(([id, b], i) => {
        const x0 = 0.1 + i * 0.133, y0 = 0.2;
        const e = A.box({ x: x0, y: y0, w: 200, h: 56, kind: "paper", title: id, size: 24, radius: 8 });
        const k = cnt[b]++;
        const tx = BX[b] + (k % 2 ? A.dx(120) : -A.dx(120)), ty = BY - A.dy(120) + Math.floor(k / 2) * A.dy(170);
        A.tl.to(e, { x: A.X(tx - x0), y: A.Y(ty - y0), duration: 0.7, ease: "power2.inOut" }, 1.2 + i * 0.25);
        el[id] = [tx, ty];
      });
      cap("Each set gets MinHash values, and equal values share a bucket", 1.0, 4.4);
      // beat candidates (4.6): pairs in one bucket become candidates; exact distance
      const link = (a, b, label, t, col) => {
        const [x1, y1] = el[a], [x2, y2] = el[b];
        const l = A.line({ x1, y1: y1 + A.dy(32), x2, y2: y2 + A.dy(32), color: col, width: 4 });
        gsap.set(l, { opacity: 0 }); A.tl.to(l, { opacity: 1, duration: 0.3 }, t);
        if (label) { const tt = A.text(label, { x: (x1 + x2) / 2, y: (y1 + y2) / 2 + A.dy(56), size: 24, mono: true, color: col });
          gsap.set(tt, { opacity: 0 }); A.tl.to(tt, { opacity: 1, duration: 0.3 }, t); }
      };
      link("chat_0", "chat_1", "0.0", 4.8, "var(--a-ok)");
      link("ticket_0", "ticket_1", "", 5.4, "var(--a-acc)");
      link("ticket_2", "ticket_3", "", 5.6, "var(--a-acc)");
      A.in(A.text("6 pairs, each " + D.template_distance, { x: BX[2], y: BY + A.dy(165), size: 26, mono: true, color: "var(--a-acc)" }), 6.2);
      link("ticket_0", "ticket_2", "", 5.8, "var(--a-acc)");
      link("ticket_1", "ticket_3", "", 5.9, "var(--a-acc)");
      link("ticket_0", "ticket_3", "", 6.0, "var(--a-acc)");
      link("ticket_1", "ticket_2", "", 6.1, "var(--a-acc)");
      cap("Spark computes the exact Jaccard distance only for candidates", 4.6, 8.4);
      // beat threshold (8.6)
      cap("Threshold 0.1: 1 pair.  Threshold 0.3: " + D.pairs_03_count + " pairs.", 8.6);
      A.in(A.note("one hash table of five, bucket letters schematic; distances from the run"), 0.3);
      A.finish(13);
    </script>
  </body>
</html>
