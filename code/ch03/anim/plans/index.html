<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Chapter 3: the DataFrame plan and the SQL plan become one plan. Node names from code/ch03/output/quickstart.txt.
      A.mount();
      // beat open (0.0)
      A.title("Two plans, one result");
      const G = A.dy(70), Y0 = 0.235, W = 290, H = 54;
      const yl = (i) => Y0 + i * G;
      const LX = 0.25, RX = 0.75, BR = 0.09;
      function node(label, x, i, kind = "paper") {
        return A.box({ x, y: yl(i), w: W, h: H, kind, title: label, size: 28, radius: 10 });
      }
      function edges(pairs) { return pairs.map(([x1, i1, x2, i2]) => A.line({ x1, y1: yl(i1) + A.dy(H / 2), x2, y2: yl(i2) - A.dy(H / 2), width: 2 })); }
      const hl = A.text("DataFrame", { x: LX, y: yl(-1) + A.dy(10), size: 30, weight: 700, color: "var(--a-mute)" });
      const hr = A.text("SQL", { x: RX, y: yl(-1) + A.dy(10), size: 30, weight: 700, color: "var(--a-mute)" });
      // DataFrame analyzed plan
      const dfEdges = edges([[LX,0,LX,1],[LX,1,LX,2],[LX,2,LX,3],[LX,3,LX,4],[LX,4,LX-BR,5],[LX,4,LX+BR,5],[LX-BR,5,LX-BR,6]]);
      const df = ["GlobalLimit","LocalLimit","Sort","Aggregate","Join"].map((s, i) => node(s, LX, i));
      const dfF = node("Filter", LX - BR, 5, "soft"), dfR1 = node("Relation", LX - BR, 6), dfR2 = node("Relation", LX + BR, 5);
      // SQL analyzed plan
      const sqEdges = edges([[RX,0,RX,1],[RX,1,RX,2],[RX,2,RX,3],[RX,3,RX,4],[RX,4,RX,5],[RX,5,RX-BR,6],[RX,5,RX+BR,6],
        [RX-BR,6,RX-BR,7],[RX-BR,7,RX-BR,8],[RX-BR,8,RX-BR,9],[RX+BR,6,RX+BR,7],[RX+BR,7,RX+BR,8],[RX+BR,8,RX+BR,9]]);
      const sq = ["GlobalLimit","LocalLimit","Sort","Aggregate"].map((s, i) => node(s, RX, i));
      const sqF = node("Filter", RX, 4, "soft"), sqJ = node("Join", RX, 5);
      const alias = [];
      for (const s of [-1, 1]) for (const [lab, i] of [["SubqueryAlias",6],["SubqueryAlias",7],["View",8]]) alias.push(node(lab, RX + s * BR, i, "ghost"));
      const sqRL = node("Relation", RX - BR, 9), sqRR = node("Relation", RX + BR, 9);
      A.in([hl, hr], 0.1);
      A.in([...dfEdges, ...df, dfF, dfR1, dfR2], 0.3, { stagger: 0.02 });
      A.in([...sqEdges, ...sq, sqF, sqJ, ...alias, sqRL, sqRR], 0.5, { stagger: 0.02 });
      function cap(s, t0, t1) { const c = A.text(s, { y: 0.912, size: 40, weight: 600 }); A.in(c, t0); if (t1) A.out(c, t1); return c; }
      // beat order (1.6): the filter sits in different places
      cap("The DataFrame filters before the join. SQL joins first.", 1.6, 4.2);
      for (const n of [dfF, sqF]) A.tl.fromTo(n, { scale: 1 }, { scale: 1.12, duration: 0.35, yoyo: true, repeat: 3 }, 1.8);
      // beat alias (4.4): view and alias nodes go, relations rise
      cap("The optimizer removes the view and alias nodes", 4.4, 7.0);
      A.out([...alias, ...sqEdges.slice(5)], 4.6);
      A.tl.to([sqRL, sqRR], { y: -3 * G * A.UH, duration: 0.8, ease: "power2.inOut" }, 5.0);
      // beat push (7.2): the filter goes below the join
      cap("It pushes the filter below the join", 7.2, 9.6);
      A.out(sqEdges.slice(0, 5), 7.2, { dur: 0.2 });
      A.tl.to(sqF, { x: -BR * A.W, y: 1 * G * A.UH, duration: 0.9, ease: "power2.inOut" }, 7.4);
      A.tl.to(sqJ, { y: -1 * G * A.UH, duration: 0.9, ease: "power2.inOut" }, 7.4);
      A.tl.to(sqRR, { y: -4 * G * A.UH, duration: 0.9, ease: "power2.inOut" }, 7.4);
      const fin = edges([[RX,0,RX,1],[RX,1,RX,2],[RX,2,RX,3],[RX,3,RX,4],[RX,4,RX-BR,5],[RX,4,RX+BR,5],[RX-BR,5,RX-BR,6]]);
      A.in(fin, 8.4, { stagger: 0.02 });
      // beat same (9.8)
      const ok = A.text("sameResult: True", { x: 0.5, y: yl(3), size: 40, weight: 700, color: "var(--a-ok)", mono: true });
      A.in(ok, 9.8);
      cap("The optimized plans are the same", 9.8);
      A.in(A.note("node names only, from the analyzed plans; the optimized plans have more nodes"), 0.5);
      A.finish(12);
    </script>
  </body>
</html>
