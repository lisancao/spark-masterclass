<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Chapter 17, Step 15: a delete hides a row; the bytes leave the disk only after rewrite_data_files and
      // expire_snapshots. Counts from code/ch17/output/blobs.txt ("files that hold the text": 1, 1, 1, 0).
      A.mount();
      // beat open (0.0)
      A.title("A delete does not remove the bytes");
      const SY = 0.30, FY = 0.55;
      const sl = A.text("snapshots", { x: 0.06, y: SY, size: 28, weight: 700, anchor: "left", color: "var(--a-mute)" });
      const fl = A.text("data files", { x: 0.06, y: FY, size: 28, weight: 700, anchor: "left", color: "var(--a-mute)" });
      const s1 = A.box({ x: 0.30, y: SY, w: 260, h: 70, kind: "paper", title: "snapshot 1", sub: "before the delete", size: 26 });
      const f1 = A.box({ x: 0.30, y: FY, w: 300, h: 100, kind: "accent", title: "data file A", sub: "holds the e-mail text", size: 26 });
      const l1 = A.line({ x1: 0.30, y1: SY + A.dy(35), x2: 0.30, y2: FY - A.dy(50) });
      const cnt = A.text("files that hold the text: 1", { x: 0.95, y: 0.78, size: 34, weight: 700, anchor: "right", color: "var(--a-acc)" });
      A.in([sl, fl, s1, f1, l1, cnt], 0.2, { stagger: 0.05 });
      function cap(s, t0, t1) { const c = A.text(s, { y: 0.915, size: 38, weight: 600 }); A.in(c, t0); if (t1) A.out(c, t1); return c; }
      // beat delete (1.0)
      cap("DELETE writes a delete file. The row is hidden, the bytes stay.", 1.0, 4.6);
      const s2 = A.box({ x: 0.55, y: SY, w: 260, h: 70, kind: "paper", title: "snapshot 2", sub: "after DELETE", size: 26 });
      const df = A.box({ x: 0.55, y: FY, w: 260, h: 100, kind: "soft", title: "delete file", sub: "marks the row", size: 26 });
      const l2 = A.line({ x1: 0.55, y1: SY + A.dy(35), x2: 0.55, y2: FY - A.dy(50) });
      const l2b = A.line({ x1: 0.55, y1: SY + A.dy(35), x2: 0.30 + A.dx(90), y2: FY - A.dy(50) });
      A.in([s2, l2, l2b, df], 1.3, { stagger: 0.15 });
      const rows = A.text("rows with the hash: 0", { x: 0.95, y: 0.70, size: 30, weight: 600, anchor: "right" });
      A.in(rows, 2.4);
      // beat travel (4.8)
      cap("Time travel to snapshot 1 still finds the text", 4.8, 7.0);
      A.tl.to([s1, l1, f1], { scale: 1.06, duration: 0.3, yoyo: true, repeat: 3 }, 5.0);
      // beat rewrite (7.2)
      cap("rewrite_data_files writes a new file, but snapshot 1 keeps file A", 7.2, 10.2);
      const s3 = A.box({ x: 0.80, y: SY, w: 260, h: 70, kind: "paper", title: "snapshot 3", sub: "after rewrite", size: 26 });
      const f2 = A.box({ x: 0.80, y: FY, w: 260, h: 100, kind: "ok", title: "data file B", sub: "no e-mail text", size: 26 });
      const l3 = A.line({ x1: 0.80, y1: SY + A.dy(35), x2: 0.80, y2: FY - A.dy(50) });
      A.in([s3, l3, f2], 7.5, { stagger: 0.15 });
      // beat expire (10.4)
      cap("expire_snapshots removes the old snapshots and file A", 10.4, 12.8);
      A.out([s1, l1, f1, s2, l2, l2b, df], 10.8, { dur: 0.6 });
      const c0 = A.text("files that hold the text: 0", { x: 0.95, y: 0.78, size: 34, weight: 700, anchor: "right", color: "var(--a-ok)" });
      A.tl.set(c0, { opacity: 0 }, 0); A.tl.set(cnt, { opacity: 0 }, 11.5); A.tl.set(c0, { opacity: 1 }, 11.5);
      cap("Then remove the blob from the store, with its hash", 13.0);
      A.in(A.note("Iceberg runtime from a pull request build; counts from blobs.py"), 0.5);
      A.finish(15);
    </script>
  </body>
</html>
