<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Chapter 17: MSCK REPAIR TABLE. Names and counts from code/ch17/output/partitions.txt.
      A.mount();
      A.title("Folders on disk and partitions in the metastore");
      const L = 0.27, R = 0.73, Y0 = 0.27, DY = 0.105;
      A.in([A.text("warehouse/taxi.db/zones/", { x: L, y: 0.18, size: 34, weight: 700, mono: true }),
            A.text("metastore: PARTITIONS", { x: R, y: 0.18, size: 34, weight: 700, mono: true })], 0.2);
      const NAMES = ["borough=Bronx", "borough=Bronx2", "borough=EWR", "borough=Manhattan", "borough=Queens"];
      const ys = NAMES.map((_, i) => Y0 + i * DY);
      const disk = {}, meta = {};
      NAMES.forEach((n, i) => {
        disk[n] = A.box({ x: L, y: ys[i], w: 520, h: 80, kind: "soft", title: n, size: 30 });
        meta[n] = A.box({ x: R, y: ys[i], w: 520, h: 80, kind: "paper", title: n, size: 30 });
      });
      const first = ["borough=Bronx", "borough=EWR", "borough=Queens"];
      const later = ["borough=Bronx2", "borough=Manhattan"];
      A.tl.set(later.flatMap((n) => [disk[n], meta[n]]), { opacity: 0 }, 0);
      A.in(first.flatMap((n) => [disk[n], meta[n]]), 0.4);
      function cap(s, t0, t1) { const c = A.text(s, { y: 0.86, size: 38, weight: 600 }); A.in(c, t0); if (t1) A.out(c, t1); return c; }
      function rows(s, t0, t1, color) { const c = A.text(s, { x: R, y: 0.80, size: 32, weight: 600, mono: true, color }); A.in(c, t0); if (t1) A.out(c, t1); return c; }
      cap("Spark reads only the partitions in the metastore", 0.4, 1.7);
      rows("SELECT count(*): 113", 0.8, 4.5, "var(--a-mute)");
      // drift
      cap("Another job writes two folders. The metastore does not know them.", 1.8, 4.5);
      A.in(later.map((n) => disk[n]), 2.2, { rise: -40 });
      // add
      cap("MSCK REPAIR TABLE zones: a partition for each new folder", 4.6, 7.3);
      A.in(later.map((n) => meta[n]), 5.2, { rise: 0 });
      A.tl.fromTo(later.map((n) => meta[n]), { x: -A.X(R - L) }, { x: 0, duration: 0.9, ease: "power2.out" }, 5.2);
      rows("SELECT count(*): 159", 6.0, 7.3, "var(--a-ok)");
      // gone
      cap("A folder goes away. The partition stays, and REFRESH TABLE is needed", 7.4, 9.9);
      A.tl.to(disk["borough=Bronx2"], { opacity: 0.1, duration: 0.5 }, 7.8);
      A.tl.to(meta["borough=Bronx2"], { borderColor: "#d63c3c", duration: 0.3 }, 8.4);
      rows("MSCK REPAIR TABLE: no change", 8.6, 9.9, "#d63c3c");
      // sync
      cap("MSCK REPAIR TABLE zones SYNC PARTITIONS: adds and drops", 10.0);
      A.tl.to(meta["borough=Bronx2"], { opacity: 0, x: A.px(200), duration: 0.6 }, 10.5);
      rows("4 partitions, 4 folders", 11.2, null, "var(--a-ok)");
      A.in(A.note("names and counts from partitions.py on Spark 4.3.0. Timing is schematic."), 0.4);
      A.finish(14);
    </script>
  </body>
</html>
