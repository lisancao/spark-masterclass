<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="12.5" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Chapter 82: five clients, one plan, the same Arrow rows. Rows and versions from code/ch82/output/*-taxi.txt.
      const D = {"clients": [["Python", "pyspark 4.3.0"], ["Scala", "client-jvm 4.3.0"], ["Go", "v0.1.0"],
                             ["Rust", "4.3.0"], ["Swift", "0.8.0"]],
                 "rows": [["237", "177610", "14.15"], ["161", "161198", "18.47"], ["236", "157113", "15.02"]]};
      A.mount();
      // beat open (0.0)
      A.title("Five languages, one Spark Connect server");
      const ys = [0.24, 0.36, 0.48, 0.60, 0.72];
      const boxes = D.clients.map((c, i) => A.box({ x: 0.14, y: ys[i], w: 330, h: 100, kind: "paper", title: c[0], sub: c[1], size: 30 }));
      const server = A.box({ x: 0.80, y: 0.48, w: 420, h: 560, kind: "accent", title: "Connect server", sub: "Spark 4.3.0", size: 36 });
      function cap(s, t0, t1) { const c = A.text(s, { y: 0.915, size: 38, weight: 600 }); A.in(c, t0); if (t1) A.out(c, t1); return c; }
      // beat plan (1.2): a protobuf plan leaves each client
      cap("Each client builds the same plan as protobuf", 1.2, 4.0);
      ys.forEach((y, i) => {
        const p = A.box({ x: 0.27, y, w: 150, h: 56, kind: "ink", title: "plan", size: 24, radius: 28 });
        A.tl.set(p, { opacity: 0 }, 0);
        A.tl.to(p, { opacity: 1, duration: 0.3 }, 1.5 + i * 0.25);
        A.tl.to(p, { x: A.X(0.66 - 0.27), y: A.Y(0.48 - y) * 0.6, duration: 1.3, ease: "power2.inOut" }, 1.9 + i * 0.25);
        A.tl.to(p, { opacity: 0, duration: 0.3 }, 3.3 + i * 0.25);
      });
      // beat run (4.2): the server does the work
      cap("The server analyzes and runs it", 4.2, 5.6);
      A.tl.to(server, { scale: 1.04, duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, 4.3);
      // beat arrow (5.8): Arrow batches come back
      cap("The rows come back as Arrow batches", 5.8, 8.4);
      ys.forEach((y, i) => {
        const a = A.box({ x: 0.66, y: 0.48 + (y - 0.48) * 0.6, w: 150, h: 56, kind: "ok", title: "Arrow", size: 24, radius: 28 });
        A.tl.set(a, { opacity: 0 }, 0);
        A.tl.to(a, { opacity: 1, duration: 0.3 }, 6.0 + i * 0.2);
        A.tl.to(a, { x: A.X(0.27 - 0.66), y: A.Y((y - 0.48) * 0.4), duration: 1.2, ease: "power2.inOut" }, 6.3 + i * 0.2);
        A.tl.to(a, { opacity: 0, duration: 0.3 }, 7.7 + i * 0.2);
      });
      // beat same (8.6): the same rows everywhere
      cap("The same five rows in every language", 8.6);
      A.out(server, 8.6);
      const tbl = A.table(["PULocationID", "trips", "avg_fare"], D.rows.concat([["...", "", ""]]), { x: 0.68, y: 0.48, w: 760, size: 34 });
      A.in(tbl, 8.9);
      A.tl.to(boxes, { borderColor: "var(--a-ok)", duration: 0.4, stagger: 0.08 }, 9.2);
      A.in(A.note("schematic timing, not measured"), 0.5);
      A.finish(12.5);
    </script>
  </body>
</html>
