<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Chapter 90: reduceByKey combines before the shuffle, groupByKey does not. Numbers: code/ch90/output/keyvalue.txt.
      const D = { reduce: "0.02 MiB written", group: "11.76 MiB written" };
      A.mount();
      // beat open (0.0)
      A.title("What crosses the shuffle");
      const LANES = [{ y: 0.36, name: "reduceByKey", combine: true }, { y: 0.69, name: "groupByKey", combine: false }];
      const MX = 0.24, RX = 0.66, SX = 0.46, TOFF = A.dy(62), KC = ["var(--a-acc)", "var(--a-info, #3b82f6)"];
      const all = [];
      const lanes = LANES.map((L) => {
        const lab = A.text(L.name, { x: MX, y: L.y - A.dy(128), size: 32, weight: 700, mono: true });
        const sh = A.line({ x1: SX, y1: L.y - A.dy(105), x2: SX, y2: L.y + A.dy(115), color: "var(--a-mute)", width: 3 });
        const shl = A.text("shuffle", { x: SX, y: L.y - A.dy(128), size: 26, color: "var(--a-mute)" });
        const tasks = [-1, 1].map((s) => A.box({ x: MX, y: L.y + s * TOFF, w: 380, h: 96, kind: "paper", radius: 12 }));
        const reds = [0, 1].map((k) => A.box({ x: RX, y: L.y + (k ? 1 : -1) * TOFF, w: 300, h: 96, kind: "soft", radius: 12 }));
        const zl = [0, 1].map((k) => A.text(k ? "zone B" : "zone A", { x: RX + A.dx(185), y: L.y + (k ? 1 : -1) * TOFF, size: 26, color: "var(--a-mute)", anchor: "left" }));
        all.push(lab, sh, shl, ...tasks, ...reds, ...zl);
        // six values in each task: three of key A, three of key B
        const dots = [];
        [-1, 1].forEach((s, ti) => {
          for (let i = 0; i < 6; i++) {
            const k = i % 2, x = MX - A.dx(150) + i * A.dx(60), y = L.y + s * TOFF;
            const d = A.dot({ x, y, r: 17, color: KC[k] });
            dots.push({ d, k, ti, x, y });
          }
        });
        return { L, dots, reds };
      });
      A.in(all, 0.2, { stagger: 0.02 });
      lanes.forEach((ln) => A.in(ln.dots.map((o) => o.d), 0.6, { stagger: 0.02 }));
      function cap(s, t0, t1) { const c = A.text(s, { y: 0.915, size: 38, weight: 600 }); A.in(c, t0); if (t1) A.out(c, t1); return c; }
      cap("Two ways to total the fares of each zone", 0.3, 1.5);
      const mv = (o, x, y, t, dur = 0.8) => A.tl.to(o.d, { x: A.X(x) - A.X(o.x), y: A.Y(y) - A.Y(o.y), duration: dur, ease: "power2.inOut" }, t);
      // beat combine (1.6): in the top lane, each key's values merge inside each task
      cap("reduceByKey adds each key's values inside the map task", 1.6, 4.5);
      const upper = lanes[0], lower = lanes[1];
      const partial = [];
      upper.dots.forEach((o) => {
        const tx = MX + (o.k ? A.dx(70) : -A.dx(70));
        mv(o, tx, o.y, 2.0, 0.9);
      });
      [0, 1].forEach((ti) => [0, 1].forEach((k) => {
        const grp = upper.dots.filter((o) => o.ti === ti && o.k === k);
        A.tl.to(grp.slice(1).map((o) => o.d), { opacity: 0, duration: 0.2 }, 3.0);
        A.tl.to(grp[0].d, { scale: 1.5, duration: 0.3 }, 3.0);
        partial.push(grp[0]);
      }));
      // beat shuffle (4.6): partial sums cross on top, every value crosses below
      cap("groupByKey sends every value across the shuffle", 4.6, 7.7);
      partial.forEach((o, i) => {
        const r = upper.reds[o.k];
        const ry = LANES[0].y + (o.k ? 1 : -1) * TOFF;
        A.tl.to(o.d, { x: A.X(RX - A.dx(60) + o.ti * A.dx(120)) - A.X(o.x), y: A.Y(ry) - A.Y(o.y), duration: 1.0, ease: "power2.inOut" }, 4.8 + i * 0.1);
      });
      lower.dots.forEach((o, i) => {
        const ry = LANES[1].y + (o.k ? 1 : -1) * TOFF;
        const slot = Math.floor(i / 2) % 3 + 3 * o.ti;
        mv(o, RX - A.dx(110) + slot * A.dx(44), ry + A.dy(o.ti ? 20 : -20), 5.0 + i * 0.12, 1.0);
        A.tl.to(o.d, { scale: 0.6, duration: 0.3 }, 5.0 + i * 0.12);
      });
      // beat sum (7.8): measured shuffle write
      const m1 = A.text(D.reduce, { x: 0.88, y: LANES[0].y, size: 46, weight: 700, color: "var(--a-ok, var(--a-fg))" });
      const m2 = A.text(D.group, { x: 0.88, y: LANES[1].y, size: 46, weight: 700, color: "var(--a-acc)" });
      A.in([m1, m2], 7.9);
      cap("Same totals, measured on 3.8 million taxi fares", 8.0);
      A.in(A.note("Two tasks, two keys and six values are schematic. The shuffle sizes are measured."), 0.5);
      A.finish(12);
    </script>
  </body>
</html>
