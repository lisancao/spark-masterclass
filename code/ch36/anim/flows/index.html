<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <!-- `anim render` rewrites data-width/data-height per format; leave them as they are. -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <div id="stage"></div>
    </div>
    <script>
      // Storyboard: storyboard.md. Times: data.json (run 2 of end_to_end.txt).
      const D = {"source": "code/ch36/output/end_to_end.txt, run 2: the time of each COMPLETED event, seconds after 11:01:03 (1 s resolution)", "nodes": [["bronze_customers", 0, 0, 0], ["bronze_products", 0, 3, 1], ["bronze_orders", 0, 1, 1], ["silver_customers", 1, 0, 1], ["shipped_orders_to_feed", 1, 2, 2], ["silver_orders", 2, 0, 4], ["quarantine_orders", 2, 1, 4], ["check_orders_accounted_for", 3, 0, 6], ["gold_customer_value", 3, 1, 6], ["gold_revenue_hardware", 3, 2, 6], ["gold_revenue_merch", 3, 3, 6], ["gold_daily_revenue", 3, 4, 7], ["check_gold_reconciles", 4, 0, 9]], "edges": [["bronze_customers", "silver_customers"], ["bronze_orders", "shipped_orders_to_feed"], ["bronze_orders", "silver_orders"], ["silver_customers", "silver_orders"], ["bronze_orders", "quarantine_orders"], ["silver_orders", "gold_customer_value"], ["silver_orders", "gold_revenue_hardware"], ["silver_orders", "gold_revenue_merch"], ["silver_orders", "gold_daily_revenue"], ["silver_orders", "check_orders_accounted_for"], ["quarantine_orders", "check_orders_accounted_for"], ["bronze_products", "gold_revenue_hardware"], ["bronze_products", "gold_revenue_merch"], ["gold_daily_revenue", "check_gold_reconciles"], ["gold_customer_value", "check_gold_reconciles"]], "run_completed": 10};
      A.mount();
      // beat open (0.0)
      A.title("Run 2: each flow waits for its inputs");
      const cap = (s, t0, t1) => { const c = A.text(s, { y: 0.94, size: 36 }); A.in(c, t0); if (t1) A.out(c, t1); };
      const CX = [0.1, 0.29, 0.48, 0.69, 0.895], Y0 = 0.27, DYn = A.dy(122);
      const pos = {};
      D.nodes.forEach(([n, c, r]) => { pos[n] = [CX[c], Y0 + r * DYn]; });
      D.edges.forEach(([a, b]) => { const [x1, y1] = pos[a], [x2, y2] = pos[b];
        A.line({ x1: x1 + A.dx(165), y1, x2: x2 - A.dx(165), y2, color: "var(--a-mute)", width: 2 }); });
      const T0 = 2.6, K = 0.8;
      D.nodes.forEach(([n, c, r, t]) => {
        const [x, y] = pos[n];
        const g = A.box({ x, y, w: 330, h: 60, kind: "ghost", title: n, size: 19, radius: 10 });
        const ok = A.box({ x, y, w: 330, h: 60, kind: "ok", title: n, size: 19, radius: 10 });
        gsap.set(ok, { opacity: 0 });
        A.tl.to(ok, { opacity: 1, duration: 0.3 }, T0 + t * K);
        A.tl.fromTo(ok, { scale: 1.08 }, { scale: 1, duration: 0.35 }, T0 + t * K);
      });
      // beat materialize (0.8): all tables prepared before any flow
      cap("First DatasetManager prepares every table", 0.6, 2.5);
      // beat execute (2.6): flows complete in topological order
      cap("Then a flow starts when its inputs are done", 2.6, T0 + D.run_completed * K - 0.2);
      // beat done (10.6)
      cap("Run is COMPLETED", T0 + D.run_completed * K);
      A.in(A.text("times: COMPLETED events of run 2, 1 s resolution, played at 0.8x", { y: 0.86, size: 24, color: "var(--a-mute)" }), 0.3);
      A.finish(13);
    </script>
  </body>
</html>
