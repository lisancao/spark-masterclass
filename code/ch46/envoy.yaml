# Chapter 46, Step 5: Envoy terminates TLS on :10282 and forwards gRPC (HTTP/2 cleartext) to the
# Connect server on 127.0.0.1:10280. It also writes one access log line for each RPC.
static_resources:
  listeners:
  - name: connect_tls
    address: {socket_address: {address: 127.0.0.1, port_value: 10282}}
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            alpn_protocols: ["h2"]
            tls_certificates:
            - certificate_chain: {filename: /certs/server.crt}
              private_key: {filename: /certs/server.key}
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: connect
          codec_type: HTTP2
          stream_idle_timeout: 0s
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format_source:
                  inline_string: "%REQ(:PATH)% grpc-status=%GRPC_STATUS% auth=%REQ(AUTHORIZATION):12%... ua=%REQ(USER-AGENT):24%\n"
          route_config:
            virtual_hosts:
            - name: connect
              domains: ["*"]
              routes:
              - match: {prefix: "/"}
                route: {cluster: spark_connect, timeout: 0s}
          http_filters:
          - name: envoy.filters.http.router
            typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
  clusters:
  - name: spark_connect
    type: STATIC
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http2_protocol_options: {}}
    load_assignment:
      cluster_name: spark_connect
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: 127.0.0.1, port_value: 10280}}}
