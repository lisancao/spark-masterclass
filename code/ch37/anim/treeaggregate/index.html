<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <!-- `anim render` rewrites data-width/data-height per format; leave them as they are. -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <div id="stage"></div>
    </div>
    <script>
      // Storyboard: storyboard.md. Job counts: data.json (estimators.txt). Partitions and timing: schematic.
      const D = {"source": "code/ch37/output/estimators.txt (what fit() runs). The four partitions and the timing are schematic.", "lbfgs_jobs": 11, "lbfgs_iterations": 6, "normal_jobs": 2, "partitions_schematic": 4};
      A.mount();
      // beat open (0.0)
      A.title("fit() is a loop of treeAggregate jobs");
      const cap = (s, t0, t1) => { const c = A.text(s, { y: 0.875, size: 36 }); A.in(c, t0); if (t1) A.out(c, t1); };
      const drv = A.box({ x: 0.5, y: 0.25, w: 520, h: 90, kind: "ink", title: "driver: coefficients", size: 30 });
      const PX = [0.2, 0.4, 0.6, 0.8], PY = 0.72;
      const tasks = PX.map((x, i) => A.box({ x, y: PY, w: 280, h: 90, kind: "paper", title: "partition " + (i + 1), size: 26 }));
      const M = [A.box({ x: 0.3, y: 0.5, w: 170, h: 60, kind: "soft", title: "merge", size: 24 }),
                 A.box({ x: 0.7, y: 0.5, w: 170, h: 60, kind: "soft", title: "merge", size: 24 })];
      gsap.set(M, { opacity: 0.25 });
      const counter = A.text("job 1", { x: 0.88, y: 0.25, size: 40, weight: 700, color: "var(--a-acc)" });
      const pass = (t, fast) => {
        const k = fast ? 0.35 : 1;
        PX.forEach((x) => { const dd = A.dot({ x: 0.5, y: 0.3, r: 14, color: "var(--a-acc)" });
          gsap.set(dd, { opacity: 0 });
          A.tl.set(dd, { opacity: 1 }, t);
          A.tl.to(dd, { x: A.X(x - 0.5), y: A.Y(PY - 0.3 - 0.06), duration: 0.8 * k, ease: "power1.inOut" }, t);
          A.tl.set(dd, { opacity: 0 }, t + 0.8 * k); });
        A.tl.fromTo(tasks, { scale: 1 }, { scale: 1.06, duration: 0.3 * k, yoyo: true, repeat: 1 }, t + 0.9 * k);
        PX.forEach((x, i) => { const dd = A.dot({ x, y: PY - 0.06, r: 12, color: "var(--a-ok)" });
          gsap.set(dd, { opacity: 0 });
          const mx = i < 2 ? 0.3 : 0.7;
          A.tl.set(dd, { opacity: 1 }, t + 1.6 * k);
          A.tl.to(dd, { x: A.X(mx - x), y: A.Y(0.5 - PY + 0.06), duration: 0.6 * k }, t + 1.6 * k);
          A.tl.to(dd, { x: A.X(0.5 - x), y: A.Y(0.3 - PY + 0.06), duration: 0.6 * k }, t + 2.3 * k);
          A.tl.set(dd, { opacity: 0 }, t + 2.9 * k); });
        A.tl.to(M, { opacity: 1, duration: 0.2 * k }, t + 2.1 * k);
        A.tl.to(M, { opacity: 0.25, duration: 0.2 * k }, t + 2.6 * k);
        A.tl.fromTo(drv, { scale: 1 }, { scale: 1.08, duration: 0.2 * k, yoyo: true, repeat: 1 }, t + 2.9 * k);
      };
      // beat out (0.8): coefficients go to each task
      pass(0.8, false);
      cap("The driver sends the coefficients to each task", 0.8, 2.4);
      // beat sums (2.4): partial sums merge in a tree
      cap("Each task returns a loss and a gradient, merged in a tree", 2.4, 4.0);
      cap("The driver takes one optimizer step, and the next job starts", 4.0, 6.2);
      // beat loop (4.3): the next passes
      for (let j = 2; j <= D.lbfgs_jobs; j++) {
        const t = 4.3 + (j - 2) * 0.62;
        const c = A.text("job " + j, { x: 0.88, y: 0.25, size: 40, weight: 700, color: "var(--a-acc)" });
        gsap.set(c, { opacity: 0 });
        A.tl.set(c, { opacity: 1 }, t);
        A.tl.set(c, { opacity: 0 }, t + 0.62);
        if (j === D.lbfgs_jobs) A.tl.set(c, { opacity: 1 }, t + 0.62);
        if (j > 2) pass(t, true);
      }
      A.tl.set(counter, { opacity: 0 }, 4.3);
      // beat result (10.2)
      cap("l-bfgs: " + D.lbfgs_jobs + " jobs for " + D.lbfgs_iterations + " iterations. normal: " + D.normal_jobs + " jobs.", 10.2);
      A.in(A.note("four partitions and timing: schematic"), 0.3);
      A.finish(13);
    </script>
  </body>
</html>
