<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <!-- `anim render` rewrites data-width/data-height per format; leave them as they are. -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <div id="stage"></div>
    </div>
    <script>
      // Request logs from api_source.txt. Clip times are chosen to read.
      const D = {"source": "code/ch51/output/api_source.txt", "first": "p0 p0 p1 p2 p3(503) p3 p4", "first_n": 7, "second": "p0 p1 p2 p3(503) p3 p4", "second_n": 6, "cached_n": 0, "total": 95, "pages": 5}; // data.json
      A.mount();
      A.title("Requests from a paginated API source", "95 tickets, pages of 20, page 3 fails on odd requests");
      const api = A.box({ x: 0.86, y: 0.42, w: 300, h: 380, kind: "paper", title: "tickets API", sub: "127.0.0.1", size: 32 });
      const plan = A.box({ x: 0.14, y: 0.27, w: 300, h: 110, kind: "ghost", title: "partitions()", sub: "planning worker", size: 30 });
      const tasks = [0, 1, 2, 3, 4].map((i) => A.box({ x: 0.45, y: 0.25 + i * 0.09, w: 280, h: 74, kind: "ghost", title: "task " + i, sub: "page " + i, size: 26 }));
      A.in([api, plan], 0.2);
      // a request dot from x1 to the API and back
      const req = (x, y, t, bad) => {
        const d = A.dot({ x, y, r: 14, color: "var(--a-fg)" });
        A.tl.set(d, { opacity: 1 }, t);
        A.tl.to(d, { x: A.X(0.86 - 0.15 - x), duration: 0.5, ease: "power1.in" }, t);
        A.tl.to(d, { backgroundColor: bad ? "#E25A1C" : "#7BC496", duration: 0.05 }, t + 0.5);
        A.tl.to(d, { x: 0, duration: 0.5, ease: "power1.out" }, t + 0.55);
        A.tl.set(d, { opacity: 0 }, t + 1.05);
      };
      const log = [], logEls = [];
      const logX = 0.08, logY = 0.74;
      const logHead = A.text("request log:", { x: logX, y: logY, size: 26, anchor: "left", color: "var(--a-mute)" });
      A.in(logHead, 0.3);
      const addLog = (s, t, bad) => { const e = A.text(s, { x: logX + 0.12 + logEls.length * 0.06, y: logY, size: 26, mono: true, anchor: "left", color: bad ? "var(--a-acc)" : "var(--a-fg)" }); A.in(e, t, { rise: 0, dur: 0.2 }); logEls.push(e); };
      // beat plan (1.0): page 0 for the total
      req(0.14 + 0.08, 0.27, 1.0, false); addLog("p0", 1.5);
      const tot = A.text("total 95: plan 5 partitions", { x: 0.14, y: 0.27 + A.dy(80), size: 22, color: "var(--a-ok)" });
      A.in(tot, 2.0); A.in(tasks, 2.3, { stagger: 0.08 });
      // beat tasks (3.2): five requests at the same time
      [0, 1, 2, 3, 4].forEach((i) => req(0.45 + 0.07, 0.25 + i * 0.09, 3.2 + i * 0.05, i === 3));
      ["p0", "p1", "p2"].forEach((p, i) => addLog(p, 3.7 + i * 0.05));
      addLog("p3(503)", 3.85, true);
      const retry = A.text("503: retry after a pause", { x: 0.45 + A.dx(155), y: 0.25 + 3 * 0.09, size: 22, anchor: "left", color: "var(--a-acc)" });
      A.in(retry, 4.4, { rise: 0 });
      // the log shifts for the wider entry
      req(0.45 + 0.07, 0.25 + 3 * 0.09, 5.0, false);
      logEls.length = logEls.length; // keep order
      const p3 = A.text("p3", { x: logX + 0.12 + 5 * 0.06 + 0.06, y: logY, size: 26, mono: true, anchor: "left" }); A.in(p3, 5.5, { rise: 0, dur: 0.2 });
      const p4 = A.text("p4", { x: logX + 0.12 + 6 * 0.06 + 0.06, y: logY, size: 26, mono: true, anchor: "left" }); A.in(p4, 5.6, { rise: 0, dur: 0.2 });
      const c1 = A.text("first count(): " + D.first_n + " requests", { x: 0.86, y: 0.42 + A.dy(240), size: 26, weight: 700 });
      A.in(c1, 6.2);
      const c2 = A.text("second action: " + D.second_n + " requests", { x: 0.86, y: 0.42 + A.dy(240), size: 26, weight: 700 });
      const c3 = A.text("after cache(): " + D.cached_n + " requests", { x: 0.86, y: 0.42 + A.dy(240), size: 26, weight: 700, color: "var(--a-ok)" });
      A.out([...logEls, p3, p4, retry], 8.4);
      const l2 = A.text(D.second, { x: logX + 0.12, y: logY, size: 26, mono: true, anchor: "left" }); A.in(l2, 9.2, { rise: 0 }); A.out(l2, 10.9);
      const l3 = A.text("(none)", { x: logX + 0.12, y: logY, size: 26, mono: true, anchor: "left", color: "var(--a-ok)" }); A.in(l3, 11.4, { rise: 0 });
      [0, 1, 2, 3, 4].forEach((i) => req(0.45 + 0.07, 0.25 + i * 0.09, 8.8 + i * 0.05, i === 3)); req(0.45 + 0.07, 0.25 + 3 * 0.09, 9.9, false);
      A.out(c1, 8.6); A.in(c2, 8.9); A.out(c2, 10.9); A.in(c3, 11.2);
      A.tl.to(plan, { opacity: 0.3, duration: 0.4 }, 8.6);
      const caps = [
        [0.4, "Planning asks for page 0 to get the total."],
        [3.0, "Five tasks request their pages at the same time."],
        [4.4, "Page 3 fails with 503. The reader tries again after a pause."],
        [6.2, "The first count() sent seven requests: one to plan, six to read."],
        [8.6, "A second action plans nothing new, but it reads all pages again."],
        [11.0, "Only cached rows answer a query without a request."],
      ];
      caps.forEach(([t, s], i) => { const c = A.text(s, { y: 0.88, size: 36, weight: 600 }); A.in(c, t); if (i < caps.length - 1) A.out(c, caps[i + 1][0] - 0.3); });
      A.in(A.note("request logs from one run; clip times are not to scale"), 0.5);
      A.finish(14);
    </script>
  </body>
</html>
