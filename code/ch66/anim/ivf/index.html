<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <!-- `anim render` rewrites data-width/data-height per format; leave them as they are. -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <div id="stage"></div>
    </div>
    <script>
      // Storyboard: storyboard.md. Numbers: data.json (indexes.txt). List positions: schematic.
      const D = {"source": "code/ch66/output/indexes.txt (IVF table). The 2-D positions of the 64 lists and of the query are schematic.", "nlist": 64, "probes": [[1, "2.0%", "0.424"], [2, "3.9%", "0.591"], [4, "7.7%", "0.765"], [8, "14.7%", "0.913"], [16, "25.1%", "0.988"]]};
      A.mount();
      // beat open (0.0)
      A.title("IVF: search only the nearest lists");
      const cap = (s, t0, t1) => { const c = A.text(s, { y: 0.875, size: 36 }); A.in(c, t0); if (t1) A.out(c, t1); };
      let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const cells = [];
      for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
        const x = 0.08 + i * 0.056 + (rnd() - 0.5) * 0.03, y = 0.22 + j * 0.075 + (rnd() - 0.5) * 0.04;
        const r = 14 + rnd() * 16;
        const g = A.dot({ x, y, r, color: "var(--a-mute)", hidden: false }); gsap.set(g, { opacity: 0.3 });
        const h = A.dot({ x, y, r, color: "var(--a-acc)" }); gsap.set(h, { opacity: 0 });
        cells.push({ x, y, h });
      }
      const qx = 0.3, qy = 0.5;
      const q = A.dot({ x: qx, y: qy, r: 18, color: "var(--a-fg)", hidden: false });
      A.text("query", { x: qx, y: qy - A.dy(36), size: 26, weight: 700 });
      cells.forEach((c) => { c.d = Math.hypot((c.x - qx) * 16 / 9, c.y - qy); });
      const order = cells.slice().sort((a, b) => a.d - b.d);
      cap("k-means makes 64 lists. A query compares itself with the centroids", 0.6, 3.0);
      const tab = A.table(["nprobe", "vectors scored", "recall@10"], [], { x: 0.78, y: 0.3, w: 640, size: 30 });
      D.probes.forEach(([n, work, rec], i) => {
        const t = 3.2 + i * 1.6;
        A.tl.to(order.slice(0, n).map((c) => c.h), { opacity: 1, duration: 0.4 }, t);
        const row = A.text(`${n}`, { x: 0.63, y: 0.38 + i * A.dy(62), size: 32, mono: true, anchor: "left" });
        const w = A.text(work, { x: 0.76, y: 0.38 + i * A.dy(62), size: 32, mono: true });
        const r = A.text(rec, { x: 0.89, y: 0.38 + i * A.dy(62), size: 32, mono: true, color: "var(--a-acc)", weight: 700 });
        [row, w, r].forEach((e) => gsap.set(e, { opacity: 0 }));
        A.tl.to([row, w, r], { opacity: 1, duration: 0.3 }, t);
      });
      cap("More lists probed: higher recall, more vectors scored", 3.2);
      A.in(A.note("positions of the 64 lists: schematic; numbers from the run on 20,000 vectors"), 0.3);
      A.finish(13);
    </script>
  </body>
</html>
