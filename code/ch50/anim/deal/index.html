<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <!-- `anim render` rewrites data-width/data-height per format; leave them as they are. -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <div id="stage"></div>
    </div>
    <script>
      // File sizes from the sample folder; totals agree with docs_source.txt.
      const D = {"source": "code/ch50/output/docs_source.txt; per-file sizes of the 26 sample files that docs_source.py copies", "rr": [8044, 4044, 4044, 29, 290, 305, 315, 276, 1589, 3302, 4016, 1795, 81, 76, 24, 90, 13, 21213, 10072, 250, 250, 257, 250, 878, 603, 1669], "lf": [21213, 10072, 8044, 4044, 4044, 4016, 3302, 1795, 1669, 1589, 878, 603, 315, 305, 290, 276, 257, 250, 250, 250, 90, 81, 76, 29, 24, 13], "rr_tot": [22793, 10884, 30098], "lf_tot": [21266, 21261, 21248]}; // data.json
      A.mount();
      A.title("partitions() deals files to tasks", "26 files, 63,775 bytes, 3 partitions");
      const SC = 0.0175, Y0 = 0.74, XS = [0.40, 0.58, 0.76], W = 150;   // px per byte at 1080
      const labs = [];
      XS.forEach((x, t) => { labs.push(A.text("task " + t, { x, y: Y0 + A.dy(30), size: 26, color: "var(--a-mute)" })); });
      labs.push(A.line({ x1: 0.32, y1: Y0, x2: 0.84, y2: Y0, width: 3 }));
      A.in(labs, 0.2);
      function phase(sizes, assign, t0, dt, title, tots, hi) {
        const head = A.text(title, { x: 0.13, y: 0.30, size: 40, weight: 700, color: hi ? "var(--a-acc)" : "var(--a-fg)" });
        A.in(head, t0 - 0.4);
        const h = [0, 0, 0], els = [head];
        sizes.forEach((sz, i) => {
          const t = assign[i];
          const hp = Math.max(sz * SC, 2);
          const b = A.el("", { x: 0.13, y: 0.5, css: { width: A.px(W) + "px", height: A.px(hp) + "px", background: sz > 8000 ? "var(--a-acc)" : "var(--a-ok)",
            outline: A.px(1) + "px solid var(--a-bg)", opacity: 0 } });
          // final position: stack bottom-up at task t
          const fx = A.X(XS[t] - 0.13), fy = A.Y(Y0) - A.px(h[t]) - A.px(hp) / 2 - A.Y(0.5);
          h[t] += hp;
          A.tl.set(b, { opacity: 1 }, t0 + i * dt);
          A.tl.fromTo(b, { x: 0, y: 0 }, { x: fx, y: fy, duration: 0.45, ease: "power2.out" }, t0 + i * dt);
          els.push(b);
        });
        tots.forEach((v, t) => { const e = A.text(v.toLocaleString("en-US") + " B", { x: XS[t], y: Y0 - A.dy(h[t]) - A.dy(26), size: 28, weight: 700, color: hi ? "var(--a-acc)" : "var(--a-fg)" });
          A.in(e, t0 + sizes.length * dt + 0.4); els.push(e); });
        return els;
      }
      const rrAssign = D.rr.map((_, i) => i % 3);
      const tot = [0, 0, 0], lfAssign = D.lf.map((sz) => { const t = tot.indexOf(Math.min(...tot)); tot[t] += sz; return t; });
      const p1 = phase(D.rr, rrAssign, 1.2, 0.11, "round robin", D.rr_tot, false);
      A.out(p1, 6.6);
      phase(D.lf, lfAssign, 7.6, 0.11, "largest first", D.lf_tot, true);
      const caps = [
        [0.4, "Round robin gives each task the same number of files."],
        [4.5, "The bytes differ a lot. The stage waits for the slowest task."],
        [7.4, "Largest first puts each file on the smallest stack."],
        [11.2, "Now each task reads about 21,250 bytes."],
      ];
      caps.forEach(([t, s], i) => { const c = A.text(s, { y: 0.88, size: 36, weight: 600 }); A.in(c, t); if (i < caps.length - 1) A.out(c, caps[i + 1][0] - 0.3); });
      A.in(A.note("block heights: bytes of each file; orange: the three files over 8 KB"), 0.5);
      A.finish(14);
    </script>
  </body>
</html>
