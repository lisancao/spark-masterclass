<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Strings and counts from code/ch71/output/auth.txt. Clip times are not to scale.
      const D = {"plain": ["org.apache.spark.deploy.DeployMessages$RegisterApplication", "org.apache.spark.deploy.ApplicationDescription",
                           "-Dspark.driver.port=41149", "-Dspark.authenticate=true", "-Dspark.network.crypto.enabled=false"],
                 "noise": ["+(\"z&8-jN", "x[1WHEJx", "sparkSaslUser"],
                 "plainBytes": 7707, "aesBytes": 13713, "plainSpark": 21, "aesSpark": 0};
      A.mount();
      A.title("What a listener on the wire reads", "driver to standalone master, through a recording proxy");
      const drv = A.box({ x: 0.13, y: 0.32, w: 300, h: 120, kind: "soft", title: "driver", sub: "spark-submit", size: 30 });
      const prx = A.box({ x: 0.5, y: 0.32, w: 300, h: 120, kind: "ghost", title: "proxy.py", sub: "port 7161", size: 30 });
      const mst = A.box({ x: 0.87, y: 0.32, w: 300, h: 120, kind: "paper", title: "master", sub: "port 7151", size: 30 });
      const a1 = A.line({ x1: 0.13 + A.dx(150), y1: 0.32, x2: 0.5 - A.dx(150), y2: 0.32, width: 4 });
      const a2 = A.line({ x1: 0.5 + A.dx(150), y1: 0.32, x2: 0.87 - A.dx(150), y2: 0.32, width: 4 });
      A.in([drv, prx, mst, a1, a2], 0.2, { stagger: 0.06 });
      const mode1 = A.text("spark.authenticate=true, spark.network.crypto.enabled=false", { y: 0.47, size: 30, mono: true, color: "var(--a-warn)" });
      const mode2 = A.text("spark.authenticate=true, spark.network.crypto.enabled=true (AES/GCM)", { y: 0.47, size: 30, mono: true, color: "var(--a-ok)" });
      A.in(mode1, 0.5); A.out(mode1, 6.1);
      const msg = (t, col) => {
        const d = A.box({ x: 0.13, y: 0.32, w: 120, h: 50, kind: col, title: "msg", size: 22 });
        A.tl.set(d, { opacity: 0 }, 0);
        A.tl.set(d, { opacity: 1 }, t);
        A.tl.to(d, { x: A.X(0.74), duration: 1.6, ease: "power1.inOut" }, t);
        A.tl.set(d, { opacity: 0 }, t + 1.6);
      };
      msg(1.0, "accent"); msg(6.8, "ok");
      const lines1 = D.plain.map((s, i) => A.text(s, { x: 0.18, y: 0.56 + i * A.dy(48), size: 26, mono: true, anchor: "left", color: "var(--a-warn)" }));
      lines1.forEach((e, i) => A.in(e, 1.9 + i * 0.35, { rise: 0 }));
      A.out(lines1, 6.1);
      A.in(mode2, 6.4);
      const lines2 = D.noise.map((s, i) => A.text(s, { x: 0.18, y: 0.56 + i * A.dy(48), size: 26, mono: true, anchor: "left", color: "var(--a-mute)" }));
      lines2.forEach((e, i) => A.in(e, 7.7 + i * 0.3, { rise: 0 }));
      const tb = A.table(["run", "bytes", "\"spark.\" strings"], [["no crypto", D.plainBytes, D.plainSpark], ["AES/GCM", D.aesBytes, D.aesSpark]], { x: 0.72, y: 0.66, w: 620, size: 30 });
      A.in(tb, 9.0);
      const caps = [
        [0.5, "With spark.authenticate only, the proxy reads the message in clear text."],
        [3.2, "It sees class names, the app name and the -D options."],
        [6.4, "With spark.network.crypto.enabled, the same message is noise."],
        [9.0, "21 \"spark.\" strings in clear text, 0 with AES/GCM."],
      ];
      caps.forEach(([t, s], i) => { const c = A.text(s, { y: 0.955, size: 32, weight: 600 }); A.in(c, t); if (i < caps.length - 1) A.out(c, caps[i + 1][0] - 0.3); });
      A.finish(12);
    </script>
  </body>
</html>
