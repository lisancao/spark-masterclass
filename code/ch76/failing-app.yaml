# Chapter 76, Step 3: an application that fails, with a restart policy.
apiVersion: spark.apache.org/v1
kind: SparkApplication
metadata:
  name: flaky
spec:
  pyFiles: "local:///opt/book/flaky.py"
  runtimeVersions:
    sparkVersion: "4.3.0"
  sparkConf:
    spark.kubernetes.container.image: "spark-masterclass/spark:4.3.0-book"
    spark.kubernetes.container.image.pullPolicy: "Never"
    spark.kubernetes.authenticate.driver.serviceAccountName: "spark"
    spark.executor.instances: "1"
    spark.driver.memory: "1g"
  applicationTolerations:
    restartConfig:
      restartPolicy: OnFailure
      maxRestartAttempts: 2
      restartBackoffMillis: 5000
    resourceRetainPolicy: Always
