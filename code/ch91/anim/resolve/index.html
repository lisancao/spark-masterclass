<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <!-- `anim render` rewrites data-width/data-height per format; leave them as they are. -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
      <div id="stage"></div>
    </div>
    <script>
      // Results from repro.txt (4.3.0) and test_fix.txt (patched classes).
      const D = {"source": "code/ch91/output/repro.txt and test_fix.txt", "default": "(east, 10), (west, 20)", "other": "(east, 999)", "bug": "(east, 999)", "fixed": "(east, 10), (west, 20)"}; // data.json
      A.mount();
      A.title("Where does sales resolve?", "SELECT ... FROM mv, a metric view with source: sales");
      const LX = 0.27, RX = 0.73;
      const nsd = A.box({ x: LX, y: 0.42, w: 760, h: 340, kind: "ghost", radius: 16 });
      const nsdl = A.text("namespace default", { x: LX, y: 0.42 - A.dy(145), size: 26, color: "var(--a-mute)" });
      const nso = A.box({ x: RX, y: 0.42, w: 760, h: 340, kind: "ghost", radius: 16 });
      const nsol = A.text("namespace other", { x: RX, y: 0.42 - A.dy(145), size: 26, color: "var(--a-mute)" });
      const sd = A.box({ x: LX - 0.09, y: 0.46, w: 300, h: 100, kind: "paper", title: "sales", sub: D.default, size: 30 });
      const mv = A.box({ x: LX + 0.10, y: 0.46, w: 280, h: 100, kind: "soft", title: "mv", sub: "source: sales", size: 30 });
      const so = A.box({ x: RX, y: 0.46, w: 300, h: 100, kind: "paper", title: "sales", sub: D.other, size: 30 });
      A.in([nsd, nsdl, nso, nsol, sd, mv, so], 0.2, { stagger: 0.05 });
      // the session pointer
      const cur = A.box({ x: LX, y: 0.68, w: 360, h: 56, kind: "accent", title: "current namespace", size: 22, radius: 28 });
      A.in(cur, 1.0);
      const use = A.text("USE other", { x: 0.5, y: 0.68, size: 28, mono: true, weight: 700 });
      A.in(use, 2.2); A.tl.to(cur, { x: A.X(RX - LX), duration: 0.8, ease: "power2.inOut" }, 2.6); A.out(use, 3.4);
      // 4.3.0: the name follows the session
      const n1 = A.box({ x: LX + 0.10, y: 0.46, w: 150, h: 50, kind: "accent", title: "sales", size: 22, radius: 25 });
      gsap.set(n1, { opacity: 0 });
      A.tl.set(n1, { opacity: 1 }, 4.0);
      A.tl.to(n1, { x: A.X(RX - LX - 0.10), y: A.Y(-0.10), duration: 1.0, ease: "power2.inOut" }, 4.0);
      const r1 = A.text("4.3.0: " + D.bug + ", no error", { x: RX, y: 0.78, size: 28, weight: 700, color: "var(--a-acc)" });
      A.in(r1, 5.1);
      A.out(n1, 6.6);
      // the fix: the name uses the creation namespace
      const n2 = A.box({ x: LX + 0.10, y: 0.46, w: 150, h: 50, kind: "ok", title: "sales", size: 22, radius: 25 });
      gsap.set(n2, { opacity: 0 });
      A.tl.set(n2, { opacity: 1 }, 7.2);
      A.tl.to(n2, { x: A.X(-0.19), y: A.Y(-0.10), duration: 1.0, ease: "power2.inOut" }, 7.2);
      const r2 = A.text("with the fix: " + D.fixed, { x: LX, y: 0.78, size: 28, weight: 700, color: "var(--a-ok)" });
      A.in(r2, 8.3);
      const caps = [
        [0.4, "A metric view in default names its source sales, with no namespace."],
        [2.2, "The reader switches the session to the namespace other."],
        [4.0, "On 4.3.0 the name follows the session, and reads the wrong table."],
        [7.0, "With the fix, it resolves where the view was created, like a regular view."],
      ];
      caps.forEach(([t, s], i) => { const c = A.text(s, { y: 0.91, size: 32, weight: 600 }); A.in(c, t); if (i < caps.length - 1) A.out(c, caps[i + 1][0] - 0.3); });
      A.finish(12);
    </script>
  </body>
</html>
