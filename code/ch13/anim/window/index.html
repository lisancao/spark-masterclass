<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Chapter 13: a window runs as Exchange (shuffle by key), Sort, then Window. The 8-row sales table and the
      // running sums (ROWS UNBOUNDED PRECEDING) come from code/ch13/output/windows.txt, section 6.
      const D = {"scan": [["Queens","06-04",20],["Bronx","06-02",15],["Queens","06-01",10],["Queens","06-06",50],
                          ["Bronx","06-05",15],["Queens","06-03",30],["Bronx","06-01",5],["Queens","06-02",30]],
                 "running": {"Bronx": [5, 20, 35], "Queens": [10, 40, 70, 90, 140]}};
      A.mount();
      // beat open (0.0)
      A.title("How Spark runs a window function");
      const XS = 0.13, XP = { Bronx: 0.43, Queens: 0.73 }, Y0 = 0.30, G = 0.085, YS0 = 0.24, GS = 0.08;
      const hs = A.text("scan", { x: XS, y: 0.18, size: 30, weight: 700, color: "var(--a-mute)" });
      const hb = A.text("partition: Bronx", { x: XP.Bronx, y: 0.22, size: 30, weight: 700, color: "var(--a-acc)" });
      const hq = A.text("partition: Queens", { x: XP.Queens, y: 0.22, size: 30, weight: 700, color: "var(--a-ok)" });
      A.in(hs, 0.1);
      const chips = D.scan.map((r, i) => {
        const c = A.box({ x: XS, y: YS0 + i * GS, w: 270, h: 56, kind: r[0] === "Bronx" ? "accent" : "ok", title: r[0] + "  " + r[1] + "  " + r[2], size: 24, radius: 10 });
        return { r, c, y0: YS0 + i * GS };
      });
      A.in(chips.map(o => o.c), 0.2, { stagger: 0.04 });
      function cap(s, t0, t1) { const c = A.text(s, { y: 0.915, size: 38, weight: 600 }); A.in(c, t0); if (t1) A.out(c, t1); return c; }
      // beat shuffle (1.4): Exchange hashpartitioning(borough)
      cap("Exchange: a shuffle sends each borough to one partition", 1.4, 4.6);
      A.in([hb, hq], 1.5);
      const seen = { Bronx: 0, Queens: 0 };
      chips.forEach((o, i) => {
        const k = seen[o.r[0]]++;
        o.k = k;
        A.tl.to(o.c, { x: A.X(XP[o.r[0]] - XS), y: A.Y(Y0 + k * G - o.y0), duration: 0.9, ease: "power2.inOut" }, 1.8 + i * 0.12);
      });
      // beat sort (4.8): Sort by key, then day
      cap("Sort: each partition orders its rows by day", 4.8, 7.6);
      for (const b of ["Bronx", "Queens"]) {
        const mine = chips.filter(o => o.r[0] === b).sort((a, c) => a.r[1] < c.r[1] ? -1 : 1);
        mine.forEach((o, j) => { o.j = j; A.tl.to(o.c, { y: A.Y(Y0 + j * G - o.y0), duration: 0.8, ease: "power2.inOut" }, 5.1); });
      }
      // beat window (7.8): the frame grows down each partition, running sums appear
      cap("Window: the frame grows row by row and gives a running sum", 7.8, 11.8);
      for (const b of ["Bronx", "Queens"]) {
        const n = D.running[b].length, x = XP[b];
        const fr = A.el("", { x, y: Y0, anchor: "top", css: { width: A.px(300) + "px", height: A.px(70) + "px", border: `${A.px(4)}px dashed var(--a-fg)`, borderRadius: A.px(14) + "px", transformOrigin: "50% 0" } });
        gsap.set(fr, { y: -A.px(35), opacity: 0 });
        A.tl.set(fr, { opacity: 1 }, 8.0);
        D.running[b].forEach((v, j) => {
          const t = 8.0 + j * 0.7;
          A.tl.to(fr, { height: A.px(70) + j * G * A.UH, duration: 0.4, ease: "power1.out" }, t);
          const s = A.text(String(v), { x: x + A.dx(200), y: Y0 + j * G, size: 34, weight: 700 });
          A.in(s, t + 0.3, { dur: 0.3 });
        });
      }
      // beat cost (12.0)
      cap("One shuffle and one sort for each window specification", 12.0);
      A.in(A.note("running = sum(trips) OVER (PARTITION BY borough ORDER BY day ROWS UNBOUNDED PRECEDING)"), 0.5);
      A.finish(14);
    </script>
  </body>
</html>
