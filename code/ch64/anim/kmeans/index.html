<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Storyboard: storyboard.md. Points, centers and costs: data.json (kmeans_history.json from clustering.py).
      const D = {"source": "code/ch64/output/kmeans_history.json (clustering.py: avg_miles and night_share of 128 zones, scaled; KMeans k=3, seed 3, initMode=random, maxIter 1 to 8)", "points": [[-0.65, 0.999], [0.313, 0.879], [3.519, -0.843], [-0.057, -1.639], [-0.079, -1.361], [1.265, 0.563], [0.252, 0.187], [-0.671, -0.966], [0.271, 1.151], [0.34, -0.138], [-0.012, -0.629], [0.486, 2.825], [0.461, 1.786], [0.035, -0.426], [0.467, 0.47], [-0.463, -0.544], [-0.021, -0.271], [-1.15, -1.461], [-0.455, 0.383], [-0.918, 0.213], [0.264, 0.113], [-0.849, -0.668], [0.371, -0.295], [0.342, 0.18], [0.303, -0.142], [0.386, -0.318], [0.217, -0.227], [0.318, 0.058], [-0.949, -0.451], [0.297, -0.436], [2.343, -0.713], [0.189, -0.571], [-0.027, -0.528], [-0.333, -0.72], [-0.71, -1.171], [0.288, -0.158], [-0.933, 1.233], [0.365, 2.576], [0.179, 1.821], [0.028, 0.647], [0.584, -0.556], [-0.119, 0.083], [0.036, -0.114], [0.913, -0.454], [-1.141, -0.077], [0.053, -0.671], [0.786, 2.174], [2.126, 1.156], [0.766, 1.494], [0.234, 0.669], [-1.015, -0.431], [0.595, 1.183], [-1.097, -0.341], [0.066, 1.682], [-1.157, -0.191], [-1.03, 1.397], [0.247, -0.249], [-0.902, -0.302], [1.21, 0.263], [0.15, 1.211], [1.0, 1.86], [5.151, -0.364], [-0.969, -0.528], [2.478, -0.755], [-0.988, -1.502], [-1.19, -1.112], [-1.14, -0.694], [-1.058, -1.385], [-0.919, 0.441], [0.27, 0.959], [-0.144, 0.037], [-0.644, 1.953], [-0.883, -1.343], [-0.065, -0.512], [0.627, 2.376], [-0.918, 0.559], [-0.048, -0.268], [-1.093, -0.925], [-1.116, -1.152], [-1.068, -0.872], [-1.021, -0.118], [-0.543, -1.01], [0.259, -0.044], [-1.086, -0.864], [0.365, -0.198], [0.479, -0.267], [0.538, 1.428], [-1.07, -0.674], [0.457, -0.279], [0.411, 0.768], [0.053, -0.748], [0.899, 0.317], [0.717, -0.019], [0.279, 0.467], [0.145, 1.53], [-0.184, 0.596], [-0.957, -0.096], [0.615, -1.013], [2.235, -0.115], [0.51, -0.293], [0.605, 0.688], [-0.76, -0.621], [0.307, 0.298], [0.491, -0.023], [1.365, 1.708], [-1.149, -0.958], [-0.771, -0.293], [-0.646, -0.269], [-0.299, 0.26], [-0.96, -1.095], [-1.177, -0.417], [-1.237, -1.654], [-1.37, -1.387], [-1.021, -1.341], [-1.098, -1.145], [1.099, -0.196], [0.749, -0.445], [-0.976, -0.566], [0.804, -0.035], [-1.074, 1.106], [0.046, 2.666], [0.074, 1.896], [0.084, 0.978], [-0.234, -0.916], [-0.899, -1.545], [-0.98, -0.884], [0.282, -0.952], [2.029, -0.33]], "history": [{"iter": 1, "cost": 144.11, "centers": [[0.532, -0.12], [0.419, 1.794], [-0.964, -0.641]]}, {"iter": 2, "cost": 102.11, "centers": [[0.604, -0.132], [0.246, 1.616], [-0.906, -0.766]]}, {"iter": 3, "cost": 99.26, "centers": [[0.607, -0.149], [0.252, 1.585], [-0.906, -0.766]]}, {"iter": 4, "cost": 99.17, "centers": [[0.632, -0.177], [0.229, 1.519], [-0.906, -0.766]]}, {"iter": 5, "cost": 98.79, "centers": [[0.64, -0.193], [0.229, 1.49], [-0.906, -0.766]]}, {"iter": 6, "cost": 98.75, "centers": [[0.661, -0.204], [0.229, 1.49], [-0.897, -0.741]]}, {"iter": 7, "cost": 98.67, "centers": [[0.662, -0.222], [0.241, 1.464], [-0.897, -0.741]]}, {"iter": 8, "cost": 98.63, "centers": [[0.662, -0.222], [0.241, 1.464], [-0.897, -0.741]]}]};
      A.mount();
      A.title("KMeans on 128 zones: each iteration moves the centers");
      const X0 = 0.08, X1 = 0.62, Y0 = 0.88, Y1 = 0.2;
      const xmin = -1.6, xmax = 5.4, ymin = -1.9, ymax = 3.0;
      const fx = (v) => X0 + (v - xmin) / (xmax - xmin) * (X1 - X0);
      const fy = (v) => Y0 - (v - ymin) / (ymax - ymin) * (Y0 - Y1);
      A.line({ x1: X0, y1: Y0, x2: X1, y2: Y0 });
      A.line({ x1: X0, y1: Y0, x2: X0, y2: Y1 });
      A.in(A.text("avg_miles (scaled)", { x: (X0 + X1) / 2, y: Y0 + 0.045, size: 26, color: "var(--a-mute)" }), 0.2);
      A.in(A.text("night_share (scaled)", { x: X0 - 0.01, y: Y1 - 0.035, size: 26, color: "var(--a-mute)", anchor: "left" }), 0.2);
      const COL = ["var(--a-acc)", "var(--a-ok)", "#3a5f96"];
      const pts = D.points.map((p) => { const d = A.dot({ x: fx(p[0]), y: fy(p[1]), r: 7, color: "var(--a-mute)", hidden: false }); gsap.set(d, { opacity: 0 }); return d; });
      A.tl.to(pts, { opacity: 0.8, duration: 0.6, stagger: 0.004 }, 0.3);
      const nearest = (p, cs) => { let b = 0, bd = 1e9; cs.forEach((c, i) => { const d = (p[0]-c[0])**2 + (p[1]-c[1])**2; if (d < bd) { bd = d; b = i; } }); return b; };
      const H = D.history;
      const cen = H[0].centers.map((c, i) => { const d = A.el("", { x: fx(c[0]), y: fy(c[1]), css: { width: A.px(34) + "px", height: A.px(34) + "px",
        background: COL[i], border: A.px(4) + "px solid var(--a-fg)", transform: "rotate(45deg)" } }); gsap.set(d, { opacity: 0 }); return d; });
      const cap = (s, t0, t1) => { const c = A.text(s, { x: 0.81, y: 0.62, size: 32, maxw: 560 }); A.in(c, t0); if (t1) A.out(c, t1); };
      cap("Three random starting centers", 1.4, 3.0);
      A.tl.to(cen, { opacity: 1, duration: 0.4 }, 1.4);
      const T0 = 3.0, STEP = 1.15;
      cap("Each row goes to its nearest center, then each center moves to the mean of its rows", T0, T0 + 4 * STEP);
      H.forEach((h, k) => {
        const t = T0 + k * STEP;
        const cs = (k === 0 ? H[0] : H[k - 1]).centers;
        D.points.forEach((p, j) => A.tl.to(pts[j], { backgroundColor: COL[nearest(p, cs)], duration: 0.3 }, t));
        h.centers.forEach((c, i) => A.tl.to(cen[i], { x: A.X(fx(c[0]) - fx(H[0].centers[i][0])), y: A.Y(fy(c[1]) - fy(H[0].centers[i][1])), duration: 0.6, ease: "power2.inOut" }, t + 0.4));
        const lab = A.text("maxIter=" + h.iter + "   cost " + h.cost.toFixed(2), { x: 0.81, y: 0.4, size: 40, weight: 700, mono: true, color: "var(--a-acc)" });
        gsap.set(lab, { opacity: 0 });
        A.tl.set(lab, { opacity: 1 }, t);
        if (k < H.length - 1) A.tl.set(lab, { opacity: 0 }, t + STEP);
      });
      const tEnd = T0 + H.length * STEP;
      cap("Most of the drop is in the first two iterations: " + H[0].cost.toFixed(2) + " to " + H[1].cost.toFixed(2) + ", then " + H[H.length-1].cost.toFixed(2), T0 + 4 * STEP);
      A.in(A.note("points and centers: code/ch64/output/kmeans_history.json; timing schematic"), 0.3);
      A.finish(14);
    </script>
  </body>
</html>
