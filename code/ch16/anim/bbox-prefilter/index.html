<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <script src="data.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <!-- `anim render` rewrites data-width/data-height per format; leave them as they are. -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="31.5" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Storyboard: storyboard.md. Real zones and stations from data.js (ch16/anim_data.py).
      const D = window.DATA;
      A.mount();
      const VW = 1000, VH = 750;
      const P = (f) => [f[0] * VW, f[1] * VH];
      const fmt = (n) => n.toLocaleString("en-US");

      // beat open (0.0): title, map and stations on screen at frame 0
      A.title("Point in polygon in Spark 4.3.0", "Citi Bike stations against NYC taxi zones");
      const mapH = A.px(A.landscape ? 760 : 700), mapW = mapH * VW / VH;
      const svgNS = "http://www.w3.org/2000/svg";
      const host = A.el("", { x: A.landscape ? 0.30 : 0.5, y: A.landscape ? 0.56 : 0.42,
        css: { width: mapW + "px", height: mapH + "px" } });
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", `0 0 ${VW} ${VH}`);
      svg.setAttribute("width", mapW); svg.setAttribute("height", mapH);
      host.appendChild(svg);
      const g = (cls) => { const e = document.createElementNS(svgNS, "g"); svg.appendChild(e); return e; };
      const mk = (parent, tag, attrs) => { const e = document.createElementNS(svgNS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      const clip = mk(svg, "clipPath", { id: "win" }); mk(clip, "rect", { x: 0, y: 0, width: VW, height: VH });
      const frame = mk(svg, "rect", { x: 0, y: 0, width: VW, height: VH, fill: "none", style: "stroke:var(--a-line);stroke-width:2" });
      const gz = g(), gg = g(), gb = g(), gr = g(), gp = g();
      for (const e of [gz, gg, gb, gr, gp]) e.setAttribute("clip-path", "url(#win)");
      const zoneEl = {};
      for (const z of D.zones) {
        const d = z.rings.map((r) => "M" + r.map((p) => P(p).map((v) => v.toFixed(1)).join(",")).join("L") + "Z").join("");
        zoneEl[z.id] = mk(gz, "path", { d, style: "fill:var(--a-panel);fill-opacity:0.55;stroke:var(--a-mute);stroke-width:1.6" });
      }
      const dots = D.points.map((p) => mk(gp, "circle", { cx: p.x * VW, cy: p.y * VH, r: 5.5, style: "fill:var(--a-fg)" }));

      // right panel: the counter and the captions
      const px = A.landscape ? 0.78 : 0.5, py = A.landscape ? 0.30 : 0.80;
      const lab = A.text("point-zone pairs to test", { x: px, y: py, size: 30, weight: 400, color: "var(--a-mute)" });
      const cnt = A.text(fmt(D.pairs.all), { x: px, y: py + A.dy(70), size: 84, weight: 700, color: "var(--a-acc)", mono: true });
      const how = A.text("2,279 stations × 263 zones", { x: px, y: py + A.dy(140), size: 30, weight: 400 });
      const caps = [], CAPY = A.landscape ? 0.62 : 0.92, CAPX = A.landscape ? 0.78 : 0.5;
      const cap = (s, t0, t1) => { const c = A.text(s, { x: CAPX, y: CAPY, size: 36, weight: 500, maxw: A.landscape ? 640 : 960 });
        gsap.set(c, { opacity: 0 }); A.tl.to(c, { opacity: 1, duration: 0.3 }, t0); if (t1) A.tl.to(c, { opacity: 0, duration: 0.3 }, t1); return c; };
      const swap = (el, s, t) => { A.tl.to(el, { opacity: 0, duration: 0.2 }, t); A.tl.call(() => { el.textContent = s; }, null, t + 0.2);
        A.tl.to(el, { opacity: 1, duration: 0.25 }, t + 0.2); };
      const c0 = cap("Spark 4.3.0 has no ST_Contains, so you write the test yourself.", 0, 4.8);
      gsap.set(c0, { opacity: 1 });

      // beat pairs (4.8)
      cap("Every station against every zone is a lot of pairs.", 4.8, 9.4);

      // beat grid (9.4): one-mile cells
      for (const x of D.grid_x) mk(gg, "line", { x1: x * VW, y1: 0, x2: x * VW, y2: VH, style: "stroke:var(--a-acc);stroke-width:2;stroke-dasharray:8 6" });
      for (const y of D.grid_y) mk(gg, "line", { x1: 0, y1: y * VH, x2: VW, y2: y * VH, style: "stroke:var(--a-acc);stroke-width:2;stroke-dasharray:8 6" });
      gsap.set(gg, { opacity: 0 }); A.tl.to(gg, { opacity: 1, duration: 0.5 }, 9.4);
      cap("A one-mile grid key keeps only the zones in the same cell.", 9.4, 14.2);
      swap(cnt, fmt(D.pairs.cell), 9.9); swap(how, "same grid cell", 9.9);

      // beat bbox (14.2): focus one station, show the boxes of the zones in its cell
      const inBox = (p, b) => p.x >= b[0] && p.x <= b[2] && p.y >= b[1] && p.y <= b[3];
      const cellOf = (p) => [D.grid_x.filter((x) => x <= p.x).length, D.grid_y.filter((y) => y <= p.y).length];
      const sameCell = (p, z) => { const c = cellOf(p);
        const bx0 = D.grid_x.filter((x) => x <= z.bbox[0]).length, bx1 = D.grid_x.filter((x) => x <= z.bbox[2]).length;
        const by0 = D.grid_y.filter((y) => y <= z.bbox[1]).length, by1 = D.grid_y.filter((y) => y <= z.bbox[3]).length;
        return c[0] >= bx0 && c[0] <= bx1 && c[1] >= by0 && c[1] <= by1; };
      let best = null;
      for (const p of D.points) {
        if (p.x < 0.25 || p.x > 0.75 || p.y < 0.25 || p.y > 0.75) continue;
        const cand = D.zones.filter((z) => sameCell(p, z)), boxed = cand.filter((z) => inBox(p, z.bbox));
        const score = boxed.length * 100 - Math.abs(cand.length - 6);
        if (boxed.length >= 2 && cand.length > boxed.length && (!best || score > best.score)) best = { p, cand, boxed, score };
      }
      const fp = best.p, fi = D.points.indexOf(fp);
      A.tl.to(dots.filter((_, i) => i !== fi), { opacity: 0.18, duration: 0.4 }, 14.2);
      A.tl.to(dots[fi], { attr: { r: 11 }, duration: 0.4 }, 14.2);
      A.tl.set(dots[fi], { css: { fill: "var(--a-acc)" } }, 14.2);
      A.tl.to(gg, { opacity: 0.25, duration: 0.4 }, 14.2);
      const boxEls = best.cand.map((z) => {
        const [x0, y0, x1, y1] = z.bbox;
        const r = mk(gb, "rect", { x: x0 * VW, y: y0 * VH, width: (x1 - x0) * VW, height: (y1 - y0) * VH,
          style: "fill:none;stroke:var(--a-fg);stroke-width:2.5" });
        gsap.set(r, { opacity: 0 }); A.tl.to(r, { opacity: 1, duration: 0.3 }, 14.5 + 0.08 * best.cand.indexOf(z));
        if (!best.boxed.includes(z)) A.tl.to(r, { opacity: 0, duration: 0.4 }, 16.2);
        return r; });
      cap("A bounding box drops most of the rest with four comparisons.", 14.2, 19.0);
      swap(cnt, fmt(D.pairs.bbox), 16.2); swap(how, "same cell and inside the box", 16.2);

      // beat exact (19.0): a ray to the right, crossings counted per remaining zone
      const [rx, ry] = [fp.x * VW, fp.y * VH];
      const ray = mk(gr, "line", { x1: rx, y1: ry, x2: VW, y2: ry, style: "stroke:var(--a-acc);stroke-width:3" });
      gsap.set(ray, { opacity: 0 }); A.tl.to(ray, { opacity: 1, duration: 0.4 }, 19.0);
      A.tl.to(boxEls, { opacity: 0, duration: 0.3 }, 19.0);
      let k = 0;
      for (const z of best.boxed) {
        let n = 0;
        for (const r of z.rings) for (let i = 0; i < r.length - 1; i++) {
          const [x1, y1] = P(r[i]), [x2, y2] = P(r[i + 1]);
          if ((y1 > ry) !== (y2 > ry)) { const xc = x1 + (ry - y1) * (x2 - x1) / (y2 - y1);
            if (xc > rx) { n++; const m = mk(gr, "circle", { cx: xc, cy: ry, r: 8, style: "fill:none;stroke:var(--a-acc);stroke-width:3" });
              gsap.set(m, { opacity: 0 }); A.tl.to(m, { opacity: 1, duration: 0.2 }, 19.5 + 0.9 * k); } } }
        const el = zoneEl[z.id], inside = n % 2 === 1, t = 19.6 + 0.9 * k;
        A.tl.call(() => el.setAttribute("style", inside
          ? "fill:var(--a-acc);fill-opacity:0.35;stroke:var(--a-acc);stroke-width:3"
          : "fill:var(--a-panel);fill-opacity:0.55;stroke:var(--a-fg);stroke-width:2.5"), null, t);
        const line = A.text(`${z.name}: ${n} crossing${n === 1 ? "" : "s"}, ${inside ? "inside" : "outside"}`,
          { x: CAPX, y: CAPY + A.dy(120 + 46 * k), size: 28, weight: inside ? 700 : 400,
            color: inside ? "var(--a-acc)" : "var(--a-mute)" });
        gsap.set(line, { opacity: 0 }); A.tl.to(line, { opacity: 1, duration: 0.3 }, t);
        k++;
      }
      cap("A ray from the point crosses the edges. An odd count means inside.", 19.0, 24.4);
      swap(cnt, fmt(D.pairs.answers), 22.6); swap(lab, "rows in the result", 22.6); swap(how, "answers, one zone per station", 22.6);

      // beat result (24.4): the measured times
      const m = D.median_s;
      cap(`Same answers: ${m["distinct points, all pairs"].toFixed(2)} s for all pairs, ` +
          `${m["distinct points, grid + bbox + edges"].toFixed(2)} s with grid and box.`, 24.4);
      A.in(A.note("median of 3 runs, local[*] on 16 cores, June 2026 Citi Bike starts"), 24.4);
      A.finish(31.5);
    </script>
  </body>
</html>
