<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <!-- `anim render` rewrites data-width/data-height per format; leave them as they are. -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <div id="stage"></div>
    </div>
    <script>
      // Plan lines from the plan change log in rules.txt (shortened); counts from twice.txt.
      const D = {"source": "code/ch74/output/rules.txt (plan change log) and twice.txt (counts)", "p0": [["Filter (area#11 = api)", 0], ["Project [ip, path, status, _area(path#7)#9 AS area#11]", 1], ["Relation [ip#6,path#7,status#8] parquet", 0]], "p1": [["Project [ip, path, status, _area(path#7)#9 AS area#11]", 1], ["Filter (_area(path#7)#9 = api)", 1], ["Relation [ip#6,path#7,status#8] parquet", 0]], "p2": [["Project [ip, path, status, pythonUDF0#13 AS area#11]", 0], ["ArrowEvalPython [_area(path#7)#9], [pythonUDF0#13], 101", 2], ["Project [ip#6, path#7, status#8]", 0], ["Filter (pythonUDF0#12 = api)", 0], ["ArrowEvalPython [_area(path#7)#9], [pythonUDF0#12], 101", 2], ["Relation [ip#6,path#7,status#8] parquet", 0]], "calls": "200 + 70 = 270 UDF calls"}; // data.json
      A.mount();
      A.title("Two rules copy a Python UDF", "df.withColumn('area', area('path')).filter(area == 'api')");
      const X = 0.40, W = 1180;
      function tree(rows, t0, t1) {
        const els = [];
        rows.forEach(([s, k], i) => {
          const kind = k === 2 ? "accent" : (k === 1 ? "soft" : "paper");
          const b = A.box({ x: X, y: 0.24 + i * 0.085, w: W, h: 62, kind, title: s, size: 22 });
          els.push(b);
          if (i) els.push(A.line({ x1: X, y1: 0.24 + (i - 1) * 0.085 + A.dy(31), x2: X, y2: 0.24 + i * 0.085 - A.dy(31), width: 3 }));
        });
        A.in(els, t0, { stagger: 0.05, rise: 6 });
        if (t1) A.out(els, t1);
        return els;
      }
      const RX = 0.86;
      const rule = (s, t, t1) => { const e = A.text(s, { x: RX, y: 0.30, size: 26, weight: 700, color: "var(--a-acc)", maxw: 360 }); A.in(e, t); if (t1) A.out(e, t1); };
      tree(D.p0, 0.3, 3.4);
      rule("analyzed plan", 0.3, 3.2);
      tree(D.p1, 3.8, 7.4);
      rule("PushDownPredicates", 3.8, 7.2);
      const two = A.text("the UDF is now in two operators", { x: RX, y: 0.42, size: 22, color: "var(--a-mute)", maxw: 360 });
      A.in(two, 4.8); A.out(two, 7.2);
      tree(D.p2, 7.8, null);
      rule("ExtractPythonUDFs", 7.8, null);
      const calls = A.text(D.calls, { x: RX, y: 0.46, size: 28, weight: 700, maxw: 360 });
      A.in(calls, 9.8);
      const caps = [
        [0.3, "The filter refers to area, an alias of the UDF result."],
        [3.8, "To push the filter down, the rule copies the alias definition."],
        [7.8, "Then each copy gets its own ArrowEvalPython operator."],
        [9.8, "Filter on 200 rows, project 70 rows: 270 calls in all."],
      ];
      caps.forEach(([t, s], i) => { const c = A.text(s, { y: 0.90, size: 34, weight: 600 }); A.in(c, t); if (i < caps.length - 1) A.out(c, caps[i + 1][0] - 0.3); });
      A.finish(13);
    </script>
  </body>
</html>
