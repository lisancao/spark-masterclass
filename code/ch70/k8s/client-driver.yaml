# Chapter 70, Step 8: client mode inside the cluster. The driver is a pod that you own (here a bare
# pod; often a notebook or a Connect server). A headless service gives it a stable DNS name that
# the executors can call, and spark.kubernetes.driver.pod.name makes the driver pod the owner of
# the executor pods, so Kubernetes deletes them when the driver pod goes away.
apiVersion: v1
kind: Service
metadata:
  name: ch70-client-driver
  namespace: spark-apps
spec:
  clusterIP: None
  selector:
    app: ch70-client-driver
  ports:
  - {name: driver-rpc, port: 7078}
  - {name: blockmanager, port: 7079}
---
apiVersion: v1
kind: Pod
metadata:
  name: ch70-client-driver
  namespace: spark-apps
  labels:
    app: ch70-client-driver
spec:
  serviceAccountName: spark-driver
  restartPolicy: Never
  containers:
  - name: driver
    image: spark-masterclass/spark:4.3.0-book
    imagePullPolicy: Never
    command: ["/opt/spark/bin/spark-submit"]
    args:
    - --master=k8s://https://kubernetes.default.svc
    - --deploy-mode=client
    - --name=ch70-client
    - --conf=spark.driver.host=ch70-client-driver.spark-apps.svc.cluster.local
    - --conf=spark.driver.port=7078
    - --conf=spark.driver.blockManager.port=7079
    - --conf=spark.kubernetes.driver.pod.name=ch70-client-driver
    - --conf=spark.kubernetes.namespace=spark-apps
    - --conf=spark.kubernetes.container.image=spark-masterclass/spark:4.3.0-book
    - --conf=spark.kubernetes.container.image.pullPolicy=Never
    - --conf=spark.executor.instances=2
    - --conf=spark.executor.memory=1g
    - --conf=spark.kubernetes.executor.request.cores=500m
    - --conf=spark.kubernetes.executor.volumes.hostPath.taxi.mount.path=/data/nyc-taxi
    - --conf=spark.kubernetes.executor.volumes.hostPath.taxi.mount.readOnly=true
    - --conf=spark.kubernetes.executor.volumes.hostPath.taxi.options.path=/data/nyc-taxi
    - local:///opt/ch70/app.py
    - /data/nyc-taxi/yellow
    volumeMounts:
    - {name: taxi, mountPath: /data/nyc-taxi, readOnly: true}
    - {name: code, mountPath: /opt/ch70, readOnly: true}
  volumes:
  - {name: taxi, hostPath: {path: /data/nyc-taxi}}
  - {name: code, hostPath: {path: /opt/ch70}}
