<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <!-- `anim render` rewrites data-width/data-height per format; leave them as they are. -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <div id="stage"></div>
    </div>
    <script>
      // Plan lines from planchange.txt, values from extensions.txt.
      const D = {"source": "code/ch85/output/planchange.txt and extensions.txt", "before": "Project [is_png(content#3)#4 AS png#5]", "after": "Project [coalesce(is_png(content#3), false) AS png#5]", "python": "[False, False, True, True, True, True, True]", "rewritten": "[False, False, True, True, True, True, True]", "native": "[False, None, True, True, True, True, True]"}; // data.json
      A.mount();
      A.title("An optimizer rule replaces a Python UDF", "jext.PngRule in the operator optimization batch");
      const before = A.text(D.before, { x: 0.5, y: 0.22, size: 28, mono: true });
      A.in(before, 0.2);
      // expression tree: PythonUDF is_png -> content
      const udf = A.box({ x: 0.30, y: 0.40, w: 420, h: 84, kind: "accent", title: "PythonUDF is_png", sub: "BOOLEAN, deterministic", size: 28 });
      const arg = A.box({ x: 0.30, y: 0.58, w: 320, h: 70, kind: "paper", title: "content: BINARY", size: 26 });
      const l = A.line({ x1: 0.30, y1: 0.40 + A.dy(42), x2: 0.30, y2: 0.58 - A.dy(35), width: 3 });
      A.in([udf, l, arg], 1.0, { stagger: 0.15 });
      // the checks
      const checks = ["name() is is_png", "udfDeterministic() is true", "BOOLEAN result, one BINARY argument"];
      const ce = checks.map((c, i) => A.text("✓  " + c, { x: 0.58, y: 0.38 + i * 0.07, size: 28, anchor: "left", color: "var(--a-ok)" }));
      ce.forEach((e, i) => A.in(e, 2.6 + i * 0.6, { rise: 0 }));
      // beat rewrite (5.0)
      const co = A.box({ x: 0.30, y: 0.40, w: 420, h: 84, kind: "ok", title: "Coalesce", sub: "(..., false)", size: 28 });
      const ip = A.box({ x: 0.30, y: 0.58, w: 320, h: 70, kind: "ok", title: "IsPng (native)", size: 26 });
      const ar2 = A.box({ x: 0.30, y: 0.74, w: 320, h: 64, kind: "paper", title: "content: BINARY", size: 24 });
      const l2 = A.line({ x1: 0.30, y1: 0.58 + A.dy(35), x2: 0.30, y2: 0.74 - A.dy(32), width: 3 });
      gsap.set([co, ip, ar2, l2], { opacity: 0 });
      A.tl.to([udf, arg], { opacity: 0, duration: 0.3 }, 5.0);
      A.tl.to([co, ip, ar2, l2], { opacity: 1, duration: 0.4, stagger: 0.1 }, 5.2);
      A.out(ce, 5.0);
      const after = A.text(D.after, { x: 0.5, y: 0.22, size: 28, mono: true, color: "var(--a-ok)" });
      gsap.set(after, { opacity: 0 }); A.tl.to(before, { opacity: 0, duration: 0.2 }, 5.6); A.tl.to(after, { opacity: 1, duration: 0.3 }, 5.7);
      // beat values (7.6)
      const vals = [["Python UDF", D.python, "var(--a-fg)"], ["rewritten", D.rewritten, "var(--a-ok)"], ["native alone", D.native, "var(--a-acc)"]];
      vals.forEach(([a, b, c], i) => {
        const e1 = A.text(a, { x: 0.56, y: 0.40 + i * 0.09, size: 24, anchor: "left", color: "var(--a-mute)" });
        const e2 = A.text(b, { x: 0.56, y: 0.40 + i * 0.09 + A.dy(36), size: 22, mono: true, anchor: "left", color: c });
        A.in([e1, e2], 7.6 + i * 0.5, { rise: 0 });
      });
      const caps = [
        [0.4, "A plan calls the Python UDF is_png on the bytes of each file."],
        [2.6, "The rule checks the name, the determinism and the types."],
        [5.0, "It puts the native IsPng in place, inside a Coalesce."],
        [7.6, "Coalesce keeps False for NULL, as the Python function does."],
        [10.0, "No Python UDF remains, so the plan needs no Python worker."],
      ];
      caps.forEach(([t, s], i) => { const c = A.text(s, { y: 0.90, size: 34, weight: 600 }); A.in(c, t); if (i < caps.length - 1) A.out(c, caps[i + 1][0] - 0.3); });
      A.finish(13);
    </script>
  </body>
</html>
