<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="14.5" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Chapter 15: how Spark completes a table name. Names from code/ch15/output/catalogs.txt.
      A.mount();
      // beat open (0.0)
      A.title("catalog . namespace . table");
      const CY = 0.27;
      const curL = A.text("current", { x: 0.14, y: CY, size: 34, weight: 600, color: "var(--a-mute)" });
      const cats = [["spark_catalog", "default", 0, 1.6], ["spark_catalog", "taxi", 1.6, 6.8], ["h2", "ops", 6.8, null]];
      const catEls = cats.map(([c, n, t0, t1]) => {
        const b = A.box({ x: 0.40, y: CY, w: 420, h: 84, kind: c === "h2" ? "ink" : "accent", title: c, size: 34 });
        const nb = A.box({ x: 0.66, y: CY, w: 300, h: 84, kind: "soft", title: n, size: 34 });
        A.tl.set([b, nb], { opacity: 0 }, 0); A.tl.set([b, nb], { opacity: 1 }, t0); if (t1) A.tl.set([b, nb], { opacity: 0 }, t1);
        return [b, nb];
      });
      A.in(curL, 0);
      function cap(s, t0, t1) { const c = A.text(s, { y: 0.90, size: 38, weight: 600 }); A.in(c, t0); if (t1) A.out(c, t1); return c; }
      function sql(s, y, t0, t1) { const e = A.text(s, { x: 0.5, y, size: 40, weight: 600, mono: true }); A.in(e, t0); if (t1) A.out(e, t1); return e; }
      cap("A table name has three parts", 0.0, 1.3);
      // beat use (1.4)
      cap("USE sets the current namespace", 1.4, 3.5);
      sql("USE taxi", 0.45, 1.4, 3.5);
      // beat short (3.6)
      cap("Spark adds the current catalog and namespace", 3.6, 6.5);
      sql("SELECT count(*) FROM zones", 0.45, 3.6, 6.5);
      const full1 = A.text("spark_catalog.taxi.zones", { x: 0.5, y: 0.60, size: 48, weight: 700, mono: true, color: "var(--a-acc)" });
      const r1 = A.text("265 rows", { x: 0.5, y: 0.70, size: 34, weight: 500, color: "var(--a-mute)" });
      A.in(full1, 4.3); A.in(r1, 5.0); A.out([full1, r1], 6.5);
      // beat use2 (6.6)
      cap("USE can also change the catalog", 6.6, 8.3);
      sql("USE h2.ops", 0.45, 6.6, 8.3);
      // beat short2 (8.4)
      cap("The same kind of short name now looks in H2", 8.4, 10.9);
      sql("SHOW TABLES", 0.45, 8.4, 10.9);
      const full2 = A.text("h2.ops.zone_owner", { x: 0.5, y: 0.60, size: 48, weight: 700, mono: true, color: "var(--a-fg)" });
      A.in(full2, 9.1); A.out(full2, 10.9);
      // beat full (11.0)
      cap("A three-part name works from any current catalog", 11.0);
      sql("FROM spark_catalog.taxi.zones", 0.47, 11.0);
      sql("JOIN h2.ops.zone_owner USING (LocationID)", 0.55, 11.3);
      const r3 = A.text("3 rows: JFK Airport, LaGuardia Airport, Midtown Center", { x: 0.5, y: 0.68, size: 32, weight: 500, color: "var(--a-ok)" });
      A.in(r3, 12.0);
      A.in(A.note("names and results from one run of catalogs.py on Spark 4.3.0"), 0.4);
      A.finish(14.5);
    </script>
  </body>
</html>
