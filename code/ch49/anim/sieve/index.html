<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <!-- `anim render` rewrites data-width/data-height per format; leave them as they are. -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <div id="stage"></div>
    </div>
    <script>
      // Outcomes from dryrun.txt. The order of the beats follows the dry-run and the run.
      const D = {"source": "code/ch49/output/dryrun.txt", "gates": ["register flows", "resolve graph", "run", "trusted number"], "flows": [{"f": "gold_typo.py", "stop": 1, "msg": "TABLE_OR_VIEW_NOT_FOUND"}, {"f": "gold_column.py", "stop": 1, "msg": "UNRESOLVED_COLUMN"}, {"f": "gold_conf.py", "stop": 0, "msg": "SESSION_MUTATION"}, {"f": "gold_epoch.py", "stop": 3, "msg": "561 days in year 58384", "run": "COMPLETED, 561 rows"}, {"f": "gold_ok.py", "stop": 4, "msg": "5 days in June 2026", "run": "COMPLETED, 5 rows"}]}; // data.json
      A.mount();
      A.title("Each check stops a different error", "five versions of one gold flow");
      const GX = [0.33, 0.48, 0.63, 0.78], X0 = 0.11, T = [1.6, 3.6, 6.0, 8.6];
      const g = [];
      D.gates.forEach((n, i) => {
        g.push(A.text(n, { x: GX[i], y: 0.21, size: 26, weight: 700, color: i === 3 ? "var(--a-acc)" : "var(--a-mute)" }));
        g.push(A.line({ x1: GX[i], y1: 0.25, x2: GX[i], y2: 0.74, width: 3, color: "var(--a-line)" }));
      });
      g.push(A.text("dry-run: no data read", { x: (GX[0] + GX[1]) / 2, y: 0.25, size: 20, color: "var(--a-mute)" }));
      A.in(g, 0.2, { stagger: 0.03 });
      const ys = D.flows.map((_, i) => 0.31 + i * 0.1);
      const tok = D.flows.map((f, i) => A.box({ x: X0, y: ys[i], w: 260, h: 62, kind: "paper", title: f.f, size: 24 }));
      A.in(tok, 0.4, { stagger: 0.06 });
      // move the flows gate by gate
      for (let k = 0; k < 4; k++) {
        D.flows.forEach((f, i) => {
          if (f.stop < k) return;
          const tx = A.X((f.stop === k ? GX[k] - 0.07 : (k === 3 ? 0.90 : GX[k])) - X0);
          A.tl.to(tok[i], { x: tx, duration: 0.9, ease: "power2.inOut" }, T[k]);
          if (f.stop === k) {
            const bad = A.box({ x: GX[k] - 0.07, y: ys[i], w: 260, h: 62, kind: k === 3 ? "accent" : "soft", title: f.f, size: 24 });
            gsap.set(bad, { opacity: 0 });
            A.tl.to(bad, { opacity: 1, duration: 0.3 }, T[k] + 0.9);
            const m = A.text(f.msg, { x: GX[k] + 0.012, y: ys[i], size: k === 3 ? 20 : 22, mono: true, anchor: "left", color: k === 3 ? "var(--a-acc)" : "var(--a-mute)" });
            A.in(m, T[k] + 1.0, { rise: 0 });
          }
          if (k === 2 && f.run) { const r = A.text(f.run, { x: GX[2], y: ys[i] - A.dy(44), size: 20, color: "var(--a-ok)" }); A.in(r, T[2] + 1.0, { rise: 0 }); }
        });
      }
      const okx = A.text(D.flows[4].msg, { x: 0.90, y: ys[4] + A.dy(48), size: 22, color: "var(--a-ok)" });
      A.in(okx, T[3] + 1.0);
      const caps = [
        [0.4, "An agent writes five versions of the same flow."],
        [T[0], "Registration refuses a flow that changes the session."],
        [T[1], "The graph check refuses a wrong table name and a wrong column."],
        [T[2], "Two flows run. Both complete without an error."],
        [T[3], "Only a trusted number shows that one result is wrong."],
      ];
      caps.forEach(([t, s], i) => { const c = A.text(s, { y: 0.86, size: 36, weight: 600 }); A.in(c, t); if (i < caps.length - 1) A.out(c, caps[i + 1][0] - 0.3); });
      A.in(A.note("outcomes from one dry-run and one run of each version"), 0.5);
      A.finish(13);
    </script>
  </body>
</html>
