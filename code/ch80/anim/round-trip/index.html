<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="32" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Storyboard: storyboard.md. Numbers: data.json (from code/ch80/output/protocol.txt).
      const D = {"request_bytes": 695,
        "responses": [["schema", "192 B"], ["execution_progress", "x4"], ["arrow_batch", "3 rows, 496 B Arrow"], ["metrics", "4038 B"], ["result_complete", ""]],
        "rows": [[237, 177610], [161, 161198], [236, 157113]],
        "plan": ["read parquet", "aggregate", "sort", "limit 3"]};
      A.mount();

      // beat open (0.0): everything structural is on screen at frame 0
      A.title("A plan round trip", "Spark Connect");
      const CX = 0.17, SX = 0.62, EX = 0.9, Y = 0.47;
      A.box({ x: CX, y: Y + A.dy(30), w: 500, h: 640, kind: "ghost", title: "", radius: 18 });
      A.text("Python client", { x: CX, y: Y - A.dy(250), size: 34, weight: 700 });
      A.text("no JVM", { x: CX, y: Y - A.dy(212), size: 24, color: "var(--a-mute)" });
      A.box({ x: SX, y: Y, w: 520, h: 560, kind: "ghost", radius: 18 });
      A.text("Connect server (the driver)", { x: SX, y: Y - A.dy(250), size: 34, weight: 700 });
      const wire = A.line({ x1: CX + A.dx(250), y1: Y, x2: SX - A.dx(270), y2: Y });
      A.text("gRPC", { x: (CX + SX) / 2 - A.dx(20), y: Y - A.dy(70), size: 26, color: "var(--a-mute)" });
      const ex = [0, 1, 2].map((i) => A.box({ x: EX, y: Y - A.dy(150) + A.dy(150 * i), w: 170, h: 90, kind: "soft", title: "executor", size: 24 }));
      A.line({ x1: SX + A.dx(260), y1: Y, x2: EX - A.dx(90), y2: Y });
      const cap = (s, t0, t1) => { const c = A.text(s, { y: 0.9, size: 34, weight: 500 }); A.in(c, t0); if (t1) A.out(c, t1); return c; };
      cap("One query, from a client to a server.", 0.0, 3.3);
      A.tl.set(cap, {}, 0.0);

      // beat build (1.5): plan nodes bottom-up
      const nodes = D.plan.map((n, i) => A.box({ x: CX, y: Y + A.dy(150) - A.dy(85 * i), w: 300, h: 64, kind: i === 3 ? "accent" : "paper", title: n, size: 24 }));
      A.in(nodes, 3.66, { stagger: 0.45 });
      cap("The client builds a plan. It checks no names.", 3.5, 7.98);

      // beat send (4.5): fold into a packet, move it to the server
      A.tl.to(nodes, { y: A.px(0), scale: 0.2, opacity: 0, duration: 0.6, ease: "power2.in" }, 8.46);
      const pkt = A.box({ x: CX + A.dx(300), y: Y + A.dy(70), w: 250, h: 70, kind: "accent", title: "ExecutePlan", sub: D.request_bytes + " B protobuf", size: 22 });
      A.in(pkt, 9.1);
      A.tl.to(pkt, { x: A.X(SX - CX - 0.32), duration: 1.8, ease: "power1.inOut" }, 9.9);
      A.out(pkt, 13.1);
      cap("The plan travels over gRPC as " + D.request_bytes + " bytes of protobuf.", 8.3, 13.6);

      // beat analyze (8.0): the server works
      const steps = ["analyze: resolve names", "optimize: Catalyst", "execute: jobs and tasks"].map((s, i) =>
        A.box({ x: SX, y: Y - A.dy(110) + A.dy(110 * i), w: 420, h: 80, kind: "paper", title: s, size: 24 }));
      steps.forEach((b, i) => { A.in(b, 14.06 + i * 1.1); A.tl.to(b, { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1 }, 14.54 + i * 1.1); });
      ex.forEach((b, i) => A.tl.fromTo(b, { scale: 1 }, { scale: 1.12, duration: 0.3, yoyo: true, repeat: 1 }, 17.1 + i * 0.25));
      cap("The server resolves names, optimizes the plan and runs it.", 13.9, 19.18);

      // beat stream (11.5): response messages come back one by one and list in the client
      A.out(steps, 19.34);
      D.responses.forEach(([k, v], i) => {
        const p = A.box({ x: SX - A.dx(300), y: Y, w: 200, h: 54, kind: k === "arrow_batch" ? "accent" : "soft", title: k.replace("execution_", ""), size: 20 });
        A.in(p, 19.66 + i * 0.95, { rise: 0 });
        A.tl.to(p, { x: -A.X(SX - CX - 0.24), duration: 0.9, ease: "power1.inOut" }, 19.82 + i * 0.95);
        A.out(p, 21.26 + i * 0.95, { dur: 0.2 });
        const row = A.text(k + (v ? "  " + v : ""), { x: CX, y: Y - A.dy(170) + A.dy(40 * i), size: 20, mono: true,
          color: k === "arrow_batch" ? "var(--a-acc)" : "var(--a-fg)" });
        A.in(row, 21.26 + i * 0.95, { rise: 0, dur: 0.2 });
      });
      cap("Results return as a stream of messages with Arrow batches.", 19.5, 25.58);

      // beat rows (15.5): the rows, measured
      const tbl = A.table(["PULocationID", "count"], D.rows.map((r) => [r[0], r[1].toLocaleString("en-US")]), { x: CX, y: Y + A.dy(175), w: 380, size: 22, hi: -1 });
      A.in(tbl, 26.06);
      cap("The client reads three rows from 496 bytes of Arrow.", 25.9);
      A.in(A.note("message sizes measured with a gRPC proxy; timing schematic"), 0.6);
      A.finish(32);
    </script>
  </body>
</html>
