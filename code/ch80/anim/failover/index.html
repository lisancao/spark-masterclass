<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="12.5" data-width="1920" data-height="1080">
      <div id="stage"></div>
    </div>
    <script>
      // Times and log lines from code/ch80/output/ha.txt. Clip times are not to scale.
      const D = {"kill": "17.8", "start": "28.6", "alive": "31.2", "rec": "392", "exit": "54.1", "holds": 30};
      A.mount();
      A.title("The standalone master dies and comes back", "FILESYSTEM recovery, spark.deploy.recoveryDirectory");
      const mA = A.box({ x: 0.5, y: 0.27, w: 380, h: 110, kind: "ok", title: "master", sub: "ALIVE", size: 30 });
      const mX = A.box({ x: 0.5, y: 0.27, w: 380, h: 110, kind: "ghost", title: "no master", sub: "SIGKILL at " + D.kill + " s", size: 30 });
      const mR = A.box({ x: 0.5, y: 0.27, w: 380, h: 110, kind: "accent", title: "new master", sub: "RECOVERING", size: 30 });
      const mB = A.box({ x: 0.5, y: 0.27, w: 380, h: 110, kind: "ok", title: "new master", sub: "ALIVE, recovery " + D.rec + " ms", size: 30 });
      gsap.set([mX, mR, mB], { opacity: 0 });
      const fold = A.box({ x: 0.83, y: 0.27, w: 420, h: 150, kind: "paper", title: "recovery/", sub: "app_app-...-0000<br>worker_worker-...-34507<br>worker_worker-...-40913", size: 26 });
      const drv = A.box({ x: 0.16, y: 0.60, w: 320, h: 130, kind: "soft", title: "driver", sub: "client mode, laptop", size: 30 });
      const w1 = A.box({ x: 0.55, y: 0.60, w: 300, h: 130, kind: "paper", title: "worker 1", sub: "executor 0", size: 28 });
      const w2 = A.box({ x: 0.80, y: 0.60, w: 300, h: 130, kind: "paper", title: "worker 2", sub: "executor 1", size: 28 });
      const hold = A.text("hold 0s", { x: 0.16, y: 0.74, size: 30, mono: true, color: "var(--a-mute)" });
      const l1 = A.line({ x1: 0.5, y1: 0.27 + A.dy(56), x2: 0.55, y2: 0.60 - A.dy(66), width: 3 });
      const l2 = A.line({ x1: 0.5, y1: 0.27 + A.dy(56), x2: 0.80, y2: 0.60 - A.dy(66), width: 3 });
      const l3 = A.line({ x1: 0.5, y1: 0.27 + A.dy(56), x2: 0.16, y2: 0.60 - A.dy(66), width: 3 });
      A.in([mA, drv, w1, w2, l1, l2, l3, hold], 0.2, { stagger: 0.05 });
      A.in(fold, 0.6);
      // tasks: dots from the driver to the executors, all through the clip
      const send = (to, t) => {
        const d = A.dot({ x: 0.16 + A.dx(170), y: 0.60, r: 12, color: "var(--a-acc)" });
        A.tl.set(d, { opacity: 1 }, t);
        A.tl.to(d, { x: A.X(to - 0.16) - A.px(320), duration: 0.6, ease: "power1.inOut" }, t);
        A.tl.set(d, { opacity: 0 }, t + 0.6);
      };
      for (let t = 0.8; t < 10.4; t += 0.45) send(Math.round((t * 10)) % 2 ? 0.55 : 0.80, t);
      // hold counter, 30 lines over the clip
      for (let i = 1; i <= D.holds; i++) {
        A.tl.call(() => { hold.textContent = "hold " + i + "s"; }, null, 0.6 + i * 0.32);
      }
      // kill
      A.out([mA, l1, l2, l3], 2.8, { dur: 0.3 }); A.in(mX, 2.8, { rise: 0 });
      const lost = A.text("driver: Disconnected from Spark cluster! Waiting for reconnection...", { x: 0.16, y: 0.84, size: 24, mono: true, anchor: "left", color: "var(--a-warn)" });
      A.in(lost, 3.4, { rise: 0 });
      // start + read folder
      A.out(mX, 5.8, { dur: 0.3 }); A.in(mR, 5.8, { rise: 0 });
      const rd = A.line({ x1: 0.83 - A.dx(210), y1: 0.27, x2: 0.5 + A.dx(190), y2: 0.27, width: 5, color: "var(--a-acc)" });
      A.in(rd, 6.2);
      // re-register
      A.out(rd, 7.6); A.out(mR, 7.6, { dur: 0.3 }); A.in(mB, 7.6, { rise: 0 });
      A.in([l1, l2, l3], 7.8, { rise: 0 });
      const ch = A.text("driver: Master has changed, new master is at spark://127.0.0.1:7151", { x: 0.16, y: 0.89, size: 24, mono: true, anchor: "left", color: "var(--a-ok)" });
      A.in(ch, 8.0, { rise: 0 });
      const ex = A.text("app exits at " + D.exit + " s, code 0", { x: 0.16, y: 0.50, size: 28, weight: 600, color: "var(--a-ok)" });
      A.in(ex, 10.4);
      const caps = [
        [0.5, "The driver sends tasks to its executors. The master only gave out the executors."],
        [2.8, "The master gets SIGKILL at " + D.kill + " s. The tasks continue."],
        [5.8, "At " + D.start + " s a new master starts and reads the recovery folder."],
        [7.6, "The workers and the application register again. Recovery takes " + D.rec + " ms."],
        [10.0, "The application ends at " + D.exit + " s with exit code 0."],
      ];
      caps.forEach(([t, s], i) => { const c = A.text(s, { y: 0.955, size: 32, weight: 600 }); A.in(c, t); if (i < caps.length - 1) A.out(c, caps[i + 1][0] - 0.3); });
      A.finish(12.5);
    </script>
  </body>
</html>
