# Chapter 80, Step 7: an executor pod template. Spark starts from this pod and adds its own
# container command, ports, env and resources. The volume named spark-local-dir-1 becomes
# the executor's local directory for shuffle and spill files.
apiVersion: v1
kind: Pod
metadata:
  labels:
    book.chapter: "80"
  annotations:
    book/template: executor
spec:
  containers:
  - name: spark-executor
    env:
    - name: BOOK_TEMPLATE
      value: "from-the-pod-template"
    volumeMounts:
    - name: spark-local-dir-1
      mountPath: /spark-local
  volumes:
  - name: spark-local-dir-1
    emptyDir:
      sizeLimit: 2Gi
