<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="spark.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--a-w); height: var(--a-h); overflow: hidden; background: var(--a-bg); }
    </style>
  </head>
  <body>
    <!-- `anim render` rewrites data-width/data-height per format; leave them as they are. -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="12.5" data-width="1080" data-height="1920">
      <div id="stage"></div>
    </div>
    <script>
      // Times of the states are measured (zones-app.txt). Clip times ("at") are chosen to read.
      const D = {"source": "code/ch47/output/zones-app.txt", "states": [{"t": 0.1, "state": "DriverRequested", "at": 2.0}, {"t": 1.3, "state": "DriverReady", "at": 3.6}, {"t": 15.2, "state": "RunningHealthy", "at": 6.4}, {"t": 27.5, "state": "Succeeded", "at": 8.4}, {"t": 31.2, "state": "TerminatedWithoutReleaseResources", "at": 10.0}], "pods": {"driver": "zones-0-driver", "exec": ["zones-exec-1", "zones-exec-2"]}}; // data.json
      A.mount();
      // beat open (0.0)
      A.title("The operator follows a SparkApplication", "the zones application on a kind cluster");
      const yaml = A.code("kind: SparkApplication\nmetadata:\n  name: zones\nspec:\n  pyFiles: local:///opt/book/zones.py\n  sparkConf:\n    spark.executor.instances: \"2\"", { x: 0.2, y: 0.37, w: 560, size: 22, label: "zones-app.yaml" });
      const op = A.box({ x: 0.5, y: 0.30, w: 380, h: 110, kind: "paper", title: "operator", sub: "watch, update status", size: 34 });
      const api = A.box({ x: 0.5, y: 0.56, w: 300, h: 90, kind: "ghost", title: "Kubernetes API", size: 30 });
      const l1 = A.line({ x1: 0.5, y1: 0.30 + A.dy(55), x2: 0.5, y2: 0.56 - A.dy(45), width: 4 });
      const l0 = A.line({ x1: 0.2 + A.dx(280), y1: 0.37, x2: 0.5 - A.dx(150), y2: 0.56, width: 4 });
      A.in([yaml], 0.4); A.in([l0, api, l1, op], 1.0, { stagger: 0.15 });
      // pods on the right
      const node = A.box({ x: 0.81, y: 0.465, w: 470, h: 560, kind: "ghost", title: "", radius: 18 });
      const nlab = A.text("worker nodes", { x: 0.81, y: 0.465 - A.dy(250), size: 24, color: "var(--a-mute)" });
      A.in([node, nlab], 1.0);
      const drvP = A.box({ x: 0.81, y: 0.335, w: 380, h: 90, kind: "ghost", title: D.pods.driver, sub: "pending", size: 28 });
      const drv = A.box({ x: 0.81, y: 0.335, w: 380, h: 90, kind: "accent", title: D.pods.driver, sub: "driver", size: 28 });
      const ex = D.pods.exec.map((n, i) => A.box({ x: 0.81, y: 0.52 + i * 0.14, w: 380, h: 80, kind: "ok", title: n, sub: "executor", size: 26 }));
      const l2 = A.line({ x1: 0.5 + A.dx(190), y1: 0.30, x2: 0.81 - A.dx(190), y2: 0.335, width: 4, color: "var(--a-acc)" });
      // status: one chip per state, the history grows under the YAML
      const chips = [], hist = [];
      D.states.forEach((s, i) => {
        chips.push(A.box({ x: 0.5, y: 0.72, w: 560, h: 70, kind: "accent", title: s.state, size: s.state.length > 20 ? 24 : 30, radius: 35 }));
        hist.push(A.text(`${s.t.toFixed(1).padStart(5, " ")} s  ${s.state}`, { x: 0.06, y: 0.62 + i * A.dy(36), size: 22, mono: true, anchor: "left", color: "var(--a-mute)" }));
      });
      const clk = D.states.map((s) => A.text(`t = ${s.t} s`, { x: 0.5, y: 0.72 + A.dy(60), size: 24, color: "var(--a-mute)" }));
      D.states.forEach((s, i) => {
        A.in([chips[i], clk[i], hist[i]], s.at, { rise: 8, dur: 0.3 });
        if (i + 1 < D.states.length) A.out([chips[i], clk[i]], D.states[i + 1].at - 0.05, { dur: 0.05 });
      });
      A.in([l2, drvP], 2.0, { stagger: 0.1 });
      A.in(drv, 3.6); A.out(drvP, 3.9);
      A.in(ex, 5.0, { stagger: 0.3 });
      A.tl.to(ex, { opacity: 0.35, duration: 0.4 }, 8.4);
      A.tl.to(drv, { opacity: 0.35, duration: 0.4 }, 8.6);
      const caps = [
        [0.4, "You apply a SparkApplication. The operator watches for it."],
        [2.0, "The operator makes the driver pod and writes its state."],
        [5.0, "The driver asks the Kubernetes API for two executor pods."],
        [8.4, "The driver exits. The retain policy keeps the pods."],
      ];
      caps.forEach(([t, s], i) => {
        const c = A.text(s, { y: 0.88, size: 36, weight: 600 });
        A.in(c, t); if (i < caps.length - 1) A.out(c, caps[i + 1][0] - 0.3);
      });
      A.in(A.note("state times measured in one run; the clip times are not to scale"), 0.5);
      A.finish(12.5);
    </script>
  </body>
</html>
